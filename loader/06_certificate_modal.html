<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNIYO — Certificate Generation Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-violet: #6D28D9;
      --brand-violet-deep: #4C1D95;
      --brand-gold: #F59E0B;
      --brand-gold-light: #FCD34D;
      --bg-primary: #0B0F19;
      --bg-surface: #111827;
      --bg-elevated: #1A2332;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
      --success-green: #22C55E;
      --success-teal: #14B8A6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      padding: 20px;
    }
    .demo-btn {
      padding: 16px 28px;
      border-radius: 14px;
      border: none;
      background: var(--brand-violet);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.5);
    }
    .demo-btn:hover { background: var(--brand-violet-deep); }

    .cert-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      opacity: 1; visibility: visible;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 20px;
    }
    .cert-modal.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 158, 11, 0.15);
      animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      0% { transform: scale(0.9) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .cert-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(245, 158, 11, 0.15);
      border: 2px solid rgba(245, 158, 11, 0.4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; font-size: 28px;
      animation: certPulse 2s ease-in-out infinite;
    }
    @keyframes certPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
    }

    .modal-title { font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

    .checklist { text-align: left; margin-bottom: 16px; }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      margin-bottom: 6px;
      background: var(--bg-elevated);
      transition: all 0.3s ease;
      font-size: 12px; font-weight: 600;
      color: var(--text-muted);
    }
    .check-item.active {
      background: rgba(20, 184, 166, 0.1);
      color: var(--success-teal);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }
    .check-item.done {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success-green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .check-icon {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .check-item.active .check-icon {
      border-color: var(--success-teal);
      animation: spin 1s linear infinite;
    }
    .check-item.done .check-icon {
      border-color: var(--success-green);
      background: var(--success-green);
      color: #FFFFFF;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-track {
      width: 100%; height: 4px;
      background: rgba(109, 40, 217, 0.2);
      border-radius: 20px; overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-gold), var(--brand-violet));
      border-radius: 20px;
      width: 0%; transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--brand-gold);
    }

    .status-main {
      font-size: 13px; font-weight: 700;
      color: var(--text-primary);
      min-height: 18px; transition: opacity 0.2s ease;
    }
    .status-sub {
      font-size: 10px; color: var(--text-muted);
      min-height: 14px;
    }
  </style>
</head>
<body>

  <button class="demo-btn" onclick="showCertificateModal()">📜 View Certificate (Demo)</button>

  <div class="cert-modal hidden" id="certModal">
    <div class="modal-card">
      <div class="cert-icon">📜</div>
      <div class="modal-title">Generating Certificate</div>
      <div class="modal-sub">A4 Landscape • VIP Template</div>

      <div class="checklist">
        <div class="check-item" id="item1">
          <span class="check-icon">⟳</span>
          <span>Rendering gold badge...</span>
        </div>
        <div class="check-item" id="item2">
          <span class="check-icon">•</span>
          <span>Applying anti-tamper watermark...</span>
        </div>
        <div class="check-item" id="item3">
          <span class="check-icon">•</span>
          <span>Embedding student name...</span>
        </div>
        <div class="check-item" id="item4">
          <span class="check-icon">•</span>
          <span>Generating QR code...</span>
        </div>
        <div class="check-item" id="item5">
          <span class="check-icon">•</span>
          <span>Finalizing PDF...</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="certProgress"></div>
      </div>

      <div class="status-main" id="certMain">Starting...</div>
      <div class="status-sub" id="certSub">staff.py generator</div>
    </div>
  </div>

  <script>
    function showCertificateModal() {
      document.getElementById('certModal').classList.remove('hidden');
      resetChecklist();
      startGeneration();
    }

    function resetChecklist() {
      for (let i = 1; i <= 5; i++) {
        const item = document.getElementById('item' + i);
        item.classList.remove('active', 'done');
        item.querySelector('.check-icon').textContent = '•';
      }
      document.getElementById('certProgress').style.width = '0%';
      document.getElementById('certMain').textContent = 'Starting...';
      document.getElementById('certSub').textContent = 'staff.py generator';
    }

    function startGeneration() {
      const steps = [
        { item: 1, main: 'Rendering gold badge...', sub: 'VIP Gold #F59E0B', progress: 20 },
        { item: 2, main: 'Applying watermark...', sub: 'Anti-tamper protection', progress: 40 },
        { item: 3, main: 'Embedding student name...', sub: 'Abebe Kebede • Natural Science', progress: 60 },
        { item: 4, main: 'Generating QR code...', sub: 'Verification URI attached', progress: 80 },
        { item: 5, main: 'Finalizing PDF...', sub: 'Preparing download...', progress: 100 }
      ];
      let index = 0;

      function runStep() {
        if (index > 0) {
          const prevItem = document.getElementById('item' + steps[index - 1].item);
          prevItem.classList.remove('active');
          prevItem.classList.add('done');
          prevItem.querySelector('.check-icon').textContent = '✓';
        }
        if (index < steps.length) {
          const step = steps[index];
          const item = document.getElementById('item' + step.item);
          item.classList.add('active');
          item.querySelector('.check-icon').textContent = '⟳';
          document.getElementById('certMain').textContent = step.main;
          document.getElementById('certSub').textContent = step.sub;
          document.getElementById('certProgress').style.width = step.progress + '%';
          index++;
          setTimeout(runStep, 1200);
        } else {
          setTimeout(() => {
            document.getElementById('certMain').textContent = '✅ Certificate Ready!';
            document.getElementById('certSub').textContent = 'Opening document viewer...';
            setTimeout(() => { document.getElementById('certModal').classList.add('hidden'); }, 1500);
          }, 500);
        }
      }
      runStep();
    }
  </script>
</body>
</html>
