<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- Background -->
    <rect width="512" height="512" rx="100" fill="#0B0F19"/>
    
    <!-- Gradient Border -->
    <defs>
        <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6D28D9"/>
            <stop offset="100%" style="stop-color:#EC4899"/>
        </linearGradient>
    </defs>
    
    <rect x="30" y="30" width="452" height="452" rx="80" fill="none" stroke="url(#borderGradient)" stroke-width="12"/>
    
    <!-- Main Letter U -->
    <text x="256" y="310" text-anchor="middle" fill="#F8FAFC" font-size="220" font-weight="800" font-family="Poppins, Arial, sans-serif">U</text>
    
    <!-- Dot Accent -->
    <circle cx="330" cy="310" r="20" fill="#F59E0B"/>
    
    <!-- Brand Name -->
    <text x="256" y="420" text-anchor="middle" fill="#6D28D9" font-size="60" font-weight="700" font-family="Poppins, Arial, sans-serif">UNIYO</text>
</svg>
