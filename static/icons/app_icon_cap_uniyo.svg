<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Your UNIYO Purple Gradient -->
    <linearGradient id="uniyoPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#4C1D95"/>
    </linearGradient>

    <!-- Shine Effect -->
    <linearGradient id="uniyoShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.25"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#uniyoPurpleBg)"/>

  <!-- Shine Overlay -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#uniyoShine)"/>

  <!-- Inner Border -->
  <rect x="18" y="18" width="164" height="164" rx="36" fill="none" stroke="#FCD34D" stroke-width="1.5" opacity="0.3"/>

  <!-- Graduation Cap (scaled from 24x24 to 150x150, centered) -->
  <g transform="translate(100, 100) scale(6.25) translate(-12, -12)">
    <path d="M22 10v6M2 10l10-5 10 5-10 5z"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 12v5c3 3 9 3 12 0v-5"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gold Dot (accent above cap) -->
  <circle cx="100" cy="40" r="5" fill="#FCD34D"/>

  <!-- Ethiopian Flag Dots (subtle) -->
  <circle cx="80" cy="168" r="2.5" fill="#2ECC71" opacity="0.5"/>
  <circle cx="100" cy="170" r="2.5" fill="#FCD34D" opacity="0.5"/>
  <circle cx="120" cy="168" r="2.5" fill="#E74C3C" opacity="0.5"/>
</svg>
