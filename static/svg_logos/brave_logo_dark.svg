<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emblemDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#162b48;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#142f4b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowDark">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" rx="50" fill="url(#bgDark)"/>
  
  <!-- Main Circle -->
  <circle cx="250" cy="220" r="150" fill="url(#emblemDark)" stroke="url(#goldDark)" stroke-width="12"/>
  
  <!-- Inner decorative circle -->
  <circle cx="250" cy="220" r="125" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>
  
  <!-- Shield Shape -->
  <path d="M250 120 L310 150 L320 210 L290 280 L250 310 L210 280 L180 210 L190 150 Z" 
        fill="rgba(10,25,45,0.6)" stroke="#d4af37" stroke-width="4"/>
  
  <!-- Open Book -->
  <g transform="translate(225, 195)">
    <path d="M25 10 Q12 5 5 15 Q-2 25 5 35 Q12 45 25 50 Q20 40 20 30 Q20 20 25 10 Z" 
          fill="#f0e6c8" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M25 10 Q38 5 45 15 Q52 25 45 35 Q38 45 25 50 Q30 40 30 30 Q30 20 25 10 Z" 
          fill="#f0e6c8" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="25" y1="10" x2="25" y2="50" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(370, 100)" filter="url(#glowDark)">
    <polygon points="0,-20 5,-7 20,-7 8,2 12,15 0,8 -12,15 -8,2 -20,-7 -5,-7" 
             fill="#f1c40f" stroke="#d4af37" stroke-width="1.5"/>
  </g>
  
  <!-- BRAVE Text -->
  <text x="250" y="410" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="64" font-weight="bold" fill="#e8e6e1" letter-spacing="15">BRAVE</text>
  
  <!-- Subtitle -->
  <text x="250" y="445" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="#b9c0cb" letter-spacing="5">ETHIOPIAN FRESHMAN PLATFORM</text>
</svg>