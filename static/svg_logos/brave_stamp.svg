<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="stampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e8;stop-opacity:1" />
    </linearGradient>
    <filter id="stampShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="200" fill="url(#stampBg)" 
          stroke="#d4af37" stroke-width="8" filter="url(#stampShadow)"/>
  
  <!-- Middle Circle -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Dashed Circle -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#b8962e" stroke-width="2" stroke-dasharray="15,10"/>
  
  <!-- Inner Emblem Circle -->
  <circle cx="250" cy="220" r="90" fill="none" stroke="#e6b422" stroke-width="4"/>
  
  <!-- Shield -->
  <path d="M250 150 L290 175 L298 215 L278 265 L250 290 L222 265 L202 215 L210 175 Z" 
        fill="rgba(11,59,92,0.1)" stroke="#0b3b5c" stroke-width="4"/>
  
  <!-- Book -->
  <g transform="translate(235, 195) scale(1.2)">
    <path d="M25 10 Q12 5 5 15 Q-2 25 5 35 Q12 45 25 50 Q20 40 20 30 Q20 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M25 10 Q38 5 45 15 Q52 25 45 35 Q38 45 25 50 Q30 40 30 30 Q30 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="25" y1="10" x2="25" y2="50" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(320, 150)">
    <polygon points="0,-15 4,-5 15,-5 6,2 9,12 0,6 -9,12 -6,2 -15,-5 -4,-5" 
             fill="#ffd966" stroke="#e6b422" stroke-width="1.5"/>
  </g>
  
  <!-- BRAVE Text -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="36" font-weight="bold" fill="#0b2e4a" letter-spacing="8">BRAVE</text>
  
  <!-- Subtitle -->
  <text x="250" y="355" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="#6b5b3a" letter-spacing="3">OFFICIAL STAMP</text>
  
  <!-- Circular Text -->
  <path id="textPath" d="M250 440 A190 190 0 0 1 60 250" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="14" fill="#8b7a50" letter-spacing="2">
    <textPath href="#textPath">ETHIOPIAN FRESHMAN PLATFORM • BRAVE TEAMS •</textPath>
  </text>
</svg>