<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b3b5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5f7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6b422;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Rectangle Background -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" 
        fill="url(#iconBg)" filter="url(#iconShadow)"/>
  
  <!-- Subtle pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  
  <!-- Shield -->
  <path d="M256 120 L310 150 L320 210 L290 280 L256 310 L222 280 L192 210 L202 150 Z" 
        fill="rgba(255,255,255,0.15)" stroke="url(#iconGold)" stroke-width="6"/>
  
  <!-- Book -->
  <g transform="translate(231, 195) scale(1.5)">
    <path d="M25 10 Q12 5 5 15 Q-2 25 5 35 Q12 45 25 50 Q20 40 20 30 Q20 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M25 10 Q38 5 45 15 Q52 25 45 35 Q38 45 25 50 Q30 40 30 30 Q30 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="25" y1="10" x2="25" y2="50" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(380, 140) scale(1.3)">
    <polygon points="0,-20 5,-7 20,-7 8,2 12,15 0,8 -12,15 -8,2 -20,-7 -5,-7" 
             fill="#ffd966" stroke="#e6b422" stroke-width="1.5"/>
  </g>
  
  <!-- BRAVE Text -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="10">BRAVE</text>
</svg>