<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b3b5c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a5f7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6b422;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="250" cy="220" r="150" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Inner decorative circle -->
  <circle cx="250" cy="220" r="125" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5" opacity="0.3"/>
  
  <!-- Shield Shape -->
  <path d="M250 120 L310 150 L320 210 L290 280 L250 310 L210 280 L180 210 L190 150 Z" 
        fill="rgba(255,255,255,0.15)" stroke="#e6b422" stroke-width="4"/>
  
  <!-- Open Book -->
  <g transform="translate(225, 195)">
    <!-- Left page -->
    <path d="M25 10 Q12 5 5 15 Q-2 25 5 35 Q12 45 25 50 Q20 40 20 30 Q20 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M25 10 Q38 5 45 15 Q52 25 45 35 Q38 45 25 50 Q30 40 30 30 Q30 20 25 10 Z" 
          fill="#fef9e7" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="25" y1="10" x2="25" y2="50" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(370, 100)">
    <polygon points="0,-20 5,-7 20,-7 8,2 12,15 0,8 -12,15 -8,2 -20,-7 -5,-7" 
             fill="#ffd966" stroke="#e6b422" stroke-width="1.5"/>
  </g>
  
  <!-- BRAVE Text -->
  <text x="250" y="410" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="64" font-weight="bold" fill="#0b2e4a" letter-spacing="15">BRAVE</text>
  
  <!-- Subtitle -->
  <text x="250" y="445" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="#4a5b6b" letter-spacing="5">ETHIOPIAN FRESHMAN PLATFORM</text>
</svg>