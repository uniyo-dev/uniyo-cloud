<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="55mm" viewBox="0 0 50 55">
  <defs>
    <linearGradient id="diaBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="30%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#D0D0D0"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
  </defs>
  
  <!-- Diamond shape -->
  <polygon points="25,3 45,18 25,50 5,18" fill="url(#diaBadge)" stroke="#A0A0A0" stroke-width="1.5"/>
  
  <!-- Inner facets -->
  <polygon points="25,8 40,18 25,45 10,18" fill="none" stroke="#C0C0C0" stroke-width="0.8"/>
  <polygon points="25,13 35,18 25,40 15,18" fill="none" stroke="#D0D0D0" stroke-width="0.5"/>
  
  <!-- Center sparkle -->
  <polygon points="25,14 28,20 25,26 22,20" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="25" cy="20" r="1.5" fill="#FFFFFF"/>
  
  <!-- Sparkle lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.7">
    <line x1="25" y1="5" x2="25" y2="10"/>
    <line x1="25" y1="30" x2="25" y2="35"/>
    <line x1="10" y1="18" x2="15" y2="18"/>
    <line x1="35" y1="18" x2="40" y2="18"/>
  </g>
</svg>
