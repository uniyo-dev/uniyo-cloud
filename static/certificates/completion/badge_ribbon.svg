<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="60mm" viewBox="0 0 50 60">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Ribbon tails -->
  <path d="M20,45 L15,60 L20,55 L25,60 L25,45" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  <path d="M30,45 L25,60 L30,55 L35,60 L30,45" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  
  <!-- Circular badge -->
  <circle cx="25" cy="25" r="20" fill="url(#badgeGold)" stroke="#B8860B" stroke-width="2"/>
  <circle cx="25" cy="25" r="17" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Star in badge -->
  <polygon points="25,10 28,19 37,20 30,26 32,35 25,29 18,35 20,26 13,20 22,19" fill="#FFFFFF" opacity="0.8"/>
