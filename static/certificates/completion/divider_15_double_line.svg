<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="15mm" viewBox="0 0 297 15">
  <defs>
    <linearGradient id="dblDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="50%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  
  <!-- Center diamond ornament -->
  <g transform="translate(148.5,7.5)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="none" stroke="url(#dblDiv)" stroke-width="1.5"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#4A4A4A" opacity="0.3"/>
    <circle cx="0" cy="0" r="1" fill="#1A1A1A"/>
  </g>
  
  <!-- Double lines left -->
  <line x1="10" y1="6" x2="130" y2="6" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="10" y1="9" x2="130" y2="9" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Double lines right -->
  <line x1="167" y1="6" x2="287" y2="6" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="167" y1="9" x2="287" y2="9" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Connecting accents -->
  <line x1="130" y1="6" x2="130" y2="9" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="167" y1="6" x2="167" y2="9" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Small squares -->
  <rect x="120" y="5.5" width="4" height="4" fill="#1A1A1A" opacity="0.5"/>
  <rect x="173" y="5.5" width="4" height="4" fill="#1A1A1A" opacity="0.5"/>
</svg>
