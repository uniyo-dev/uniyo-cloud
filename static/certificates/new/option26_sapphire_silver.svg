<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F2027"/>
      <stop offset="25%" style="stop-color:#203A43"/>
      <stop offset="50%" style="stop-color:#2C5364"/>
      <stop offset="75%" style="stop-color:#203A43"/>
      <stop offset="100%" style="stop-color:#0F2027"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="25%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="75%" style="stop-color:#E8E8E8"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer sapphire border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#sapphireGrad)" stroke-width="5"/>
  
  <!-- Silver border -->
  <rect x="15" y="15" width="267" height="180" fill="none" stroke="url(#silverGrad)" stroke-width="2"/>
  
  <!-- Inner sapphire border -->
  <rect x="19" y="19" width="259" height="172" fill="none" stroke="url(#sapphireGrad)" stroke-width="1"/>
  
  <!-- Fine silver line -->
  <rect x="22" y="22" width="253" height="166" fill="none" stroke="url(#silverGrad)" stroke-width="0.5"/>
  
  <!-- Sapphire bands top and bottom -->
  <rect x="8" y="8" width="281" height="8" fill="url(#sapphireGrad)"/>
  <rect x="8" y="194" width="281" height="8" fill="url(#sapphireGrad)"/>
  
  <!-- Silver accent on sapphire bands -->
  <line x1="8" y1="12" x2="289" y2="12" stroke="url(#silverGrad)" stroke-width="1.5"/>
  <line x1="8" y1="198" x2="289" y2="198" stroke="url(#silverGrad)" stroke-width="1.5"/>
  
  <!-- Sapphire bands left and right -->
  <rect x="8" y="8" width="8" height="194" fill="url(#sapphireGrad)"/>
  <rect x="281" y="8" width="8" height="194" fill="url(#sapphireGrad)"/>
  
  <!-- Silver accent on left and right bands -->
  <line x1="12" y1="8" x2="12" y2="202" stroke="url(#silverGrad)" stroke-width="1.5"/>
  <line x1="285" y1="8" x2="285" y2="202" stroke="url(#silverGrad)" stroke-width="1.5"/>
  
  <!-- Subtle inner guide pattern -->
  <g stroke="#2C5364" stroke-width="0.3" opacity="0.2">
    <line x1="80" y1="24" x2="80" y2="186"/>
    <line x1="120" y1="24" x2="120" y2="186"/>
    <line x1="148.5" y1="24" x2="148.5" y2="186"/>
    <line x1="177" y1="24" x2="177" y2="186"/>
    <line x1="217" y1="24" x2="217" y2="186"/>
    <line x1="24" y1="60" x2="273" y2="60"/>
    <line x1="24" y1="105" x2="273" y2="105"/>
    <line x1="24" y1="150" x2="273" y2="150"/>
  </g>
</svg>
