<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="50mm" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="ribCurve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A1B6A"/>
      <stop offset="100%" style="stop-color:#9C27B0"/>
    </linearGradient>
  </defs>
  
  <!-- Curved ribbon -->
  <path d="M0,0 Q25,5 50,0 L50,12 Q25,17 0,12 Z" fill="url(#ribCurve)" stroke="#4A0E4E" stroke-width="0.5"/>
  
  <!-- Ribbon folds -->
  <path d="M10,6 Q15,8 10,10" fill="none" stroke="#4A0E4E" stroke-width="0.5" opacity="0.5"/>
  <path d="M40,6 Q35,8 40,10" fill="none" stroke="#4A0E4E" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Gold edge -->
  <path d="M0,12 Q25,17 50,12" fill="none" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Tails -->
  <path d="M5,12 L12,30 L5,42" fill="#9C27B0" opacity="0.6"/>
  <path d="M45,12 L38,30 L45,42" fill="#9C27B0" opacity="0.6"/>
</svg>
