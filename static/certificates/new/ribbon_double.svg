<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="55mm" viewBox="0 0 55 55">
  <defs>
    <linearGradient id="ribD1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
    <linearGradient id="ribD2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>
  
  <!-- First ribbon -->
  <rect x="0" y="0" width="55" height="10" fill="url(#ribD1)"/>
  
  <!-- Second ribbon -->
  <rect x="0" y="11" width="55" height="8" fill="url(#ribD2)"/>
  
  <!-- Tails -->
  <path d="M0,19 L10,40 L0,50" fill="#1B3A5C" opacity="0.8"/>
  <path d="M55,19 L45,40 L55,50" fill="#1B3A5C" opacity="0.8"/>
  
  <!-- Gold line separator -->
  <line x1="0" y1="10" x2="55" y2="10" stroke="#FFFFFF" stroke-width="0.5"/>
  <line x1="0" y1="19" x2="55" y2="19" stroke="#FFFFFF" stroke-width="0.5"/>
</svg>
