<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="60mm" viewBox="0 0 55 60">
  <defs>
    <linearGradient id="tpBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Ribbon ends -->
  <path d="M18,45 L12,58 L18,52 L22,58 L20,45" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  <path d="M37,45 L33,58 L37,52 L43,58 L38,45" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  
  <!-- Main badge circle -->
  <circle cx="27.5" cy="25" r="20" fill="url(#tpBadge)" stroke="#B8860B" stroke-width="2"/>
  <circle cx="27.5" cy="25" r="16" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Arrow up icon -->
  <g transform="translate(27.5,25)">
    <line x1="0" y1="10" x2="0" y2="-8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-5,-3 0,-10 5,-3" fill="#FFFFFF"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="27.5" y="55" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#B8860B" text-anchor="middle">TOP PERFORMER</text>
</svg>
