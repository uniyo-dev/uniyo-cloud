<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="30mm" viewBox="0 0 120 30">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Main banner -->
  <rect x="10" y="8" width="100" height="14" fill="url(#bannerGrad)" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Scroll ends -->
  <path d="M10,8 Q5,15 10,22" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <path d="M110,8 Q115,15 110,22" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  
  <!-- Inner line -->
  <rect x="15" y="11" width="90" height="8" fill="none" stroke="#FFF8DC" stroke-width="0.5"/>
</svg>
