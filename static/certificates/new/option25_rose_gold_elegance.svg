<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B76E79"/>
      <stop offset="25%" style="stop-color:#E8B4B8"/>
      <stop offset="50%" style="stop-color:#F5D5D8"/>
      <stop offset="75%" style="stop-color:#E8B4B8"/>
      <stop offset="100%" style="stop-color:#B76E79"/>
    </linearGradient>
    <linearGradient id="roseGoldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B76E79"/>
      <stop offset="25%" style="stop-color:#E8B4B8"/>
      <stop offset="50%" style="stop-color:#F5D5D8"/>
      <stop offset="75%" style="stop-color:#E8B4B8"/>
      <stop offset="100%" style="stop-color:#B76E79"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="6" y="6" width="285" height="198" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#roseGold)" stroke-width="4"/>
  
  <!-- Inner border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="#8B5A5A" stroke-width="1.5"/>
  
  <!-- Fine rose gold line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#roseGold)" stroke-width="0.8"/>
  
  <!-- Ultra fine inner border -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="#D4A0A0" stroke-width="0.3"/>
  
  <!-- Top rose gold band -->
  <rect x="80" y="10" width="137" height="5" fill="url(#roseGold)"/>
  
  <!-- Bottom rose gold band -->
  <rect x="80" y="195" width="137" height="5" fill="url(#roseGold)"/>
  
  <!-- Left rose gold band -->
  <rect x="10" y="80" width="5" height="50" fill="url(#roseGoldV)"/>
  
  <!-- Right rose gold band -->
  <rect x="282" y="80" width="5" height="50" fill="url(#roseGoldV)"/>
  
  <!-- Subtle dotted lines -->
  <g fill="#B76E79" opacity="0.4">
    <circle cx="70" cy="12" r="1"/>
    <circle cx="90" cy="12" r="1"/>
    <circle cx="110" cy="12" r="1"/>
    <circle cx="187" cy="12" r="1"/>
    <circle cx="207" cy="12" r="1"/>
    <circle cx="227" cy="12" r="1"/>
    
    <circle cx="70" cy="198" r="1"/>
    <circle cx="90" cy="198" r="1"/>
    <circle cx="110" cy="198" r="1"/>
    <circle cx="187" cy="198" r="1"/>
    <circle cx="207" cy="198" r="1"/>
    <circle cx="227" cy="198" r="1"/>
  </g>
  
  <!-- Center guide lines -->
  <g stroke="#D4A0A0" stroke-width="0.3" opacity="0.4">
    <line x1="148.5" y1="28" x2="148.5" y2="182"/>
    <line x1="28" y1="105" x2="269" y2="105"/>
  </g>
</svg>
