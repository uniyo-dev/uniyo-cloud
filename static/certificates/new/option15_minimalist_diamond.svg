<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="diamondGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Elegant white background -->
  <rect x="10" y="10" width="277" height="190" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
  <rect x="14" y="14" width="269" height="182" fill="none" stroke="url(#diamondGold)" stroke-width="2"/>
  
  <!-- Tiny diamond corner ornaments -->
  <g transform="translate(14,14)">
    <!-- Outer diamond -->
    <polygon points="12,0 24,12 12,24 0,12" fill="none" stroke="#DAA520" stroke-width="1.5"/>
    <!-- Inner diamond -->
    <polygon points="12,4 20,12 12,20 4,12" fill="url(#diamondGold)" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="12" cy="12" r="2" fill="#FFD700"/>
    <!-- Tiny accents -->
    <circle cx="12" cy="0" r="1.5" fill="#DAA520"/>
    <circle cx="24" cy="12" r="1.5" fill="#DAA520"/>
    <circle cx="12" cy="24" r="1.5" fill="#DAA520"/>
    <circle cx="0" cy="12" r="1.5" fill="#DAA520"/>
  </g>
  
  <g transform="translate(283,14) scale(-1,1)">
