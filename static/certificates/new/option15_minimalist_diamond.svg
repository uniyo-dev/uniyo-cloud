    <circle cx="12" cy="12" r="2" fill="#FFD700"/>
    <circle cx="12" cy="0" r="1.5" fill="#DAA520"/>
    <circle cx="24" cy="12" r="1.5" fill="#DAA520"/>
    <circle cx="12" cy="24" r="1.5" fill="#DAA520"/>
    <circle cx="0" cy="12" r="1.5" fill="#DAA520"/>
  </g>
  
  <g transform="translate(14,196) scale(1,-1)">
    <polygon points="12,0 24,12 12,24 0,12" fill="none" stroke="#DAA520" stroke-width="1.5"/>
    <polygon points="12,4 20,12 12,20 4,12" fill="url(#diamondGold)" opacity="0.3"/>
    <circle cx="12" cy="12" r="2" fill="#FFD700"/>
    <circle cx="12" cy="0" r="1.5" fill="#DAA520"/>
    <circle cx="24" cy="12" r="1.5" fill="#DAA520"/>
    <circle cx="12" cy="24" r="1.5" fill="#DAA520"/>
    <circle cx="0" cy="12" r="1.5" fill="#DAA520"/>
  </g>
  
  <g transform="translate(283,196) scale(-1,-1)">
    <polygon points="12,0 24,12 12,24 0,12" fill="none" stroke="#DAA520" stroke-width="1.5"/>
    <polygon points="12,4 20,12 12,20 4,12" fill="url(#diamondGold)" opacity="0.3"/>
    <circle cx="12" cy="12" r="2" fill="#FFD700"/>
    <circle cx="12" cy="0" r="1.5" fill="#DAA520"/>
    <circle cx="24" cy="12" r="1.5" fill="#DAA520"/>
    <circle cx="12" cy="24" r="1.5" fill="#DAA520"/>
