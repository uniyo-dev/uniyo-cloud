    <circle cx="80" cy="14" r="0.8"/>
    <circle cx="100" cy="14" r="0.8"/>
    <circle cx="120" cy="14" r="0.8"/>
    <circle cx="140" cy="14" r="0.8"/>
    <circle cx="160" cy="14" r="0.8"/>
    <circle cx="180" cy="14" r="0.8"/>
    <circle cx="200" cy="14" r="0.8"/>
    <circle cx="220" cy="14" r="0.8"/>
    <circle cx="240" cy="14" r="0.8"/>
    
    <circle cx="60" cy="196" r="0.8"/>
    <circle cx="80" cy="196" r="0.8"/>
    <circle cx="100" cy="196" r="0.8"/>
    <circle cx="120" cy="196" r="0.8"/>
    <circle cx="140" cy="196" r="0.8"/>
    <circle cx="160" cy="196" r="0.8"/>
    <circle cx="180" cy="196" r="0.8"/>
    <circle cx="200" cy="196" r="0.8"/>
