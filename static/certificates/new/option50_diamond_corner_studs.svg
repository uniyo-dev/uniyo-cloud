<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="studGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Main border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  
  <!-- Top Left Corner - Diamond Stud -->
  <g transform="translate(10,10)">
    <polygon points="20,0 35,15 20,30 5,15" fill="url(#studGold)" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="20,5 30,15 20,25 10,15" fill="none" stroke="#FFF8DC" stroke-width="1"/>
    <circle cx="20" cy="15" r="3" fill="#FFD700"/>
    <circle cx="20" cy="15" r="1.5" fill="#FFFFFF"/>
    <!-- Sparkle lines -->
    <line x1="20" y1="0" x2="20" y2="5" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="20" y1="25" x2="20" y2="30" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="5" y1="15" x2="10" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="30" y1="15" x2="35" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
  
  <!-- Top Right Corner - Diamond Stud -->
  <g transform="translate(287,10) scale(-1,1)">
    <polygon points="20,0 35,15 20,30 5,15" fill="url(#studGold)" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="20,5 30,15 20,25 10,15" fill="none" stroke="#FFF8DC" stroke-width="1"/>
    <circle cx="20" cy="15" r="3" fill="#FFD700"/>
    <circle cx="20" cy="15" r="1.5" fill="#FFFFFF"/>
    <line x1="20" y1="0" x2="20" y2="5" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="20" y1="25" x2="20" y2="30" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="5" y1="15" x2="10" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="30" y1="15" x2="35" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
  
  <!-- Bottom Left Corner - Diamond Stud -->
  <g transform="translate(10,200) scale(1,-1)">
    <polygon points="20,0 35,15 20,30 5,15" fill="url(#studGold)" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="20,5 30,15 20,25 10,15" fill="none" stroke="#FFF8DC" stroke-width="1"/>
    <circle cx="20" cy="15" r="3" fill="#FFD700"/>
    <circle cx="20" cy="15" r="1.5" fill="#FFFFFF"/>
    <line x1="20" y1="0" x2="20" y2="5" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="20" y1="25" x2="20" y2="30" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="5" y1="15" x2="10" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="30" y1="15" x2="35" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
  
  <!-- Bottom Right Corner - Diamond Stud -->
  <g transform="translate(287,200) scale(-1,-1)">
    <polygon points="20,0 35,15 20,30 5,15" fill="url(#studGold)" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="20,5 30,15 20,25 10,15" fill="none" stroke="#FFF8DC" stroke-width="1"/>
    <circle cx="20" cy="15" r="3" fill="#FFD700"/>
    <circle cx="20" cy="15" r="1.5" fill="#FFFFFF"/>
    <line x1="20" y1="0" x2="20" y2="5" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="20" y1="25" x2="20" y2="30" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="5" y1="15" x2="10" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="30" y1="15" x2="35" y2="15" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
  
  <!-- Inner border -->
  <rect x="50" y="50" width="197" height="110" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
