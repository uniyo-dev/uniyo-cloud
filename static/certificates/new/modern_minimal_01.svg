<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Single thin border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Accent line top left -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#E74C3C" stroke-width="3"/>
  
  <!-- Accent line bottom right -->
  <line x1="217" y1="190" x2="277" y2="190" stroke="#E74C3C" stroke-width="3"/>
  
  <!-- Minimal corner dots -->
  <circle cx="20" cy="20" r="2" fill="#2C3E50"/>
  <circle cx="277" cy="20" r="2" fill="#2C3E50"/>
  <circle cx="20" cy="190" r="2" fill="#2C3E50"/>
  <circle cx="277" cy="190" r="2" fill="#2C3E50"/>
</svg>
