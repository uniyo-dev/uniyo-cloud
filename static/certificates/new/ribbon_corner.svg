<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
  </defs>
  
  <!-- Ribbon banner -->
  <path d="M0,0 L40,0 L40,10 L0,10 Z" fill="url(#ribGrad)" opacity="0.8"/>
  
  <!-- Ribbon tails -->
  <path d="M0,10 L10,25 L0,40" fill="#C0392B" opacity="0.5"/>
  <path d="M40,10 L30,25 L40,40" fill="#C0392B" opacity="0.5"/>
  
  <!-- Gold edge -->
  <line x1="0" y1="10" x2="40" y2="10" stroke="#D4AF37" stroke-width="1"/>
</svg>
