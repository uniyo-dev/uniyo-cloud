<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="navyGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="navyBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="50%" style="stop-color:#2C5F8A"/>
      <stop offset="100%" style="stop-color:#1B3A5C"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer navy border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#navyBlue)" stroke-width="5"/>
  
  <!-- Gold border -->
  <rect x="15" y="15" width="267" height="180" fill="none" stroke="url(#navyGold)" stroke-width="2.5"/>
  
  <!-- Inner navy border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#navyBlue)" stroke-width="1"/>
  
  <!-- Gold accent line -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="url(#navyGold)" stroke-width="0.5"/>
  
  <!-- Navy bands top and bottom -->
  <rect x="8" y="8" width="281" height="10" fill="url(#navyBlue)"/>
  <rect x="8" y="192" width="281" height="10" fill="url(#navyBlue)"/>
  
  <!-- Gold lines on navy bands -->
  <line x1="8" y1="13" x2="289" y2="13" stroke="url(#navyGold)" stroke-width="2"/>
  <line x1="8" y1="197" x2="289" y2="197" stroke="url(#navyGold)" stroke-width="2"/>
  
  <!-- Navy bands left and right -->
  <rect x="8" y="8" width="10" height="194" fill="url(#navyBlue)"/>
  <rect x="279" y="8" width="10" height="194" fill="url(#navyBlue)"/>
  
  <!-- Gold lines on left and right bands -->
  <line x1="13" y1="8" x2="13" y2="202" stroke="url(#navyGold)" stroke-width="2"/>
  <line x1="284" y1="8" x2="284" y2="202" stroke="url(#navyGold)" stroke-width="2"/>
  
  <!-- Subtle inner pattern -->
  <g stroke="#1B3A5C" stroke-width="0.3" opacity="0.3">
    <line x1="100" y1="20" x2="100" y2="190"/>
    <line x1="148.5" y1="20" x2="148.5" y2="190"/>
    <line x1="197" y1="20" x2="197" y2="190"/>
    <line x1="20" y1="70" x2="277" y2="70"/>
    <line x1="20" y1="105" x2="277" y2="105"/>
    <line x1="20" y1="140" x2="277" y2="140"/>
  </g>
</svg>
