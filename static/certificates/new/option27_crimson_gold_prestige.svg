<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B0F1A"/>
      <stop offset="25%" style="stop-color:#8B1522"/>
      <stop offset="50%" style="stop-color:#A0182B"/>
      <stop offset="75%" style="stop-color:#8B1522"/>
      <stop offset="100%" style="stop-color:#6B0F1A"/>
    </linearGradient>
    <linearGradient id="crimsonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="4" y="4" width="289" height="202" fill="#FFFFFF"/>
  
  <!-- Thick crimson outer border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#crimsonGrad)" stroke-width="6"/>
  
  <!-- Gold border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="url(#crimsonGold)" stroke-width="2.5"/>
  
  <!-- Inner crimson border -->
  <rect x="21" y="21" width="255" height="168" fill="none" stroke="url(#crimsonGrad)" stroke-width="1"/>
  
  <!-- Fine gold inner line -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="url(#crimsonGold)" stroke-width="0.5"/>
  
  <!-- Top crimson band -->
  <rect x="8" y="8" width="281" height="12" fill="url(#crimsonGrad)"/>
  <!-- Gold line on top band -->
  <line x1="8" y1="14" x2="289" y2="14" stroke="url(#crimsonGold)" stroke-width="2"/>
  <!-- Second gold line on top band -->
  <line x1="8" y1="17" x2="289" y2="17" stroke="url(#crimsonGold)" stroke-width="1"/>
  
  <!-- Bottom crimson band -->
  <rect x="8" y="190" width="281" height="12" fill="url(#crimsonGrad)"/>
  <!-- Gold line on bottom band -->
  <line x1="8" y1="196" x2="289" y2="196" stroke="url(#crimsonGold)" stroke-width="2"/>
  <!-- Second gold line on bottom band -->
  <line x1="8" y1="193" x2="289" y2="193" stroke="url(#crimsonGold)" stroke-width="1"/>
  
  <!-- Left crimson band -->
  <rect x="8" y="8" width="12" height="194" fill="url(#crimsonGrad)"/>
  <!-- Gold line on left band -->
  <line x1="14" y1="8" x2="14" y2="202" stroke="url(#crimsonGold)" stroke-width="2"/>
  <!-- Second gold line on left band -->
  <line x1="17" y1="8" x2="17" y2="202" stroke="url(#crimsonGold)" stroke-width="1"/>
  
  <!-- Right crimson band -->
  <rect x="277" y="8" width="12" height="194" fill="url(#crimsonGrad)"/>
  <!-- Gold line on right band -->
  <line x1="283" y1="8" x2="283" y2="202" stroke="url(#crimsonGold)" stroke-width="2"/>
  <!-- Second gold line on right band -->
  <line x1="280" y1="8" x2="280" y2="202" stroke="url(#crimsonGold)" stroke-width="1"/>
  
  <!-- Subtle center guides -->
  <g stroke="#8B1522" stroke-width="0.3" opacity="0.3">
    <line x1="148.5" y1="28" x2="148.5" y2="182"/>
    <line x1="28" y1="105" x2="269" y2="105"/>
  </g>
</svg>
