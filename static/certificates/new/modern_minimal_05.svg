<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top gradient bar -->
  <rect x="20" y="20" width="257" height="6" fill="url(#flatGrad)"/>
  
  <!-- Bottom gradient bar -->
  <rect x="20" y="184" width="257" height="6" fill="url(#flatGrad)"/>
  
  <!-- Thin side borders -->
  <line x1="20" y1="20" x2="20" y2="190" stroke="#667EEA" stroke-width="1"/>
  <line x1="277" y1="20" x2="277" y2="190" stroke="#764BA2" stroke-width="1"/>
  
  <!-- Minimal corner squares -->
  <rect x="20" y="20" width="8" height="8" fill="#667EEA" opacity="0.3"/>
  <rect x="269" y="20" width="8" height="8" fill="#764BA2" opacity="0.3"/>
  <rect x="20" y="182" width="8" height="8" fill="#764BA2" opacity="0.3"/>
  <rect x="269" y="182" width="8" height="8" fill="#667EEA" opacity="0.3"/>
  
  <!-- Subtle center guide -->
  <line x1="148.5" y1="30" x2="148.5" y2="180" stroke="#ECF0F1" stroke-width="0.5" stroke-dasharray="3,3"/>
</svg>
