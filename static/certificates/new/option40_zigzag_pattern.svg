<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="zigzagPattern" x="0" y="0" width="8" height="6" patternUnits="userSpaceOnUse">
      <polyline points="0,6 4,0 8,6" fill="none" stroke="#E74C3C" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="zigzagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B0F1A"/>
      <stop offset="100%" style="stop-color:#A0182B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#zigzagRed)" stroke-width="2"/>
  
  <!-- Zigzag pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="6" fill="url(#zigzagPattern)"/>
  
  <!-- Zigzag pattern bottom - ultra thin -->
  <rect x="14" y="190" width="269" height="6" fill="url(#zigzagPattern)"/>
  
  <!-- Zigzag pattern left - ultra thin -->
  <rect x="14" y="14" width="6" height="182" fill="url(#zigzagPattern)" transform="rotate(90 17 105)"/>
  
  <!-- Zigzag pattern right - ultra thin -->
  <rect x="277" y="14" width="6" height="182" fill="url(#zigzagPattern)" transform="rotate(90 280 105)"/>
  
  <!-- Inner border -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="#8B1522" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#A0182B" stroke-width="0.5"/>
</svg>
