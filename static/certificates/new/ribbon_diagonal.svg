<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="60mm" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="ribDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Diagonal ribbon -->
  <path d="M0,0 L60,0 L45,15 L0,15 Z" fill="url(#ribDiag)" stroke="#8B6914" stroke-width="0.5"/>
  
  <!-- Fold effect -->
  <path d="M0,15 L15,0" fill="none" stroke="#8B6914" stroke-width="0.5"/>
  
  <!-- Shadow -->
  <rect x="0" y="13" width="60" height="2" fill="#000000" opacity="0.1"/>
  
  <!-- Decorative dots on ribbon -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="10" cy="5" r="1"/>
    <circle cx="20" cy="5" r="1"/>
    <circle cx="30" cy="5" r="1"/>
    <circle cx="40" cy="5" r="1"/>
    <circle cx="50" cy="5" r="1"/>
  </g>
</svg>
