    <path d="M8,25 Q12,30 15,28 Q18,32 22,30" fill="none" stroke="#8B6914" stroke-width="1"/>
    <!-- Small leaves -->
    <path d="M26,10 Q29,8 28,5 Q25,7 26,10 Z" fill="#4A7C2E" opacity="0.7"/>
    <path d="M10,26 Q8,29 5,28 Q7,25 10,26 Z" fill="#4A7C2E" opacity="0.7"/>
  </g>
  
