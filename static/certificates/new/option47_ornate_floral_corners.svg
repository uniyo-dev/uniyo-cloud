  <!-- Top Left Corner - Floral Ornament -->
  <g transform="translate(14,14)">
    <path d="M0,30 Q0,0 30,0" fill="none" stroke="url(#floralGold)" stroke-width="2.5"/>
    <path d="M5,25 Q5,5 25,5" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Flower petals -->
    <ellipse cx="15" cy="15" rx="8" ry="5" fill="#FFD700" opacity="0.4" transform="rotate(0 15 15)"/>
    <ellipse cx="15" cy="15" rx="8" ry="5" fill="#FFD700" opacity="0.4" transform="rotate(45 15 15)"/>
