<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="academicGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1B3A5C" stroke-width="3"/>
  
  <!-- Gold academic border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="url(#academicGold)" stroke-width="2"/>
  
  <!-- Inner border -->
  <rect x="21" y="21" width="255" height="168" fill="none" stroke="#1B3A5C" stroke-width="1"/>
  
  <!-- Seal placement area -->
  <circle cx="148.5" cy="150" r="30" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Seal text guide -->
  <circle cx="148.5" cy="150" r="25" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>
</svg>
