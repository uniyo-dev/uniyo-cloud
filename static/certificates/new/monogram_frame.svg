<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Ornate circle frame -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="url(#monoGold)" stroke-width="2"/>
  <circle cx="20" cy="20" r="12" fill="none" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Decorative elements -->
  <g fill="#D4AF37">
    <circle cx="20" cy="5" r="1.5"/>
    <circle cx="20" cy="35" r="1.5"/>
    <circle cx="5" cy="20" r="1.5"/>
    <circle cx="35" cy="20" r="1.5"/>
  </g>
  
  <!-- Center space for monogram -->
  <circle cx="20" cy="20" r="8" fill="none" stroke="#E0E0E0" stroke-width="0.5" stroke-dasharray="2,2"/>
</svg>
