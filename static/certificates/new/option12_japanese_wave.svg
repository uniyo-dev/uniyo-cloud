    <path d="M0,20 Q10,10 20,20 Q30,30 40,20 Q50,10 60,20" fill="none" stroke="url(#waveBlue)" stroke-width="3"/>
    <path d="M5,25 Q15,15 25,25 Q35,35 45,25 Q55,15 65,25" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M10,30 Q20,20 30,30 Q40,40 50,30 Q60,20 70,30" fill="none" stroke="url(#waveBlue)" stroke-width="1.5"/>
    <path d="M15,35 Q25,25 35,35 Q45,45 55,35 Q65,25 75,35" fill="none" stroke="#D4AF37" stroke-width="1"/>
