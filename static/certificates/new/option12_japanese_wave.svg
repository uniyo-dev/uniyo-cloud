      <stop offset="0%" style="stop-color:#1B4F72"/>
      <stop offset="100%" style="stop-color:#2E86C1"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="281" height="194" fill="#FFFFFF" stroke="#1B4F72" stroke-width="4"/>
  <rect x="14" y="14" width="269" height="182" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <rect x="18" y="18" width="261" height="174" fill="none" stroke="#1B4F72" stroke-width="0.5"/>
  
  <!-- Wave pattern in corners -->
  <g transform="translate(20,20)">
