<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <rect x="5" y="5" width="287" height="200" fill="#F8F9FA"/>
  
  <!-- Clean border with gap -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="#495057" stroke-width="1"/>
  
  <!-- Gap in border top -->
  <rect x="25" y="25" width="60" height="1" fill="#F8F9FA"/>
  
  <!-- Gap in border bottom -->
  <rect x="212" y="184" width="60" height="1" fill="#F8F9FA"/>
  
  <!-- Minimal line accents -->
  <line x1="25" y1="25" x2="85" y2="25" stroke="#495057" stroke-width="3"/>
  <line x1="212" y1="185" x2="272" y2="185" stroke="#495057" stroke-width="3"/>
  
  <!-- Tiny dots on corners -->
  <circle cx="25" cy="25" r="1.5" fill="#495057"/>
  <circle cx="272" cy="25" r="1.5" fill="#495057"/>
  <circle cx="25" cy="185" r="1.5" fill="#495057"/>
  <circle cx="272" cy="185" r="1.5" fill="#495057"/>
  
  <!-- Diagonal accent -->
  <line x1="148.5" y1="25" x2="148.5" y2="185" stroke="#E9ECEF" stroke-width="1"/>
</svg>
