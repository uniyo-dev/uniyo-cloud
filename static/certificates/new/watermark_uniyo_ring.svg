<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <rect width="297" height="210" fill="#FFFFFF"/>
  
  <!-- Center ring watermark -->
  <g transform="translate(148.5,105)" opacity="0.05">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Text on top arc -->
    <path id="topArc" d="M-45,0 A45,45 0 0,1 45,0" fill="none"/>
    <text font-family="serif" font-size="14" fill="#D4AF37" font-weight="bold">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">UNIYO OFFICIAL</textPath>
    </text>
    
    <!-- Text on bottom arc -->
    <path id="bottomArc" d="M-45,0 A45,45 0 0,0 45,0" fill="none"/>
    <text font-family="serif" font-size="12" fill="#D4AF37">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CERTIFICATE</textPath>
    </text>
    
    <!-- Center text -->
    <text x="0" y="5" font-family="serif" font-size="30" font-weight="bold" fill="#D4AF37" text-anchor="middle">UNIYO</text>
  </g>
</svg>
