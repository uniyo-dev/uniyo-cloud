<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="uniyoEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
  </defs>
  
  <rect width="297" height="210" fill="#FFFFFF"/>
  
  <!-- Large center emblem -->
  <g transform="translate(148.5,105)" opacity="0.04">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#uniyoEmblem)" stroke-width="3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#uniyoEmblem)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#uniyoEmblem)" stroke-width="0.5"/>
    
    <text x="0" y="-15" font-family="serif" font-size="50" font-weight="bold" fill="#1B3A5C" text-anchor="middle">UNIYO</text>
    <text x="0" y="10" font-family="serif" font-size="18" fill="#1B3A5C" text-anchor="middle" letter-spacing="5">OFFICIAL</text>
    <text x="0" y="30" font-family="serif" font-size="12" fill="#1B3A5C" text-anchor="middle">CERTIFICATE</text>
  </g>
</svg>
