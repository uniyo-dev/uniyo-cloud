<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="geoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Main border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  
  <!-- Top Left Corner - Geometric -->
  <g transform="translate(10,10)">
    <!-- Outer triangle -->
    <polygon points="0,40 40,0 25,0 0,25" fill="url(#geoGold)" opacity="0.3"/>
    <!-- Lines -->
    <line x1="0" y1="40" x2="40" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="25" x2="25" y2="0" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="30" x2="30" y2="0" stroke="#D4AF37" stroke-width="1"/>
    <!-- Small diamond -->
    <polygon points="20,20 25,15 30,20 25,25" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Top Right Corner - Geometric -->
  <g transform="translate(287,10) scale(-1,1)">
    <polygon points="0,40 40,0 25,0 0,25" fill="url(#geoGold)" opacity="0.3"/>
    <line x1="0" y1="40" x2="40" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="25" x2="25" y2="0" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="30" x2="30" y2="0" stroke="#D4AF37" stroke-width="1"/>
    <polygon points="20,20 25,15 30,20 25,25" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Bottom Left Corner - Geometric -->
  <g transform="translate(10,200) scale(1,-1)">
    <polygon points="0,40 40,0 25,0 0,25" fill="url(#geoGold)" opacity="0.3"/>
    <line x1="0" y1="40" x2="40" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="25" x2="25" y2="0" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="30" x2="30" y2="0" stroke="#D4AF37" stroke-width="1"/>
    <polygon points="20,20 25,15 30,20 25,25" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Bottom Right Corner - Geometric -->
  <g transform="translate(287,200) scale(-1,-1)">
    <polygon points="0,40 40,0 25,0 0,25" fill="url(#geoGold)" opacity="0.3"/>
    <line x1="0" y1="40" x2="40" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="25" x2="25" y2="0" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="30" x2="30" y2="0" stroke="#D4AF37" stroke-width="1"/>
    <polygon points="20,20 25,15 30,20 25,25" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Inner border -->
  <rect x="55" y="55" width="187" height="100" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
