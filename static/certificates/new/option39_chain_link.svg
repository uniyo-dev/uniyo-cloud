<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="chainPattern" x="0" y="0" width="8" height="6" patternUnits="userSpaceOnUse">
      <ellipse cx="2" cy="3" rx="2" ry="2.5" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
      <ellipse cx="6" cy="3" rx="2" ry="2.5" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="chainGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#chainGold)" stroke-width="2"/>
  
  <!-- Chain pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="6" fill="url(#chainPattern)"/>
  
  <!-- Chain pattern bottom - ultra thin -->
  <rect x="14" y="190" width="269" height="6" fill="url(#chainPattern)"/>
  
  <!-- Chain pattern left - ultra thin -->
  <rect x="14" y="14" width="6" height="182" fill="url(#chainPattern)" transform="rotate(90 17 105)"/>
  
  <!-- Chain pattern right - ultra thin -->
  <rect x="277" y="14" width="6" height="182" fill="url(#chainPattern)" transform="rotate(90 280 105)"/>
  
  <!-- Inner border -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="url(#chainGold)" stroke-width="0.5"/>
</svg>
