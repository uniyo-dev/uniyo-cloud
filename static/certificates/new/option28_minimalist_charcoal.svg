<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C2C2C"/>
      <stop offset="50%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#2C2C2C"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="8" y="8" width="281" height="194" fill="#FFFFFF"/>
  
  <!-- Charcoal outer border -->
  <rect x="12" y="12" width="273" height="186" fill="none" stroke="url(#charcoalGrad)" stroke-width="3"/>
  
  <!-- Inner border -->
  <rect x="17" y="17" width="263" height="176" fill="none" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Ultra fine inner line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="#4A4A4A" stroke-width="0.5"/>
  
  <!-- Top accent bar -->
  <rect x="100" y="12" width="97" height="4" fill="url(#charcoalGrad)"/>
  
  <!-- Bottom accent bar -->
  <rect x="100" y="194" width="97" height="4" fill="url(#charcoalGrad)"/>
  
  <!-- Left accent bar -->
  <rect x="12" y="88" width="4" height="34" fill="url(#charcoalGrad)"/>
  
  <!-- Right accent bar -->
  <rect x="281" y="88" width="4" height="34" fill="url(#charcoalGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#2C2C2C" stroke-width="0.2" opacity="0.15">
    <line x1="80" y1="20" x2="80" y2="190"/>
    <line x1="120" y1="20" x2="120" y2="190"/>
    <line x1="148.5" y1="20" x2="148.5" y2="190"/>
    <line x1="177" y1="20" x2="177" y2="190"/>
    <line x1="217" y1="20" x2="217" y2="190"/>
    <line x1="20" y1="60" x2="277" y2="60"/>
    <line x1="20" y1="90" x2="277" y2="90"/>
    <line x1="20" y1="120" x2="277" y2="120"/>
    <line x1="20" y1="150" x2="277" y2="150"/>
  </g>
  
  <!-- Minimalist dots -->
  <g fill="#2C2C2C" opacity="0.3">
    <circle cx="60" cy="12" r="0.8"/>
    <circle cx="80" cy="12" r="0.8"/>
    <circle cx="217" cy="12" r="0.8"/>
    <circle cx="237" cy="12" r="0.8"/>
    <circle cx="60" cy="198" r="0.8"/>
    <circle cx="80" cy="198" r="0.8"/>
    <circle cx="217" cy="198" r="0.8"/>
    <circle cx="237" cy="198" r="0.8"/>
  </g>
</svg>
