    <rect x="30" y="30" width="237" height="150" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="35" y="35" width="227" height="140" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    
    <!-- Corner texts -->
    <text x="45" y="50" font-family="serif" font-size="12" font-weight="bold" fill="#D4AF37">UNIYO</text>
    <text x="252" y="50" font-family="serif" font-size="12" font-weight="bold" fill="#D4AF37" text-anchor="end">UNIYO</text>
