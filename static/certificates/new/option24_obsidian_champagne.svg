<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="champagneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="15%" style="stop-color:#E8D5A3"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="85%" style="stop-color:#E8D5A3"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="50%" style="stop-color:#2C2C2C"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="4" y="4" width="289" height="202" fill="#FFFFFF"/>
  
  <!-- Thick obsidian outer border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#obsidianGrad)" stroke-width="6"/>
  
  <!-- Champagne gold border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="url(#champagneGrad)" stroke-width="3"/>
  
  <!-- Inner obsidian border -->
  <rect x="22" y="22" width="253" height="166" fill="none" stroke="url(#obsidianGrad)" stroke-width="1.5"/>
  
  <!-- Fine champagne line -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="url(#champagneGrad)" stroke-width="0.5"/>
  
  <!-- Top champagne band -->
  <rect x="60" y="8" width="177" height="6" fill="url(#champagneGrad)"/>
  
  <!-- Bottom champagne band -->
  <rect x="60" y="196" width="177" height="6" fill="url(#champagneGrad)"/>
  
  <!-- Left champagne band -->
  <rect x="8" y="60" width="6" height="90" fill="url(#champagneGrad)"/>
  
  <!-- Right champagne band -->
  <rect x="283" y="60" width="6" height="90" fill="url(#champagneGrad)"/>
  
  <!-- Obsidian accent lines -->
  <g stroke="#1A1A1A" stroke-width="0.5" opacity="0.4">
    <line x1="70" y1="8" x2="70" y2="14"/>
    <line x1="90" y1="8" x2="90" y2="14"/>
    <line x1="110" y1="8" x2="110" y2="14"/>
    <line x1="187" y1="8" x2="187" y2="14"/>
    <line x1="207" y1="8" x2="207" y2="14"/>
    <line x1="227" y1="8" x2="227" y2="14"/>
    
    <line x1="70" y1="196" x2="70" y2="202"/>
    <line x1="90" y1="196" x2="90" y2="202"/>
    <line x1="110" y1="196" x2="110" y2="202"/>
    <line x1="187" y1="196" x2="187" y2="202"/>
    <line x1="207" y1="196" x2="207" y2="202"/>
    <line x1="227" y1="196" x2="227" y2="202"/>
  </g>
  
  <!-- Subtle center guides -->
  <g stroke="#C9A84C" stroke-width="0.3" opacity="0.5">
    <line x1="148.5" y1="30" x2="148.5" y2="180"/>
    <line x1="30" y1="105" x2="267" y2="105"/>
  </g>
</svg>
