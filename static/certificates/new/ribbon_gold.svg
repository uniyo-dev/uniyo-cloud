<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="55mm" viewBox="0 0 55 55">
  <defs>
    <linearGradient id="ribGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="30%" style="stop-color:#FFF8DC"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="70%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Main gold ribbon -->
  <rect x="0" y="0" width="55" height="14" fill="url(#ribGold)" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Inner decorative line -->
  <rect x="3" y="3" width="49" height="8" fill="none" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Ribbon tails -->
  <path d="M5,14 L12,35 L5,50" fill="#D4AF37" stroke="#B8860B" stroke-width="0.5"/>
  <path d="M50,14 L43,35 L50,50" fill="#D4AF37" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Shine effect -->
  <line x1="0" y1="2" x2="55" y2="2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="11" x2="55" y2="11" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
</svg>
