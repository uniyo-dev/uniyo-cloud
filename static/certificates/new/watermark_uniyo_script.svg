  <g transform="translate(148.5,105)" opacity="0.04">
    <!-- Decorative lines -->
    <line x1="-70" y1="-25" x2="70" y2="-25" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="-70" y1="25" x2="70" y2="25" stroke="#D4AF37" stroke-width="0.5"/>
    
    <!-- Main text -->
