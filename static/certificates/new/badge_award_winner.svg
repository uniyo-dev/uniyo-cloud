  </defs>
  
  <!-- Ribbon tails -->
  <path d="M20,40 L15,58 L20,52 L25,58 L22,40" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  <path d="M35,40 L30,58 L35,52 L40,58 L37,40" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  
  <!-- Main rosette -->
