  <path d="M23,22 L23,25 Q23,27 27.5,27 Q32,27 32,25 L32,22" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <line x1="22" y1="29" x2="33" y2="29" stroke="#B8860B" stroke-width="1"/>
  <line x1="25" y1="29" x2="25" y2="31" stroke="#B8860B" stroke-width="1"/>
  <line x1="30" y1="29" x2="30" y2="31" stroke="#B8860B" stroke-width="1"/>
  <line x1="23" y1="31" x2="32" y2="31" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Text -->
