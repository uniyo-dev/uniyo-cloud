<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="corpBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top corporate band -->
  <rect x="10" y="10" width="277" height="10" fill="url(#corpBlue)"/>
  
  <!-- Bottom corporate band -->
  <rect x="10" y="190" width="277" height="10" fill="url(#corpBlue)"/>
  
  <!-- Main border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1B3A5C" stroke-width="2"/>
  
  <!-- Inner line -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="#2C5F8A" stroke-width="1"/>
  
  <!-- Side accent lines -->
  <line x1="16" y1="40" x2="281" y2="40" stroke="#2C5F8A" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="16" y1="170" x2="281" y2="170" stroke="#2C5F8A" stroke-width="0.5" stroke-dasharray="4,4"/>
</svg>
