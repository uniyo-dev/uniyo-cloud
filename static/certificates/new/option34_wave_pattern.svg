<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="wavePattern" x="0" y="0" width="12" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,4 Q3,0 6,4 Q9,8 12,4" fill="none" stroke="#2E86C1" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="waveBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B4F72"/>
      <stop offset="50%" style="stop-color:#2E86C1"/>
      <stop offset="100%" style="stop-color:#1B4F72"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#waveBlue)" stroke-width="2.5"/>
  
  <!-- Wave pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="8" fill="url(#wavePattern)"/>
  
  <!-- Wave pattern bottom - ultra thin -->
  <rect x="14" y="188" width="269" height="8" fill="url(#wavePattern)"/>
  
  <!-- Wave pattern left - ultra thin -->
  <rect x="14" y="14" width="8" height="182" fill="url(#wavePattern)" transform="rotate(90 18 105)"/>
  
  <!-- Wave pattern right - ultra thin -->
  <rect x="275" y="14" width="8" height="182" fill="url(#wavePattern)" transform="rotate(90 279 105)"/>
  
  <!-- Inner border -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="#1B4F72" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="32" y="32" width="233" height="146" fill="none" stroke="#2E86C1" stroke-width="0.5"/>
</svg>
