<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8C8C8C"/>
      <stop offset="20%" style="stop-color:#D4D4D4"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="80%" style="stop-color:#D4D4D4"/>
      <stop offset="100%" style="stop-color:#8C8C8C"/>
    </linearGradient>
    <linearGradient id="platinumV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8C8C8C"/>
      <stop offset="20%" style="stop-color:#D4D4D4"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="80%" style="stop-color:#D4D4D4"/>
      <stop offset="100%" style="stop-color:#8C8C8C"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="6" y="6" width="285" height="198" fill="#FFFFFF"/>
  
  <!-- Outer platinum border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#platinumGrad)" stroke-width="4"/>
  
  <!-- Dark inner border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="#2C2C2C" stroke-width="2"/>
  
  <!-- Inner platinum line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#platinumGrad)" stroke-width="1"/>
  
  <!-- Ultra fine inner border -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="#2C2C2C" stroke-width="0.5"/>
  
  <!-- Platinum accent bars top and bottom -->
  <rect x="120" y="10" width="57" height="4" fill="url(#platinumGrad)"/>
  <rect x="120" y="196" width="57" height="4" fill="url(#platinumGrad)"/>
  
  <!-- Platinum accent bars left and right -->
  <rect x="10" y="90" width="4" height="30" fill="url(#platinumV)"/>
  <rect x="283" y="90" width="4" height="30" fill="url(#platinumV)"/>
  
  <!-- Subtle center guide lines -->
  <g stroke="#D4D4D4" stroke-width="0.5" opacity="0.6">
    <line x1="148.5" y1="24" x2="148.5" y2="186"/>
    <line x1="24" y1="105" x2="273" y2="105"/>
  </g>
  
  <!-- Fine platinum dots -->
  <g fill="#A0A0A0" opacity="0.4">
    <circle cx="70" cy="10" r="1"/>
    <circle cx="100" cy="10" r="1"/>
    <circle cx="197" cy="10" r="1"/>
    <circle cx="227" cy="10" r="1"/>
    <circle cx="70" cy="200" r="1"/>
    <circle cx="100" cy="200" r="1"/>
    <circle cx="197" cy="200" r="1"/>
    <circle cx="227" cy="200" r="1"/>
  </g>
</svg>
