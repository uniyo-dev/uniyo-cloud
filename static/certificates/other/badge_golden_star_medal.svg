<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="65mm" viewBox="0 0 55 65">
  <defs>
    <linearGradient id="gsmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="40%" style="stop-color:#FFF8DC"/>
      <stop offset="60%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Ribbon -->
  <rect x="22" y="5" width="11" height="20" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  <rect x="22" y="5" width="11" height="20" fill="url(#gsmGold)" opacity="0.3"/>
  
  <!-- Ribbon stripes -->
  <line x1="22" y1="8" x2="33" y2="8" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  <line x1="22" y1="12" x2="33" y2="12" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  <line x1="22" y1="16" x2="33" y2="16" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Main star -->
  <polygon points="27.5,25 32,35 42,36 35,43 37,53 27.5,47 18,53 20,43 13,36 23,35" fill="url(#gsmGold)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Inner star detail -->
  <polygon points="27.5,30 31,36 37,37 33,42 34,48 27.5,44 21,48 22,42 18,37 24,36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Center gem -->
  <circle cx="27.5" cy="38" r="3" fill="#E74C3C"/>
  <circle cx="27.5" cy="38" r="1.5" fill="#FF6B6B"/>
