<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="bandGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="20%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="80%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top gold band -->
  <rect x="10" y="10" width="277" height="15" fill="url(#bandGold)"/>
  
  <!-- Bottom gold band -->
  <rect x="10" y="185" width="277" height="15" fill="url(#bandGold)"/>
  
  <!-- Left gold band -->
  <rect x="10" y="10" width="15" height="190" fill="url(#bandGold)"/>
  
  <!-- Right gold band -->
  <rect x="272" y="10" width="15" height="190" fill="url(#bandGold)"/>
  
  <!-- Inner border -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Fine inner line -->
  <rect x="35" y="35" width="227" height="140" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
</svg>
