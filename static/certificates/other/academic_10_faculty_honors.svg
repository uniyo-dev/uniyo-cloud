<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="fhNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Double outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#fhNavy)" stroke-width="3"/>
  <rect x="14" y="14" width="269" height="182" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Inner border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#fhNavy)" stroke-width="1"/>
  
  <!-- Book emblem top center -->
  <g transform="translate(148.5,32)">
    <path d="M-15,-8 Q0,-12 15,-8 L15,8 Q0,4 -15,8 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="0" y1="-12" x2="0" y2="4" stroke="#D4AF37" stroke-width="1"/>
  </g>
  
  <!-- Seal area with radiating lines -->
  <circle cx="148.5" cy="155" r="28" fill="none" stroke="#1B3A5C" stroke-width="1.5"/>
  <g stroke="#D4AF37" stroke-width="0.3" opacity="0.5">
    <line x1="148.5" y1="135" x2="148.5" y2="145"/>
    <line x1="148.5" y1="165" x2="148.5" y2="175"/>
    <line x1="128.5" y1="155" x2="138.5" y2="155"/>
    <line x1="158.5" y1="155" x2="168.5" y2="155"/>
  </g>
  
  <!-- Department line placeholder -->
  <line x1="100" y1="45" x2="197" y2="45" stroke="#D4AF37" stroke-width="0.8"/>
</svg>
