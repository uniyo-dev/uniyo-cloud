<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="sclPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3E0A3E"/>
      <stop offset="50%" style="stop-color:#6A1B6A"/>
      <stop offset="100%" style="stop-color:#3E0A3E"/>
    </linearGradient>
    <linearGradient id="sclGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFEF8"/>
  
  <!-- Outer purple border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#sclPurple)" stroke-width="5"/>
  
  <!-- Luxurious gold border -->
  <rect x="18" y="18" width="261" height="174" fill="none" stroke="url(#sclGold)" stroke-width="3"/>
  
  <!-- Inner purple border -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="url(#sclPurple)" stroke-width="1"/>
  
  <!-- Fine gold line -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="#FFD700" stroke-width="0.5"/>
  
  <!-- Crown emblem top center -->
  <g transform="translate(148.5,32)">
    <path d="M-12,5 L-8,-5 L-3,0 L0,-8 L3,0 L8,-5 L12,5 Z" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <circle cx="0" cy="-5" r="2" fill="#FFD700"/>
    <line x1="-12" y1="5" x2="12" y2="5" stroke="#FFD700" stroke-width="1"/>
  </g>
  
  <!-- Seal area -->
  <circle cx="148.5" cy="158" r="30" fill="none" stroke="#6A1B6A" stroke-width="1.5"/>
  <circle cx="148.5" cy="158" r="25" fill="none" stroke="#FFD700" stroke-width="0.8"/>
  
  <!-- Signature lines -->
  <line x1="65" y1="148" x2="125" y2="148" stroke="#6A1B6A" stroke-width="0.8"/>
  <line x1="172" y1="148" x2="232" y2="148" stroke="#6A1B6A" stroke-width="0.8"/>
</svg>
