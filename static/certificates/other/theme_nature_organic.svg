<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="natureGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D5016"/>
      <stop offset="50%" style="stop-color:#4A7C2E"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
    <linearGradient id="natureLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7C2E"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFEF8"/>
  
  <!-- Outer organic border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#natureGreen)" stroke-width="3"/>
  
  <!-- Inner border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="#4A7C2E" stroke-width="1.5"/>
  
  <!-- Leaf accent top center -->
  <g transform="translate(148.5,10)">
    <path d="M0,0 Q-8,-8 -12,-4 Q-8,0 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q8,-8 12,-4 Q8,0 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q-6,-6 -8,-2 Q-5,1 0,0" fill="#4A7C2E" opacity="0.4"/>
    <path d="M0,0 Q6,-6 8,-2 Q5,1 0,0" fill="#4A7C2E" opacity="0.4"/>
  </g>
  
  <!-- Leaf accent bottom center -->
  <g transform="translate(148.5,200)">
    <path d="M0,0 Q-8,8 -12,4 Q-8,0 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q8,8 12,4 Q8,0 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q-6,6 -8,2 Q-5,-1 0,0" fill="#4A7C2E" opacity="0.4"/>
    <path d="M0,0 Q6,6 8,2 Q5,-1 0,0" fill="#4A7C2E" opacity="0.4"/>
  </g>
  
  <!-- Vine accent left center -->
  <g transform="translate(10,105)">
    <path d="M0,0 Q-8,-8 -4,-12 Q0,-8 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q-8,8 -4,12 Q0,8 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
  </g>
  
  <!-- Vine accent right center -->
  <g transform="translate(287,105)">
    <path d="M0,0 Q8,-8 4,-12 Q0,-8 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
    <path d="M0,0 Q8,8 4,12 Q0,8 0,0" fill="url(#natureLeaf)" opacity="0.6"/>
  </g>
  
  <!-- Fine inner line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="#4A7C2E" stroke-width="0.5"/>
</svg>
