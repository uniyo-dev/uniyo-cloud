<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="60mm" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="exStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Outer burst lines -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.4">
    <line x1="30" y1="2" x2="30" y2="8"/>
    <line x1="30" y1="52" x2="30" y2="58"/>
    <line x1="2" y1="30" x2="8" y2="30"/>
    <line x1="52" y1="30" x2="58" y2="30"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="46" y1="10" x2="50" y2="14"/>
    <line x1="10" y1="50" x2="14" y2="46"/>
    <line x1="46" y1="50" x2="50" y2="46"/>
  </g>
  
  <!-- Main star -->
  <polygon points="30,5 35,20 50,22 38,32 42,47 30,39 18,47 22,32 10,22 25,20" fill="url(#exStar)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Inner star -->
  <polygon points="30,12 34,22 44,24 36,31 39,42 30,36 21,42 24,31 16,24 26,22" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  
  <!-- Center dot -->
  <circle cx="30" cy="28" r="4" fill="#FFF8DC"/>
  <circle cx="30" cy="28" r="2" fill="#D4AF37"/>
</svg>
