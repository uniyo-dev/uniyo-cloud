<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="luxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="20%" style="stop-color:#FFF8DC"/>
      <stop offset="40%" style="stop-color:#FFD700"/>
      <stop offset="60%" style="stop-color:#FFF8DC"/>
      <stop offset="80%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFF8DC"/>
    </linearGradient>
    <linearGradient id="luxNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer luxury navy border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#luxNavy)" stroke-width="6"/>
  
  <!-- Gold metallic border -->
  <rect x="17" y="17" width="263" height="176" fill="none" stroke="url(#luxGrad)" stroke-width="3"/>
  
  <!-- Inner luxury border -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="url(#luxNavy)" stroke-width="1.5"/>
  
  <!-- Ultra fine metallic line -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="url(#luxGrad)" stroke-width="0.5"/>
  
  <!-- Metallic corner accents -->
  <g stroke="#FFD700" stroke-width="2">
    <line x1="8" y1="40" x2="40" y2="8"/>
    <line x1="257" y1="8" x2="289" y2="40"/>
    <line x1="8" y1="170" x2="40" y2="202"/>
    <line x1="257" y1="202" x2="289" y2="170"/>
  </g>
</svg>
