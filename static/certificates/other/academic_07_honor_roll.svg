<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="hrBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="50%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#1A237E"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top band -->
  <rect x="10" y="10" width="277" height="20" fill="url(#hrBlue)"/>
  <line x1="10" y1="25" x2="287" y2="25" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Bottom band -->
  <rect x="10" y="180" width="277" height="20" fill="url(#hrBlue)"/>
  <line x1="10" y1="185" x2="287" y2="185" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Side bands -->
  <rect x="10" y="10" width="20" height="190" fill="url(#hrBlue)"/>
  <line x1="25" y1="10" x2="25" y2="200" stroke="#D4AF37" stroke-width="2"/>
  
  <rect x="267" y="10" width="20" height="190" fill="url(#hrBlue)"/>
  <line x1="272" y1="10" x2="272" y2="200" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Inner border -->
  <rect x="35" y="35" width="227" height="140" fill="none" stroke="#283593" stroke-width="1.5"/>
  
  <!-- Decorative star top center -->
  <g transform="translate(148.5,42)">
    <polygon points="0,-8 2,-3 8,-3 3,2 5,8 0,5 -5,8 -3,2 -8,-3 -2,-3" fill="#D4AF37"/>
  </g>
  
  <!-- Ribbon placeholder bottom -->
  <g transform="translate(148.5,165)">
    <rect x="-25" y="-8" width="50" height="16" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
</svg>
