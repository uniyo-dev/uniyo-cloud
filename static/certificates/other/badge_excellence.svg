<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="55mm" viewBox="0 0 55 55">
  <defs>
    <linearGradient id="excBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C5F8A"/>
      <stop offset="50%" style="stop-color:#3A7BD5"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circular badge -->
  <circle cx="27.5" cy="27.5" r="22" fill="url(#excBadge)" stroke="#1B3A5C" stroke-width="2"/>
  
  <!-- Inner decorative ring -->
  <circle cx="27.5" cy="27.5" r="18" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Decorative dots -->
  <g fill="#D4AF37">
    <circle cx="27.5" cy="6" r="1.5"/>
    <circle cx="27.5" cy="49" r="1.5"/>
    <circle cx="6" cy="27.5" r="1.5"/>
    <circle cx="49" cy="27.5" r="1.5"/>
    <circle cx="12" cy="12" r="1"/>
    <circle cx="43" cy="12" r="1"/>
    <circle cx="12" cy="43" r="1"/>
    <circle cx="43" cy="43" r="1"/>
  </g>
  
  <!-- Center star burst -->
  <g transform="translate(27.5,27.5)">
    <polygon points="0,-12 3,-4 12,-4 4,2 7,11 0,6 -7,11 -4,2 -12,-4 -3,-4" fill="#FFD700"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Text below -->
  <text x="27.5" y="48" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#FFD700" text-anchor="middle">EXCELLENCE</text>
</svg>
