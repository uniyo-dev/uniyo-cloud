<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="emeraldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B3D0B"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#0B3D0B"/>
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top emerald band -->
  <rect x="10" y="10" width="277" height="14" fill="url(#emeraldBand)"/>
  <!-- Gold line on top band -->
  <line x1="10" y1="17" x2="287" y2="17" stroke="url(#emeraldGold)" stroke-width="1.5"/>
  <!-- Second gold line -->
  <line x1="10" y1="20" x2="287" y2="20" stroke="url(#emeraldGold)" stroke-width="0.8"/>
  
  <!-- Bottom emerald band -->
  <rect x="10" y="186" width="277" height="14" fill="url(#emeraldBand)"/>
  <!-- Gold line on bottom band -->
  <line x1="10" y1="193" x2="287" y2="193" stroke="url(#emeraldGold)" stroke-width="1.5"/>
  <!-- Second gold line -->
  <line x1="10" y1="190" x2="287" y2="190" stroke="url(#emeraldGold)" stroke-width="0.8"/>
  
  <!-- Left emerald band -->
  <rect x="10" y="10" width="14" height="190" fill="url(#emeraldBand)"/>
  <!-- Gold line on left band -->
  <line x1="17" y1="10" x2="17" y2="200" stroke="url(#emeraldGold)" stroke-width="1.5"/>
  <!-- Second gold line -->
  <line x1="20" y1="10" x2="20" y2="200" stroke="url(#emeraldGold)" stroke-width="0.8"/>
  
  <!-- Right emerald band -->
  <rect x="273" y="10" width="14" height="190" fill="url(#emeraldBand)"/>
  <!-- Gold line on right band -->
  <line x1="280" y1="10" x2="280" y2="200" stroke="url(#emeraldGold)" stroke-width="1.5"/>
  <!-- Second gold line -->
  <line x1="277" y1="10" x2="277" y2="200" stroke="url(#emeraldGold)" stroke-width="0.8"/>
  
  <!-- Inner border -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Fine inner line -->
  <rect x="35" y="35" width="227" height="140" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
</svg>
