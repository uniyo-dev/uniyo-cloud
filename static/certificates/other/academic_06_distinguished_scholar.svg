<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="dsMaroon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A0E0E"/>
      <stop offset="50%" style="stop-color:#800020"/>
      <stop offset="100%" style="stop-color:#4A0E0E"/>
    </linearGradient>
    <linearGradient id="dsGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFEF8"/>
  
  <!-- Outer maroon border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#dsMaroon)" stroke-width="4"/>
  
  <!-- Gold border -->
  <rect x="17" y="17" width="263" height="176" fill="none" stroke="url(#dsGold)" stroke-width="2"/>
  
  <!-- Inner maroon border -->
  <rect x="22" y="22" width="253" height="166" fill="none" stroke="url(#dsMaroon)" stroke-width="1"/>
  
  <!-- Fine gold line -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
  
  <!-- Top center medallion -->
  <g transform="translate(148.5,32)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#800020" stroke-width="1"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#D4AF37"/>
  </g>
  
  <!-- Seal area -->
  <circle cx="148.5" cy="158" r="28" fill="none" stroke="#800020" stroke-width="1.5"/>
  <circle cx="148.5" cy="158" r="23" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="4,4"/>
  
  <!-- Signature lines -->
  <line x1="70" y1="145" x2="130" y2="145" stroke="#800020" stroke-width="0.8"/>
  <line x1="167" y1="145" x2="227" y2="145" stroke="#800020" stroke-width="0.8"/>
</svg>
