<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="gradNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="12" y="12" width="273" height="186" fill="none" stroke="url(#gradNavy)" stroke-width="3"/>
  
  <!-- Double gold lines -->
  <rect x="18" y="18" width="261" height="174" fill="none" stroke="url(#gradGold)" stroke-width="1.5"/>
  <rect x="21" y="21" width="255" height="168" fill="none" stroke="url(#gradGold)" stroke-width="1"/>
  
  <!-- Inner navy line -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="url(#gradNavy)" stroke-width="0.8"/>
  
  <!-- Decorative top center -->
  <g transform="translate(148.5,30)">
    <polygon points="0,-15 10,0 0,15 -10,0" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
  </g>
  
  <!-- Seal area -->
  <circle cx="148.5" cy="160" r="25" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="148.5" cy="160" r="20" fill="none" stroke="#1B3A5C" stroke-width="0.5"/>
  
  <!-- Signature lines -->
  <line x1="60" y1="150" x2="120" y2="150" stroke="#1B3A5C" stroke-width="0.5"/>
  <line x1="177" y1="150" x2="237" y2="150" stroke="#1B3A5C" stroke-width="0.5"/>
</svg>
