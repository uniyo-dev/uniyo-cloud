<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="crimsonBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B0F1A"/>
      <stop offset="50%" style="stop-color:#A0182B"/>
      <stop offset="100%" style="stop-color:#6B0F1A"/>
    </linearGradient>
    <linearGradient id="crimsonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top crimson band -->
  <rect x="10" y="10" width="277" height="13" fill="url(#crimsonBand)"/>
  <!-- Gold line on top band -->
  <line x1="10" y1="16" x2="287" y2="16" stroke="url(#crimsonGold)" stroke-width="1.5"/>
  
  <!-- Bottom crimson band -->
  <rect x="10" y="187" width="277" height="13" fill="url(#crimsonBand)"/>
  <!-- Gold line on bottom band -->
  <line x1="10" y1="194" x2="287" y2="194" stroke="url(#crimsonGold)" stroke-width="1.5"/>
  
  <!-- Left crimson band -->
  <rect x="10" y="10" width="13" height="190" fill="url(#crimsonBand)"/>
  <!-- Gold line on left band -->
  <line x1="16" y1="10" x2="16" y2="200" stroke="url(#crimsonGold)" stroke-width="1.5"/>
  
  <!-- Right crimson band -->
  <rect x="274" y="10" width="13" height="190" fill="url(#crimsonBand)"/>
  <!-- Gold line on right band -->
  <line x1="281" y1="10" x2="281" y2="200" stroke="url(#crimsonGold)" stroke-width="1.5"/>
  
  <!-- Inner border -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="#A0182B" stroke-width="2"/>
  
  <!-- Fine inner line -->
  <rect x="33" y="33" width="231" height="144" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
</svg>
