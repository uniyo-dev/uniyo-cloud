<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="modAcadBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="100%" style="stop-color:#3949AB"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top academic band -->
  <rect x="10" y="10" width="277" height="15" fill="url(#modAcadBlue)"/>
  
  <!-- Bottom academic band -->
  <rect x="10" y="185" width="277" height="15" fill="url(#modAcadBlue)"/>
  
  <!-- Left academic band -->
  <rect x="10" y="10" width="15" height="190" fill="url(#modAcadBlue)"/>
  
  <!-- Right academic band -->
  <rect x="272" y="10" width="15" height="190" fill="url(#modAcadBlue)"/>
  
  <!-- Gold accent lines on bands -->
  <g stroke="#D4AF37" stroke-width="1.5">
    <line x1="10" y1="19" x2="287" y2="19"/>
    <line x1="10" y1="191" x2="287" y2="191"/>
    <line x1="19" y1="10" x2="19" y2="200"/>
    <line x1="278" y1="10" x2="278" y2="200"/>
  </g>
  
  <!-- Inner border -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#3949AB" stroke-width="1.5"/>
  
  <!-- Seal placeholder -->
  <circle cx="148.5" cy="145" r="30" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,4"/>
