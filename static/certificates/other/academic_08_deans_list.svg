<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="dlGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B3D0B"/>
      <stop offset="50%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#0B3D0B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer green border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#dlGreen)" stroke-width="4"/>
  
  <!-- Gold inner border -->
  <rect x="15" y="15" width="267" height="180" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Inner green border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#dlGreen)" stroke-width="1"/>
  
  <!-- Laurel wreath top center -->
  <g transform="translate(148.5,30)">
    <path d="M0,-10 Q-15,-5 -20,0 Q-15,5 0,0" fill="none" stroke="#2E7D32" stroke-width="1.5"/>
    <path d="M0,-10 Q15,-5 20,0 Q15,5 0,0" fill="none" stroke="#2E7D32" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="3" fill="#D4AF37"/>
  </g>
  
  <!-- Seal area -->
  <circle cx="148.5" cy="155" r="25" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <circle cx="148.5" cy="155" r="20" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="3,3"/>
  
  <!-- Date line -->
  <line x1="120" y1="175" x2="177" y2="175" stroke="#1B5E20" stroke-width="0.8"/>
</svg>
