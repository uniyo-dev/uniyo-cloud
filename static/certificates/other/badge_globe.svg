<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="50mm" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="globeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86C1"/>
      <stop offset="100%" style="stop-color:#1B4F72"/>
    </linearGradient>
  </defs>
  
  <!-- Globe circle -->
  <circle cx="25" cy="25" r="20" fill="url(#globeBlue)" stroke="#0A1628" stroke-width="2"/>
  
  <!-- Latitude lines -->
  <ellipse cx="25" cy="25" rx="20" ry="8" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="25" cy="25" rx="20" ry="14" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Longitude lines -->
  <ellipse cx="25" cy="25" rx="8" ry="20" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="25" cy="25" rx="14" ry="20" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Equator -->
  <line x1="5" y1="25" x2="45" y2="25" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Continents (simplified) -->
  <path d="M15,18 Q18,15 20,18 Q22,20 20,22 Q18,24 15,22 Q13,20 15,18 Z" fill="#4CAF50" opacity="0.6"/>
  <path d="M28,15 Q32,13 34,16 Q36,18 34,20 Q32,22 28,20 Q26,18 28,15 Z" fill="#4CAF50" opacity="0.6"/>
  <path d="M25,28 Q28,26 30,28 Q32,30 30,32 Q28,34 25,32 Q23,30 25,28 Z" fill="#4CAF50" opacity="0.5"/>
  
  <!-- Stand -->
  <line x1="25" y1="45" x2="25" y2="48" stroke="#D4AF37" stroke-width="2"/>
  <line x1="18" y1="48" x2="32" y2="48" stroke="#D4AF37" stroke-width="2"/>
</svg>
