<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="uniNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
    <linearGradient id="uniGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Thick navy outer border -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="url(#uniNavy)" stroke-width="5"/>
  
  <!-- Gold border -->
  <rect x="15" y="15" width="267" height="180" fill="none" stroke="url(#uniGold)" stroke-width="2"/>
  
  <!-- Inner navy border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#uniNavy)" stroke-width="1"/>
  
  <!-- Seal area bottom center -->
  <circle cx="148.5" cy="160" r="25" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="148.5" cy="160" r="20" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="3,3"/>
  
  <!-- Top ribbon placeholder -->
  <rect x="120" y="28" width="57" height="20" fill="none" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Decorative lines for title area -->
  <line x1="100" y1="55" x2="197" y2="55" stroke="#D4AF37" stroke-width="1"/>
  <line x1="110" y1="58" x2="187" y2="58" stroke="#D4AF37" stroke-width="0.5"/>
</svg>
