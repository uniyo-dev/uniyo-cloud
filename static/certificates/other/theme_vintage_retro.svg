<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="vintageSepia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#6B4226"/>
    </linearGradient>
    <pattern id="agedPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#A0522D" opacity="0.1"/>
      <circle cx="30" cy="25" r="1.5" fill="#8B6914" opacity="0.08"/>
      <circle cx="45" cy="40" r="0.8" fill="#6B4226" opacity="0.12"/>
    </pattern>
  </defs>
  
  <!-- Parchment background -->
  <rect x="5" y="5" width="287" height="200" fill="#FFF8E7"/>
  <rect x="5" y="5" width="287" height="200" fill="url(#agedPattern)"/>
  
  <!-- Outer vintage border -->
  <rect x="12" y="12" width="273" height="186" fill="none" stroke="url(#vintageSepia)" stroke-width="4"/>
  
  <!-- Inner border -->
  <rect x="19" y="19" width="259" height="172" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="24" y="24" width="249" height="162" fill="none" stroke="#A0522D" stroke-width="0.5"/>
  
  <!-- Aged corner marks -->
  <g stroke="#6B4226" stroke-width="1" opacity="0.4">
    <line x1="15" y1="30" x2="30" y2="15"/>
    <line x1="267" y1="30" x2="282" y2="15"/>
    <line x1="15" y1="180" x2="30" y2="195"/>
    <line x1="267" y1="180" x2="282" y2="195"/>
  </g>
</svg>
