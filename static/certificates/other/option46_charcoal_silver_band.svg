<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="charcoalBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="50%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="silverBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Top charcoal band -->
  <rect x="10" y="10" width="277" height="10" fill="url(#charcoalBand)"/>
  <!-- Silver line on top band -->
  <line x1="10" y1="15" x2="287" y2="15" stroke="url(#silverBand)" stroke-width="1.5"/>
  
  <!-- Bottom charcoal band -->
  <rect x="10" y="190" width="277" height="10" fill="url(#charcoalBand)"/>
  <!-- Silver line on bottom band -->
  <line x1="10" y1="195" x2="287" y2="195" stroke="url(#silverBand)" stroke-width="1.5"/>
  
  <!-- Left charcoal band -->
  <rect x="10" y="10" width="10" height="190" fill="url(#charcoalBand)"/>
  <!-- Silver line on left band -->
  <line x1="15" y1="10" x2="15" y2="200" stroke="url(#silverBand)" stroke-width="1.5"/>
  
  <!-- Right charcoal band -->
  <rect x="277" y="10" width="10" height="190" fill="url(#charcoalBand)"/>
  <!-- Silver line on right band -->
  <line x1="282" y1="10" x2="282" y2="200" stroke="url(#silverBand)" stroke-width="1.5"/>
  
  <!-- Inner border -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="29" y="29" width="239" height="152" fill="none" stroke="#C0C0C0" stroke-width="0.8"/>
</svg>
