<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAVE — Certificate of Achievement</title>
    <link rel="stylesheet" href="certificate_logo.css">
</head>
<body>
    <div class="certificate">
        <div class="certificate-border">
            <div class="certificate-header">
                <div class="logo-small">
                    <div class="emblem">
                        <div class="shield">
                            <div class="book">
                                <span class="page left"></span>
                                <span class="page right"></span>
                            </div>
                        </div>
                        <span class="star">★</span>
                    </div>
                </div>
                <div class="title-group">
                    <h1 class="cert-title">BRAVE</h1>
                    <p class="cert-subtitle">Ethiopian Freshman Platform</p>
                </div>
                <div class="logo-small">
                    <div class="emblem">
                        <div class="shield">
                            <div class="book">
                                <span class="page left"></span>
                                <span class="page right"></span>
                            </div>
                        </div>
                        <span class="star">★</span>
                    </div>
                </div>
            </div>
            
            <div class="certificate-body">
                <h2 class="achievement-title">CERTIFICATE</h2>
                <p class="achievement-subtitle">of Achievement</p>
                
                <div class="recipient">
                    <p class="presented-to">This certificate is proudly presented to</p>
                    <div class="student-name">_____________________</div>
                    <p class="achievement-text">
                        For successfully completing all lessons in the<br>
                        Ethiopian Freshman Curriculum
                    </p>
                </div>
                
                <div class="stamp-section">
                    <div class="stamp-container">
                        <div class="stamp-ring"></div>
                        <div class="stamp-inner">
                            <div class="emblem">
                                <div class="shield">
                                    <div class="book">
                                        <span class="page left"></span>
                                        <span class="page right"></span>
                                    </div>
                                </div>
                                <span class="star">★</span>
                            </div>
                            <div class="stamp-text">
                                <h3 class="stamp-title">BRAVE</h3>
                                <p class="stamp-subtitle">OFFICIAL STAMP</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="signature-section">
                    <div class="signature">
                        <div class="sign-line"></div>
                        <p class="sign-name">Admin Name</p>
                        <p class="sign-role">BRAVE Teams Administrator</p>
                    </div>
                    <div class="signature">
                        <div class="sign-line"></div>
                        <p class="sign-name">Date</p>
                        <p class="sign-role">Issue Date</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="certificate_logo.js"></script>
</body>
</html>
