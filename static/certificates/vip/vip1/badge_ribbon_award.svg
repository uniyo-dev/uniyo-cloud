<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="60mm" viewBox="0 0 50 60">
  <defs>
    <linearGradient id="ribBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Left ribbon tail -->
  <path d="M20,40 L15,58 L20,52 L25,58 L22,40" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  
  <!-- Right ribbon tail -->
  <path d="M30,40 L25,58 L30,52 L35,58 L32,40" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  
  <!-- Ribbon folds -->
  <path d="M22,40 L25,48 L25,40" fill="#C0392B" opacity="0.5"/>
  <path d="M32,40 L29,48 L29,40" fill="#C0392B" opacity="0.5"/>
  
  <!-- Main badge circle -->
  <circle cx="25" cy="25" r="18" fill="url(#ribBadge)" stroke="#B8860B" stroke-width="2"/>
  <circle cx="25" cy="25" r="14" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Number 1 in center -->
  <text x="25" y="30" font-family="serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
</svg>
