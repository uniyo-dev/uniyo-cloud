<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="swirlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Clean white background -->
  <rect x="6" y="6" width="285" height="198" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="2.5"/>
  <rect x="11" y="11" width="275" height="188" fill="none" stroke="url(#swirlGold)" stroke-width="1.5"/>
  
  <!-- Tiny elegant swirl corners -->
  <g transform="translate(11,11)">
    <!-- Main swirl -->
    <path d="M0,20 Q8,16 12,10 Q16,4 20,0" fill="none" stroke="url(#swirlGold)" stroke-width="2"/>
    <!-- Swirl curl -->
    <path d="M12,10 Q14,8 13,5 Q11,7 13,9 Q15,11 14,13" fill="none" stroke="#B8860B" stroke-width="1.2"/>
    <!-- Small circle accent -->
    <circle cx="7" cy="14" r="2.5" fill="none" stroke="url(#swirlGold)" stroke-width="1"/>
    <circle cx="7" cy="14" r="1" fill="#D4AF37"/>
    <!-- Tiny dots -->
    <circle cx="16" cy="5" r="1" fill="#B8860B"/>
    <circle cx="3" cy="18" r="1" fill="#B8860B"/>
  </g>
  
  <g transform="translate(286,11) scale(-1,1)">
    <path d="M0,20 Q8,16 12,10 Q16,4 20,0" fill="none" stroke="url(#swirlGold)" stroke-width="2"/>
    <path d="M12,10 Q14,8 13,5 Q11,7 13,9 Q15,11 14,13" fill="none" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="7" cy="14" r="2.5" fill="none" stroke="url(#swirlGold)" stroke-width="1"/>
    <circle cx="7" cy="14" r="1" fill="#D4AF37"/>
    <circle cx="16" cy="5" r="1" fill="#B8860B"/>
    <circle cx="3" cy="18" r="1" fill="#B8860B"/>
  </g>
  
  <g transform="translate(11,199) scale(1,-1)">
    <path d="M0,20 Q8,16 12,10 Q16,4 20,0" fill="none" stroke="url(#swirlGold)" stroke-width="2"/>
    <path d="M12,10 Q14,8 13,5 Q11,7 13,9 Q15,11 14,13" fill="none" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="7" cy="14" r="2.5" fill="none" stroke="url(#swirlGold)" stroke-width="1"/>
    <circle cx="7" cy="14" r="1" fill="#D4AF37"/>
    <circle cx="16" cy="5" r="1" fill="#B8860B"/>
    <circle cx="3" cy="18" r="1" fill="#B8860B"/>
  </g>
  
  <g transform="translate(286,199) scale(-1,-1)">
    <path d="M0,20 Q8,16 12,10 Q16,4 20,0" fill="none" stroke="url(#swirlGold)" stroke-width="2"/>
    <path d="M12,10 Q14,8 13,5 Q11,7 13,9 Q15,11 14,13" fill="none" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="7" cy="14" r="2.5" fill="none" stroke="url(#swirlGold)" stroke-width="1"/>
    <circle cx="7" cy="14" r="1" fill="#D4AF37"/>
    <circle cx="16" cy="5" r="1" fill="#B8860B"/>
    <circle cx="3" cy="18" r="1" fill="#B8860B"/>
  </g>
  
  <!-- Delicate line details -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.5">
    <line x1="40" y1="11" x2="257" y2="11"/>
    <line x1="40" y1="199" x2="257" y2="199"/>
    <line x1="11" y1="40" x2="11" y2="170"/>
    <line x1="286" y1="40" x2="286" y2="170"/>
  </g>
  
  <!-- Center top and bottom accents -->
  <g fill="#D4AF37">
    <polygon points="148.5,8 151,11 148.5,14 146,11"/>
    <polygon points="148.5,196 151,199 148.5,202 146,199"/>
  </g>
</svg>
