<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="braidPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,3 Q3,0 5,3 Q8,6 10,3" fill="none" stroke="#8B6914" stroke-width="1"/>
      <path d="M0,8 Q3,5 5,8 Q8,11 10,8" fill="none" stroke="#D4AF37" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFF8E7"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  
  <!-- Braided pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="8" fill="url(#braidPattern)"/>
  
  <!-- Braided pattern bottom - ultra thin -->
  <rect x="14" y="188" width="269" height="8" fill="url(#braidPattern)"/>
  
  <!-- Braided pattern left - ultra thin -->
  <rect x="14" y="14" width="8" height="182" fill="url(#braidPattern)"/>
  
  <!-- Braided pattern right - ultra thin -->
  <rect x="275" y="14" width="8" height="182" fill="url(#braidPattern)"/>
  
  <!-- Inner border -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="32" y="32" width="233" height="146" fill="none" stroke="#A0522D" stroke-width="0.5"/>
</svg>
