<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="execGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="25%" style="stop-color:#FFE55C"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="75%" style="stop-color:#FFE55C"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border - thick dark -->
  <rect x="8" y="8" width="281" height="194" fill="none" stroke="#2C2C2C" stroke-width="5"/>
  
  <!-- Gold decorative border -->
  <rect x="15" y="15" width="267" height="180" fill="none" stroke="url(#execGold)" stroke-width="3"/>
  
  <!-- Inner border -->
  <rect x="21" y="21" width="255" height="168" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
  
  <!-- Ultra-fine inner line -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="url(#execGold)" stroke-width="0.5"/>
  
  <!-- Elegant corner lines (just lines, no ornaments) -->
  <g stroke="url(#execGold)" stroke-width="2">
    <!-- Top left -->
    <line x1="8" y1="25" x2="25" y2="8"/>
    <!-- Top right -->
    <line x1="272" y1="8" x2="289" y2="25"/>
    <!-- Bottom left -->
    <line x1="8" y1="185" x2="25" y2="202"/>
    <!-- Bottom right -->
    <line x1="272" y1="202" x2="289" y2="185"/>
  </g>
  
  <!-- Subtle center markers -->
  <g fill="#D4AF37">
    <rect x="144" y="8" width="9" height="3"/>
    <rect x="144" y="199" width="9" height="3"/>
    <rect x="8" y="102" width="3" height="9"/>
    <rect x="286" y="102" width="3" height="9"/>
  </g>
  
  <!-- Fine dashed inner border -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#2C2C2C" stroke-width="0.3" stroke-dasharray="3,3"/>
</svg>
