<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="classicGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer thick black line -->
  <rect x="12" y="12" width="273" height="186" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  
  <!-- Inner gold line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#classicGold)" stroke-width="2"/>
  
  <!-- Fine inner line -->
  <rect x="25" y="25" width="247" height="160" fill="none" stroke="#1A1A1A" stroke-width="0.5"/>
</svg>
