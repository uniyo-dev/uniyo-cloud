<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="55mm" viewBox="0 0 50 55">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0392B"/>
      <stop offset="100%" style="stop-color:#E74C3C"/>
    </linearGradient>
  </defs>
  
  <!-- Shield shape -->
  <path d="M25,3 L45,10 L45,25 Q45,40 25,52 Q5,40 5,25 L5,10 Z" fill="url(#shieldGold)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Inner shield -->
  <path d="M25,8 L40,14 L40,25 Q40,37 25,47 Q10,37 10,25 L10,14 Z" fill="url(#shieldRed)" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Star in center -->
