<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="15mm" viewBox="0 0 297 15">
  <defs>
    <linearGradient id="lauDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D5016"/>
      <stop offset="50%" style="stop-color:#4A7C2E"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
  </defs>
  
  <!-- Center laurel wreath -->
  <g transform="translate(148.5,7.5)">
    <path d="M-8,-4 Q0,-8 8,-4" fill="none" stroke="#4A7C2E" stroke-width="1.5"/>
    <path d="M-8,4 Q0,8 8,4" fill="none" stroke="#4A7C2E" stroke-width="1.5"/>
    <ellipse cx="-5" cy="-2" rx="3" ry="1.5" fill="#4A7C2E" opacity="0.5" transform="rotate(-30 -5 -2)"/>
    <ellipse cx="5" cy="-2" rx="3" ry="1.5" fill="#4A7C2E" opacity="0.5" transform="rotate(30 5 -2)"/>
    <ellipse cx="-5" cy="2" rx="3" ry="1.5" fill="#4A7C2E" opacity="0.5" transform="rotate(30 -5 2)"/>
    <ellipse cx="5" cy="2" rx="3" ry="1.5" fill="#4A7C2E" opacity="0.5" transform="rotate(-30 5 2)"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4AF37"/>
  </g>
  
  <!-- Branch lines -->
  <line x1="10" y1="7.5" x2="130" y2="7.5" stroke="url(#lauDiv)" stroke-width="1.5"/>
  <line x1="167" y1="7.5" x2="287" y2="7.5" stroke="url(#lauDiv)" stroke-width="1.5"/>
  
  <!-- Small leaves on branches -->
