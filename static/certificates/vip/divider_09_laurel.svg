  <ellipse cx="100" cy="9.5" rx="4" ry="1.5" fill="#4A7C2E" opacity="0.4" transform="rotate(15 100 9.5)"/>
  <ellipse cx="197" cy="5.5" rx="4" ry="1.5" fill="#4A7C2E" opacity="0.4" transform="rotate(15 197 5.5)"/>
  <ellipse cx="237" cy="9.5" rx="4" ry="1.5" fill="#4A7C2E" opacity="0.4" transform="rotate(-15 237 9.5)"/>
