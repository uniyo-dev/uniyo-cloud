<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="luxGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
    <linearGradient id="luxGoldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
  </defs>
  
  <!-- Pure white background -->
  <rect x="10" y="10" width="277" height="190" fill="#FFFFFF"/>
  
  <!-- Single elegant gold border -->
  <rect x="12" y="12" width="273" height="186" fill="none" stroke="url(#luxGold)" stroke-width="3"/>
  
  <!-- Thin inner border -->
  <rect x="17" y="17" width="263" height="176" fill="none" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Very fine inner line -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="url(#luxGold)" stroke-width="0.5"/>
  
  <!-- Wide gold bands top and bottom -->
  <rect x="100" y="12" width="97" height="6" fill="url(#luxGold)"/>
  <rect x="100" y="192" width="97" height="6" fill="url(#luxGold)"/>
  
  <!-- Wide gold bands left and right -->
  <rect x="12" y="84" width="6" height="42" fill="url(#luxGoldV)"/>
  <rect x="279" y="84" width="6" height="42" fill="url(#luxGoldV)"/>
  
  <!-- Subtle separation lines -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.4">
    <line x1="60" y1="12" x2="60" y2="18"/>
    <line x1="80" y1="12" x2="80" y2="18"/>
    <line x1="217" y1="12" x2="217" y2="18"/>
    <line x1="237" y1="12" x2="237" y2="18"/>
    
    <line x1="60" y1="192" x2="60" y2="198"/>
    <line x1="80" y1="192" x2="80" y2="198"/>
    <line x1="217" y1="192" x2="217" y2="198"/>
    <line x1="237" y1="192" x2="237" y2="198"/>
  </g>
  
  <!-- Tiny gold dots at intervals -->
  <g fill="#FFD700" opacity="0.5">
    <circle cx="148.5" cy="24" r="1"/>
    <circle cx="148.5" cy="186" r="1"/>
    <circle cx="24" cy="105" r="1"/>
    <circle cx="273" cy="105" r="1"/>
  </g>
</svg>
