<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#667EEA" opacity="0.6"/>
    </pattern>
    <linearGradient id="dotBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A00E0"/>
      <stop offset="100%" style="stop-color:#8E2DE2"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#dotBlue)" stroke-width="2"/>
  
  <!-- Dot pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="6" fill="url(#dotPattern)"/>
  
  <!-- Dot pattern bottom - ultra thin -->
  <rect x="14" y="190" width="269" height="6" fill="url(#dotPattern)"/>
  
  <!-- Dot pattern left - ultra thin -->
  <rect x="14" y="14" width="6" height="182" fill="url(#dotPattern)"/>
  
  <!-- Dot pattern right - ultra thin -->
  <rect x="277" y="14" width="6" height="182" fill="url(#dotPattern)"/>
  
  <!-- Inner border -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="#4A00E0" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#8E2DE2" stroke-width="0.5"/>
</svg>
