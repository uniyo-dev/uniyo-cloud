<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="15mm" viewBox="0 0 297 15">
  <defs>
    <linearGradient id="starDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Center starburst -->
  <g transform="translate(148.5,7.5)">
    <!-- Radiating lines -->
    <line x1="0" y1="-7" x2="0" y2="-3" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="0" y1="3" x2="0" y2="7" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="-7" y1="0" x2="-3" y2="0" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="3" y1="0" x2="7" y2="0" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="-5" y1="-5" x2="-2" y2="-2" stroke="#FFD700" stroke-width="0.6"/>
    <line x1="2" y1="2" x2="5" y2="5" stroke="#FFD700" stroke-width="0.6"/>
    <line x1="-5" y1="5" x2="-2" y2="2" stroke="#FFD700" stroke-width="0.6"/>
    <line x1="2" y1="-2" x2="5" y2="-5" stroke="#FFD700" stroke-width="0.6"/>
    <!-- Center star -->
    <polygon points="0,-4 1.2,-1.2 4,-1.2 1.8,0.6 2.6,3.6 0,1.8 -2.6,3.6 -1.8,0.6 -4,-1.2 -1.2,-1.2" fill="url(#starDiv)"/>
  </g>
  
  <!-- Decorative lines -->
  <line x1="10" y1="7.5" x2="120" y2="7.5" stroke="url(#starDiv)" stroke-width="2"/>
  <line x1="177" y1="7.5" x2="287" y2="7.5" stroke="url(#starDiv)" stroke-width="2"/>
  
  <!-- Small stars on lines -->
  <polygon points="100,7.5 101,6.5 102,7.5 101,8.5" fill="#FFD700"/>
  <polygon points="195,7.5 196,6.5 197,7.5 196,8.5" fill="#FFD700"/>
  
  <!-- Sparkle dots -->
  <circle cx="60" cy="7.5" r="1.5" fill="#FFD700"/>
  <circle cx="237" cy="7.5" r="1.5" fill="#FFD700"/>
</svg>
