<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="15mm" viewBox="0 0 297 15">
  <defs>
    <linearGradient id="geoDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50"/>
      <stop offset="100%" style="stop-color:#34495E"/>
    </linearGradient>
  </defs>
  
  <!-- Center geometric shape -->
  <g transform="translate(148.5,7.5)">
    <polygon points="0,-6 5,0 0,6 -5,0" fill="none" stroke="url(#geoDiv)" stroke-width="2"/>
    <polygon points="0,-3 2.5,0 0,3 -2.5,0" fill="url(#geoDiv)" opacity="0.5"/>
  </g>
  
  <!-- Lines with geometric patterns -->
  <line x1="15" y1="7.5" x2="125" y2="7.5" stroke="url(#geoDiv)" stroke-width="1.5"/>
  <line x1="172" y1="7.5" x2="282" y2="7.5" stroke="url(#geoDiv)" stroke-width="1.5"/>
  
  <!-- Triangle accents -->
  <polygon points="125,7.5 128,5.5 131,7.5 128,9.5" fill="#34495E"/>
  <polygon points="166,7.5 169,5.5 172,7.5 169,9.5" fill="#34495E"/>
  
  <!-- Square accents -->
  <rect x="140" y="5" width="4" height="4" fill="none" stroke="#34495E" stroke-width="0.8" transform="rotate(45 142 7)"/>
  <rect x="153" y="5" width="4" height="4" fill="none" stroke="#34495E" stroke-width="0.8" transform="rotate(45 155 7)"/>
  
  <!-- Dotted lines -->
  <circle cx="50" cy="7.5" r="1" fill="#34495E"/>
  <circle cx="70" cy="7.5" r="1" fill="#34495E"/>
  <circle cx="90" cy="7.5" r="1" fill="#34495E"/>
  <circle cx="207" cy="7.5" r="1" fill="#34495E"/>
  <circle cx="227" cy="7.5" r="1" fill="#34495E"/>
  <circle cx="247" cy="7.5" r="1" fill="#34495E"/>
</svg>
