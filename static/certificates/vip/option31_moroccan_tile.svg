<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="moroccanPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="none" stroke="#2E86C1" stroke-width="0.8"/>
      <circle cx="5" cy="5" r="1" fill="#2E86C1" opacity="0.5"/>
    </pattern>
    <linearGradient id="moroccanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B4F72"/>
      <stop offset="50%" style="stop-color:#2E86C1"/>
      <stop offset="100%" style="stop-color:#1B4F72"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#moroccanBlue)" stroke-width="2.5"/>
  
  <!-- Moroccan pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="10" fill="url(#moroccanPattern)"/>
  
  <!-- Moroccan pattern bottom - ultra thin -->
  <rect x="14" y="186" width="269" height="10" fill="url(#moroccanPattern)"/>
  
  <!-- Moroccan pattern left - ultra thin -->
  <rect x="14" y="14" width="10" height="182" fill="url(#moroccanPattern)"/>
  
  <!-- Moroccan pattern right - ultra thin -->
  <rect x="273" y="14" width="10" height="182" fill="url(#moroccanPattern)"/>
  
  <!-- Inner border -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#1B4F72" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="34" y="34" width="229" height="142" fill="none" stroke="#2E86C1" stroke-width="0.5"/>
</svg>
