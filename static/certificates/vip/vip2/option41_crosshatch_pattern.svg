<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="crosshatchPattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#2C3E50" stroke-width="0.5"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#2C3E50" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="crosshatchDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#4A4A4A"/>
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFFFFF"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="url(#crosshatchDark)" stroke-width="2"/>
  
  <!-- Crosshatch pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="6" fill="url(#crosshatchPattern)"/>
  
  <!-- Crosshatch pattern bottom - ultra thin -->
  <rect x="14" y="190" width="269" height="6" fill="url(#crosshatchPattern)"/>
  
  <!-- Crosshatch pattern left - ultra thin -->
  <rect x="14" y="14" width="6" height="182" fill="url(#crosshatchPattern)"/>
  
  <!-- Crosshatch pattern right - ultra thin -->
  <rect x="277" y="14" width="6" height="182" fill="url(#crosshatchPattern)"/>
  
  <!-- Inner border -->
  <rect x="26" y="26" width="245" height="158" fill="none" stroke="#2C3E50" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="30" y="30" width="237" height="150" fill="none" stroke="#4A4A4A" stroke-width="0.5"/>
</svg>
