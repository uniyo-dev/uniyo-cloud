<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="55mm" viewBox="0 0 55 55">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Laurel wreath branches -->
  <g stroke="#2E7D32" stroke-width="1.5" fill="none">
    <path d="M27.5,10 Q15,15 10,27.5 Q15,40 27.5,45"/>
    <path d="M27.5,10 Q40,15 45,27.5 Q40,40 27.5,45"/>
  </g>
  
  <!-- Leaves on left branch -->
  <ellipse cx="18" cy="15" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(-30 18 15)"/>
  <ellipse cx="13" cy="22" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(-45 13 22)"/>
  <ellipse cx="12" cy="30" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(-30 12 30)"/>
  <ellipse cx="15" cy="38" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(-15 15 38)"/>
  
  <!-- Leaves on right branch -->
  <ellipse cx="37" cy="15" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(30 37 15)"/>
  <ellipse cx="42" cy="22" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(45 42 22)"/>
  <ellipse cx="43" cy="30" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(30 43 30)"/>
  <ellipse cx="40" cy="38" rx="4" ry="2" fill="#4A7C2E" opacity="0.6" transform="rotate(15 40 38)"/>
  
  <!-- Center circle -->
  <circle cx="27.5" cy="27.5" r="12" fill="url(#badgeGold)" stroke="#B8860B" stroke-width="1.5"/>
  <circle cx="27.5" cy="27.5" r="8" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
  
  <!-- Star in center -->
  <polygon points="27.5,20 29.5,24 34,24.5 30.5,28 31.5,32 27.5,29.5 23.5,32 24.5,28 21,24.5 25.5,24" fill="#FFFFFF"/>
