<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="20%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="80%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="premiumGoldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="20%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="80%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Clean white background -->
  <rect x="8" y="8" width="281" height="194" fill="#FFFFFF"/>
  
  <!-- Outer thick border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  
  <!-- Gold gradient border -->
  <rect x="16" y="16" width="265" height="178" fill="none" stroke="url(#premiumGold)" stroke-width="2"/>
  
  <!-- Inner thin border -->
  <rect x="20" y="20" width="257" height="170" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
  
  <!-- Subtle inner gold line -->
  <rect x="23" y="23" width="251" height="164" fill="none" stroke="url(#premiumGold)" stroke-width="0.5"/>
  
  <!-- Top center gold accent -->
  <line x1="128" y1="10" x2="169" y2="10" stroke="url(#premiumGold)" stroke-width="6"/>
  <line x1="128" y1="200" x2="169" y2="200" stroke="url(#premiumGold)" stroke-width="6"/>
  
  <!-- Left center gold accent -->
  <line x1="10" y1="88" x2="10" y2="122" stroke="url(#premiumGoldV)" stroke-width="6"/>
  <line x1="287" y1="88" x2="287" y2="122" stroke="url(#premiumGoldV)" stroke-width="6"/>
  
  <!-- Fine gold dots on borders -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="80" cy="10" r="1.5"/>
    <circle cx="100" cy="10" r="1.5"/>
    <circle cx="120" cy="10" r="1.5"/>
    <circle cx="177" cy="10" r="1.5"/>
    <circle cx="197" cy="10" r="1.5"/>
    <circle cx="217" cy="10" r="1.5"/>
    
    <circle cx="80" cy="200" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="177" cy="200" r="1.5"/>
    <circle cx="197" cy="200" r="1.5"/>
    <circle cx="217" cy="200" r="1.5"/>
  </g>
</svg>
