<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <pattern id="herringbonePattern" x="0" y="0" width="10" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="8" stroke="#8B6914" stroke-width="0.8"/>
      <line x1="5" y1="0" x2="10" y2="8" stroke="#D4AF37" stroke-width="0.8"/>
      <line x1="0" y1="4" x2="5" y2="12" stroke="#8B6914" stroke-width="0.4"/>
      <line x1="5" y1="4" x2="10" y2="12" stroke="#D4AF37" stroke-width="0.4"/>
    </pattern>
  </defs>
  
  <rect x="5" y="5" width="287" height="200" fill="#FFF8E7"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="277" height="190" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  
  <!-- Herringbone pattern top - ultra thin -->
  <rect x="14" y="14" width="269" height="8" fill="url(#herringbonePattern)"/>
  
  <!-- Herringbone pattern bottom - ultra thin -->
  <rect x="14" y="188" width="269" height="8" fill="url(#herringbonePattern)"/>
  
  <!-- Herringbone pattern left - ultra thin -->
  <rect x="14" y="14" width="8" height="182" fill="url(#herringbonePattern)"/>
  
  <!-- Herringbone pattern right - ultra thin -->
  <rect x="275" y="14" width="8" height="182" fill="url(#herringbonePattern)"/>
  
  <!-- Inner border -->
  <rect x="28" y="28" width="241" height="154" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  
  <!-- Fine inner line -->
  <rect x="32" y="32" width="233" height="146" fill="none" stroke="#A0522D" stroke-width="0.5"/>
</svg>
