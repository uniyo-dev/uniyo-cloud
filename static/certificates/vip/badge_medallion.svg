<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="50mm" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="medGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Scalloped outer edge -->
  <g fill="url(#medGold)" stroke="#B8860B" stroke-width="0.5">
    <circle cx="25" cy="25" r="22"/>
  </g>
  
  <!-- Inner circles -->
  <circle cx="25" cy="25" r="18" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="25" cy="25" r="14" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
  
  <!-- Center emblem -->
  <g transform="translate(25,25)">
    <polygon points="0,-10 8,-4 5,6 -5,6 -8,-4" fill="#D4AF37" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="url(#medGold)"/>
  </g>
  
  <!-- Decorative dots around edge -->
  <g fill="#D4AF37">
    <circle cx="25" cy="3" r="1"/>
    <circle cx="25" cy="47" r="1"/>
    <circle cx="3" cy="25" r="1"/>
    <circle cx="47" cy="25" r="1"/>
  </g>
</svg>
