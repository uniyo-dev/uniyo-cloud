<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UNIYO Official Stamp - Certificate Authority">
    <meta name="theme-color" content="#6D28D9">
    <title>UNIYO — Official Stamp</title>
    <link rel="stylesheet" href="stamp_central.css">
</head>
<body>
    <main class="uniyo-stamp-main" role="main" aria-label="UNIYO Official Stamp">
        
        <!-- Stamp Wrapper -->
        <div class="uniyo-stamp-wrapper">
            
            <!-- Stamp Container -->
            <div class="uniyo-stamp-container" id="uniyoStamp">
                
                <!-- Outer Border Ring -->
                <div class="stamp-outer-ring">
                    
                    <!-- Inner Border Ring -->
                    <div class="stamp-inner-ring">
                        
                        <!-- Circular Text Path -->
                        <svg class="stamp-circular-text" viewBox="0 0 300 300">
                            <defs>
                                <path id="stampCirclePath" d="M150,30 A120,120 0 1,1 149,30"/>
                            </defs>
                            <text class="stamp-upper-text">
                                <textPath href="#stampCirclePath" startOffset="50%" text-anchor="middle">
                                    UNIYO PLATFORM • ETHIOPIA • VERIFIED •
                                </textPath>
                            </text>
                        </svg>
                        
                        <!-- Center Emblem -->
                        <div class="stamp-emblem">
                            <svg class="stamp-svg" viewBox="0 0 200 200">
                                <defs>
                                    <linearGradient id="stampPurple" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#7C3AED"/>
                                        <stop offset="100%" style="stop-color:#5B21B6"/>
                                    </linearGradient>
                                    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#FCD34D"/>
                                        <stop offset="100%" style="stop-color:#D97706"/>
                                    </linearGradient>
                                </defs>
                                
                                <!-- Hexagon -->
                                <polygon points="100,15 165,52 165,128 100,185 35,128 35,52" 
                                         fill="url(#stampPurple)" stroke="#D97706" stroke-width="3"/>
                                
                                <!-- U Monogram -->
                                <path d="M70 70 L70 100 Q70 135 100 135 Q130 135 130 100 L130 70" 
                                      fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
                                
                                <!-- Diamond -->
                                <polygon points="100,35 112,47 100,59 88,47" fill="url(#stampGold)"/>
                                
                            </svg>
                        </div>
                        
                        <!-- Stamp Text -->
                        <div class="stamp-text-section">
                            <h2 class="stamp-wordmark">UNIYO</h2>
                            <p class="stamp-label">OFFICIAL STAMP</p>
                        </div>
                        
                        <!-- Verification Code -->
                        <div class="stamp-verification">
                            <span class="stamp-verify-code">UNY-2026-0001</span>
                        </div>
                        
                        <!-- Bottom Text -->
                        <p class="stamp-bottom-text">University Made for YOU</p>
                        
                    </div>
                    
                </div>
                
                <!-- Decorative Stars -->
                <span class="stamp-star star-1">★</span>
                <span class="stamp-star star-2">★</span>
                <span class="stamp-star star-3">★</span>
                <span class="stamp-star star-4">★</span>
                
                <!-- Rotating Dashed Ring -->
                <div class="stamp-dashed-ring"></div>
                
            </div>
            
        </div>
        
        <!-- Stamp Info -->
        <div class="stamp-info">
            <p class="stamp-info-text">🔒 Authenticated by UNIYO Platform</p>
            <p class="stamp-info-sub">Certificate Authority — Ethiopian Higher Education</p>
        </div>
        
    </main>
    
    <script src="stamp_central.js"></script>
</body>
</html>
