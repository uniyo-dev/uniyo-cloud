<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6D28D9"/>
            <stop offset="100%" style="stop-color:#EC4899"/>
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="512" height="512" rx="120" fill="url(#bg)"/>
    
    <!-- White Circle -->
    <circle cx="256" cy="256" r="180" fill="#F8FAFC"/>
    
    <!-- Letter U -->
    <text x="256" y="330" text-anchor="middle" fill="#6D28D9" font-size="200" font-weight="800" font-family="Poppins, Arial, sans-serif">U</text>
    
    <!-- Gold Dot -->
    <circle cx="335" cy="300" r="16" fill="#F59E0B"/>
</svg>