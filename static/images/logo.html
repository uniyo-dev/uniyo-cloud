<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UNIYO - University Made for YOU. Ethiopian Higher Education Freshman Learning Platform.">
    <meta name="theme-color" content="#6D28D9">
    <title>UNIYO — University Made for YOU</title>
    <link rel="stylesheet" href="logo.css">
</head>
<body>
    <main class="uniyo-logo-main" role="main" aria-label="UNIYO Official Logo">
        
        <div class="uniyo-logo-container" id="uniyoLogo">
            
            <!-- SVG Logo Icon -->
            <div class="uniyo-logo-icon" id="logoIcon">
                <svg class="uniyo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="uniyoPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7C3AED"/>
                            <stop offset="100%" style="stop-color:#5B21B6"/>
                        </linearGradient>
                        <linearGradient id="uniyoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FCD34D"/>
                            <stop offset="100%" style="stop-color:#F59E0B"/>
                        </linearGradient>
                        <linearGradient id="uniyoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#2DD4BF"/>
                            <stop offset="100%" style="stop-color:#14B8A6"/>
                        </linearGradient>
                    </defs>
                    
                    <!-- Outer Rounded Hexagon (Modern Shield) -->
                    <path class="uniyo-shape-main" 
                          d="M100 8 L170 48 L170 128 L100 192 L30 48 L30 48 Z" 
                          fill="url(#uniyoPurpleGrad)" rx="8"/>
                    
                    <!-- Inner Border -->
                    <path class="uniyo-shape-inner" 
                          d="M100 20 L160 54 L160 122 L100 180 L40 122 L40 54 Z" 
                          fill="none" stroke="#FCD34D" stroke-width="2" opacity="0.5"/>
                    
                    <!-- U Monogram (Bold) -->
                    <path class="uniyo-u-letter" 
                          d="M70 65 L70 95 Q70 135 100 135 Q130 135 130 95 L130 65" 
                          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
                    
                    <!-- U Inner Shadow for Depth -->
                    <path class="uniyo-u-inner" 
                          d="M78 65 L78 93 Q78 128 100 128 Q122 128 122 93 L122 65" 
                          fill="none" stroke="#4C1D95" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
                    
                    <!-- Gold Diamond (Knowledge Light) -->
                    <polygon class="uniyo-diamond" 
                             points="100,28 112,40 100,52 88,40" 
                             fill="url(#uniyoGoldGrad)"/>
                    
                    <!-- Teal Accent Wave (Subtle Modern) -->
                    <path class="uniyo-wave" 
                          d="M45 145 Q72 135 100 145 Q128 155 155 145" 
                          fill="none" stroke="url(#uniyoTealGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                    
                    <!-- Ethiopian-Inspired Subtle Pattern (Three Dots) -->
                    <circle class="uniyo-dot" cx="100" cy="168" r="3" fill="#FCD34D" opacity="0.5"/>
                    <circle class="uniyo-dot" cx="88" cy="168" r="2" fill="#FCD34D" opacity="0.3"/>
                    <circle class="uniyo-dot" cx="112" cy="168" r="2" fill="#FCD34D" opacity="0.3"/>
                    
                </svg>
            </div>
            
            <!-- Wordmark -->
            <div class="uniyo-wordmark" id="logoWordmark">
                <h1 class="uniyo-title">
                    <span class="uniyo-letter">U</span><!--
                 --><span class="uniyo-letter">N</span><!--
                 --><span class="uniyo-letter">I</span><!--
                 --><span class="uniyo-letter">Y</span><!--
                 --><span class="uniyo-letter">O</span>
                </h1>
                <p class="uniyo-tagline">University Made for YOU</p>
            </div>
            
        </div>
        
        <!-- Dark Mode Toggle -->
        <button class="uniyo-mode-toggle" id="modeToggle" aria-label="Toggle dark mode">
            <span class="toggle-icon">◐</span>
        </button>
        
    </main>
    
    <script src="logo.js"></script>
</body>
</html>
