<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- Background -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0B0F19"/>
            <stop offset="50%" style="stop-color:#1A1A2E"/>
            <stop offset="100%" style="stop-color:#16213E"/>
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6D28D9"/>
            <stop offset="100%" style="stop-color:#EC4899"/>
        </linearGradient>
    </defs>
    
    <!-- Main Background -->
    <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
    
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accentGradient)" stroke-width="8"/>
    
    <!-- Inner Circle -->
    <circle cx="256" cy="256" r="180" fill="#111827" stroke="#6D28D9" stroke-width="4"/>
    
    <!-- Letter U -->
    <text x="256" y="330" text-anchor="middle" fill="#F8FAFC" font-size="220" font-weight="800" font-family="Poppins, Arial, sans-serif">U</text>
    
    <!-- Gold Dot -->
    <circle cx="340" cy="300" r="18" fill="#F59E0B"/>
    
    <!-- Brand Name -->
    <text x="256" y="430" text-anchor="middle" fill="#6D28D9" font-size="55" font-weight="700" font-family="Poppins, Arial, sans-serif">UNIYO</text>
    
    <!-- Tagline -->
    <text x="256" y="465" text-anchor="middle" fill="#94A3B8" font-size="25" font-weight="400" font-family="Inter, Arial, sans-serif">University Made for YOU</text>
</svg>