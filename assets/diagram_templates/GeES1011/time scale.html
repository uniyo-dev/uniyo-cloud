<svg width="650" height="350" viewBox="0 0 650 350" xmlns="http://www.w3.org/2000/svg">
    <rect width="650" height="350" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="22" font-weight="bold">GEOLOGICAL TIME SCALE - ETHIOPIA</text>
    
    <!-- Timeline Bar -->
    <rect x="60" y="70" width="530" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Time Segments -->
    <rect x="60" y="70" width="80" height="30" rx="4" fill="#b45309"/>
    <rect x="140" y="70" width="100" height="30" rx="0" fill="#92400e"/>
    <rect x="240" y="70" width="120" height="30" rx="0" fill="#78350f"/>
    <rect x="360" y="70" width="230" height="30" rx="0" fill="#451a03"/>
    
    <!-- Era Labels -->
    <text x="70" y="90" fill="#f8fafc" font-size="11" font-weight="bold">Precambrian</text>
    <text x="155" y="90" fill="#f8fafc" font-size="11" font-weight="bold">Paleozoic</text>
    <text x="270" y="90" fill="#f8fafc" font-size="11" font-weight="bold">Mesozoic</text>
    <text x="420" y="90" fill="#f8fafc" font-size="11" font-weight="bold">Cenozoic</text>
    
    <!-- Time Labels -->
    <text x="65" y="115" fill="#94a3b8" font-size="10">2.5B</text>
    <text x="145" y="115" fill="#94a3b8" font-size="10">600M</text>
    <text x="245" y="115" fill="#94a3b8" font-size="10">250M</text>
    <text x="365" y="115" fill="#94a3b8" font-size="10">65M</text>
    <text x="590" y="115" fill="#facc15" font-size="10">Present</text>
    
    <!-- Event Markers -->
    <!-- Precambrian Events -->
    <circle cx="100" cy="140" r="4" fill="#f59e0b"/>
    <text x="110" y="144" fill="#f59e0b" font-size="11">Oldest Rocks Formed</text>
    
    <!-- Paleozoic Events -->
    <circle cx="190" cy="170" r="4" fill="#14b8a6"/>
    <text x="200" y="174" fill="#14b8a6" font-size="11">Marine Sedimentation</text>
    
    <!-- Mesozoic Events -->
    <circle cx="300" cy="200" r="4" fill="#f43f5e"/>
    <text x="310" y="204" fill="#f43f5e" font-size="11">Blue Nile Basin</text>
    
    <!-- Cenozoic Events -->
    <circle cx="450" cy="230" r="4" fill="#facc15"/>
    <text x="460" y="234" fill="#facc15" font-size="11">Volcanic Activity</text>
    
    <circle cx="520" cy="260" r="4" fill="#38bdf8"/>
    <text x="530" y="264" fill="#38bdf8" font-size="11">Rift Valley Formation</text>
    
    <circle cx="570" cy="290" r="4" fill="#f59e0b"/>
    <text x="580" y="294" fill="#f59e0b" font-size="11">Current Shape</text>
    
    <!-- Geological Period Details -->
    <rect x="60" y="310" width="530" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="70" y="330" fill="#94a3b8" font-size="11">• Basement Rocks</text>
    <text x="210" y="330" fill="#94a3b8" font-size="11">• Limestone</text>
    <text x="330" y="330" fill="#94a3b8" font-size="11">• Sandstone</text>
    <text x="450" y="330" fill="#94a3b8" font-size="11">• Basalt</text>
    <text x="540" y="330" fill="#94a3b8" font-size="11">• Rift</text>
</svg>
