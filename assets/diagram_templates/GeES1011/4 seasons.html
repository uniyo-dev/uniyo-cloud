<svg width="650" height="450" viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg">
    <rect width="650" height="450" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="170" y="35" fill="#facc15" font-size="22" font-weight="bold">SEASONS IN THE ETHIOPIAN HIGHLANDS</text>
    
    <!-- Season 1: Kiremt (Summer Rainy) -->
    <rect x="40" y="70" width="130" height="160" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="100" fill="#38bdf8" font-size="16" font-weight="bold">☔ Kiremt</text>
    <text x="55" y="120" fill="#94a3b8" font-size="11">(Summer Rainy)</text>
    <text x="60" y="145" fill="#14b8a6" font-size="12">June - Sept</text>
    <text x="55" y="165" fill="#94a3b8" font-size="10">Heavy Rainfall</text>
    <text x="55" y="180" fill="#94a3b8" font-size="10">Flooding Risk</text>
    <text x="55" y="195" fill="#94a3b8" font-size="10">Planting Season</text>
    
    <!-- Rain Cloud SVG -->
    <path d="M 70 210 L 100 210 L 100 220 L 70 220 Z" fill="#38bdf8" opacity="0.6"/>
    <circle cx="80" cy="200" r="10" fill="#38bdf8" opacity="0.3"/>
    <circle cx="100" cy="205" r="8" fill="#38bdf8" opacity="0.3"/>
    
    <!-- Season 2: Belg (Spring Rainy) -->
    <rect x="190" y="70" width="130" height="160" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="225" y="100" fill="#f59e0b" font-size="16" font-weight="bold">🌱 Belg</text>
    <text x="215" y="120" fill="#94a3b8" font-size="11">(Spring Rainy)</text>
    <text x="220" y="145" fill="#14b8a6" font-size="12">Feb - May</text>
    <text x="210" y="165" fill="#94a3b8" font-size="10">Light Rainfall</text>
    <text x="210" y="180" fill="#94a3b8" font-size="10">Short Rains</text>
    <text x="210" y="195" fill="#94a3b8" font-size="10">Growing Season</text>
    
    <!-- Sprout SVG -->
    <path d="M 245 220 L 245 200" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 245 200 Q 235 195 230 190" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <path d="M 245 200 Q 255 195 260 190" stroke="#14b8a6" stroke-width="2" fill="none"/>
    
    <!-- Season 3: Bega (Winter Dry) -->
    <rect x="340" y="70" width="130" height="160" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="375" y="100" fill="#f43f5e" font-size="16" font-weight="bold">❄️ Bega</text>
    <text x="370" y="120" fill="#94a3b8" font-size="11">(Winter Dry)</text>
    <text x="370" y="145" fill="#14b8a6" font-size="12">Oct - Jan</text>
    <text x="365" y="165" fill="#94a3b8" font-size="10">Dry Season</text>
    <text x="365" y="180" fill="#94a3b8" font-size="10">Cool Temperatures</text>
    <text x="365" y="195" fill="#94a3b8" font-size="10">Harvest Time</text>
    
    <!-- Snowflake SVG -->
    <text x="385" y="225" fill="#f43f5e" font-size="20">❄</text>
    
    <!-- Season 4: Tseday (Autumn) -->
    <rect x="490" y="70" width="130" height="160" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="525" y="100" fill="#facc15" font-size="16" font-weight="bold">🍂 Tseday</text>
    <text x="520" y="120" fill="#94a3b8" font-size="11">(Autumn)</text>
    <text x="525" y="145" fill="#14b8a6" font-size="12">Late Sept</text>
    <text x="520" y="165" fill="#94a3b8" font-size="10">Transitional</text>
    <text x="520" y="180" fill="#94a3b8" font-size="10">Harvest Season</text>
    <text x="520" y="195" fill="#94a3b8" font-size="10">Festival Time</text>
    
    <!-- Leaf SVG -->
    <path d="M 555 210 Q 550 200 560 190 Q 570 200 565 210 Q 560 215 555 210 Z" fill="#facc15" opacity="0.6"/>
    
    <!-- Climate Information -->
    <rect x="80" y="260" width="490" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="290" fill="#f8fafc" font-size="16" font-weight="bold">🌤️ Climate Characteristics</text>
    <text x="110" y="315" fill="#94a3b8" font-size="13">• Average Temperature: 15-20°C (Highlands)</text>
    <text x="110" y="335" fill="#94a3b8" font-size="13">• Average Annual Rainfall: 800-2,000mm</text>
    <text x="110" y="355" fill="#94a3b8" font-size="13">• Altitude Range: 1,500 - 4,550m</text>
    <text x="110" y="375" fill="#94a3b8" font-size="13">• Main Rainy Season: Kiremt (June-September)</text>
</svg>
