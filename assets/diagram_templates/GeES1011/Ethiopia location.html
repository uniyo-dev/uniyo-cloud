<svg width="100%" height="auto" viewBox="0 0 600 650" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 600px; display: block; margin: 0 auto; background: #0b0f19; border-radius: 16px; padding: 15px;">
  <defs>
    <!-- Continent Base Gradient -->
    <linearGradient id="africaBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ethiopia Highlight Gradient -->
    <linearGradient id="ethiopiaGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Glowing Effect Filter -->
    <filter id="ethiopiaPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= AFRICAN CONTINENT ACCURATE BOUNDARY ================= -->
  <path d="
    M 175,65 
    L 205,58 L 245,45 L 285,42 L 315,58 L 345,72 L 372,85 L 368,102 
    L 378,118 L 388,135 L 398,155 L 412,175 L 428,192 L 442,205 
    L 468,220 L 498,238 L 515,255 L 492,275 L 465,290 L 442,308 
    L 425,325 L 418,348 L 412,372 L 405,398 L 395,425 L 382,452 
    L 368,482 L 348,515 L 328,545 L 308,568 L 285,582 L 268,575 
    L 255,555 L 248,525 L 242,492 L 238,460 L 235,428 L 225,395 
    L 212,365 L 198,342 L 182,325 L 165,312 L 148,302 L 135,288 
    L 122,272 L 115,255 L 98,245 L 82,232 L 68,220 L 58,202 
    L 52,185 L 62,172 L 78,162 L 95,152 L 115,145 L 135,138 
    L 148,125 L 158,105 L 165,85 Z
  " 
  fill="url(#africaBaseGrad)" 
  stroke="#334155" 
  stroke-width="2" 
  stroke-linejoin="round"
  />

  <!-- MADAGASCAR ISLAND -->
  <path d="
    M 445,410 C 452,430 458,455 450,480 C 442,505 428,525 418,515 C 412,492 422,460 432,430 Z
  " 
  fill="url(#africaBaseGrad)" 
  stroke="#334155" 
  stroke-width="1.8"/>

  <!-- ================= ETHIOPIA ACCURATE REAL SHAPE ================= -->
  <path d="
    M 388,185 
    L 398,188 L 408,198 L 418,205 L 428,212 L 442,225 L 452,238 
    L 462,250 L 448,260 L 432,270 L 418,280 L 405,290 L 392,298 
    L 380,305 L 368,298 L 358,290 L 348,282 L 342,270 L 338,255 
    L 332,242 L 338,230 L 348,220 L 358,210 L 368,200 L 378,192 Z
  " 
  fill="url(#ethiopiaGlowGrad)" 
  stroke="#f59e0b" 
  stroke-width="2.5" 
  stroke-linejoin="round"
  filter="url(#ethiopiaPulse)"
  />

  <!-- ADDIS ABABA CAPITAL PIN -->
  <circle cx="388" cy="245" r="12" fill="#f59e0b" fill-opacity="0.25">
    <animate attributeName="r" values="8;16;8" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="388" cy="245" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- POINTER & CALLOUT LABEL -->
  <line x1="388" y1="245" x2="470" y2="180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="470" cy="180" r="3" fill="#f59e0b"/>

  <rect x="455" y="130" width="125" height="42" fill="#111827" stroke="#6d28d9" stroke-width="1.5" rx="8"/>
  <text x="465" y="148" fill="#ffffff" font-family="Poppins, sans-serif" font-weight="700" font-size="11">ETHIOPIA</text>
  <text x="465" y="162" fill="#f59e0b" font-family="Inter, sans-serif" font-weight="600" font-size="8" text-transform="uppercase" letter-spacing="0.8">Horn of Africa</text>

  <!-- GEOGRAPHIC REGION ANNOTATIONS -->

  <text x="360" y="110" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8">Red Sea</text>

  <text x="80" y="360" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8">Atlantic Ocean</text>

  <!-- BRAND WATERMARK -->
  <text x="25" y="620" fill="#6d28d9" font-family="Poppins, sans-serif" font-weight="800" font-size="13" letter-spacing="1">uniyo<tspan fill="#f59e0b">.</tspan></text>
  <text x="80" y="620" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9">Continental Location Map</text>
</svg>
