<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="160" y="35" fill="#facc15" font-size="22" font-weight="bold">COMPARATIVE PHYSIOGRAPHIC PROFILE</text>
    
    <!-- Profile Box -->
    <rect x="40" y="60" width="620" height="380" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Western Lowlands -->
    <rect x="60" y="390" width="120" height="30" fill="#f59e0b" opacity="0.5"/>
    <text x="70" y="410" fill="#f59e0b" font-size="12">Western</text>
    <text x="75" y="423" fill="#94a3b8" font-size="9">500-1,000m</text>
    
    <!-- Western Highlands -->
    <rect x="180" y="250" width="120" height="170" fill="#b45309" opacity="0.6"/>
    <text x="195" y="270" fill="#facc15" font-size="12">Western</text>
    <text x="200" y="285" fill="#facc15" font-size="12">Highlands</text>
    <text x="200" y="300" fill="#94a3b8" font-size="9">3,000-4,550m</text>
    
    <!-- Rift Valley -->
    <rect x="300" y="360" width="100" height="60" fill="#f43f5e" opacity="0.5"/>
    <text x="310" y="380" fill="#f43f5e" font-size="11">Rift</text>
    <text x="310" y="395" fill="#f43f5e" font-size="11">Valley</text>
    <text x="310" y="410" fill="#94a3b8" font-size="9">1,500-2,000m</text>
    
    <!-- Eastern Highlands -->
    <rect x="400" y="270" width="120" height="150" fill="#b45309" opacity="0.6"/>
    <text x="415" y="290" fill="#facc15" font-size="12">Eastern</text>
    <text x="420" y="305" fill="#facc15" font-size="12">Highlands</text>
    <text x="420" y="320" fill="#94a3b8" font-size="9">2,500-4,377m</text>
    
    <!-- Eastern Lowlands -->
    <rect x="520" y="390" width="120" height="30" fill="#f59e0b" opacity="0.5"/>
    <text x="535" y="410" fill="#f59e0b" font-size="12">Eastern</text>
    <text x="540" y="423" fill="#94a3b8" font-size="9">500-1,000m</text>
    
    <!-- Danakil Depression -->
    <rect x="640" y="420" width="20" height="5" fill="#92400e" opacity="0.6"/>
    <text x="625" y="435" fill="#92400e" font-size="9">Danakil</text>
    <text x="625" y="445" fill="#94a3b8" font-size="8">-125m</text>
    
    <!-- Scale -->
    <rect x="40" y="450" width="620" height="20" rx="4" fill="#1e293b"/>
    <line x1="40" y1="450" x2="40" y2="470" stroke="#94a3b8" stroke-width="1"/>
    <line x1="660" y1="450" x2="660" y2="470" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Elevation Scale -->
    <text x="300" y="80" fill="#f8fafc" font-size="14" font-weight="bold">Elevation (meters)</text>
    
    <line x1="100" y1="90" x2="600" y2="90" stroke="#94a3b8" stroke-width="1"/>
    <text x="70" y="95" fill="#94a3b8" font-size="9">0m</text>
    <text x="280" y="95" fill="#f59e0b" font-size="9">1,500m</text>
    <text x="550" y="95" fill="#facc15" font-size="9">4,550m</text>
    
    <!-- Gradient -->
    <rect x="100" y="100" width="500" height="10" rx="2" fill="none" stroke="#94a3b8" stroke-width="0.5"/>
    <rect x="100" y="100" width="125" height="10" rx="2" fill="#14b8a6"/>
    <rect x="225" y="100" width="125" height="10" rx="0" fill="#f59e0b"/>
    <rect x="350" y="100" width="125" height="10" rx="0" fill="#b45309"/>
    <rect x="475" y="100" width="125" height="10" rx="2" fill="#f8fafc"/>
</svg>
