<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="22" font-weight="bold">LOCATION MAP OF ETHIOPIA</text>
    
    <!-- Grid Lines -->
    <line x1="100" y1="60" x2="100" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="200" y1="60" x2="200" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="300" y1="60" x2="300" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="400" y1="60" x2="400" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="500" y1="60" x2="500" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    
    <line x1="60" y1="100" x2="540" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="60" y1="180" x2="540" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="60" y1="260" x2="540" y2="260" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="60" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Ethiopia Main Shape -->
    <path d="M 220 90 Q 260 80 300 95 Q 340 90 360 110 Q 380 130 390 150 Q 400 170 380 190 Q 360 210 370 230 Q 380 250 360 270 Q 340 290 320 300 Q 300 310 280 300 Q 260 290 240 300 Q 220 310 200 290 Q 180 270 170 250 Q 160 230 180 210 Q 200 190 190 170 Q 180 150 200 130 Q 210 110 220 90 Z" 
    fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Country Label -->
    <text x="255" y="210" fill="#facc15" font-size="20" font-weight="bold">ETHIOPIA</text>
    
    <!-- Neighboring Countries -->
    <text x="180" y="105" fill="#f43f5e" font-size="14">Eritrea</text>
    <text x="420" y="140" fill="#f43f5e" font-size="14">Somalia</text>
    <text x="410" y="310" fill="#f43f5e" font-size="14">Kenya</text>
    <text x="140" y="330" fill="#f43f5e" font-size="14">South Sudan</text>
    <text x="160" y="200" fill="#f43f5e" font-size="14">Sudan</text>
    
    <!-- Djibouti -->
    <text x="420" y="105" fill="#f59e0b" font-size="12">Djibouti</text>
    
    <!-- Latitude Labels -->
    <text x="40" y="105" fill="#94a3b8" font-size="11">15°N</text>
    <text x="40" y="185" fill="#94a3b8" font-size="11">12°N</text>
    <text x="40" y="265" fill="#94a3b8" font-size="11">9°N</text>
    <text x="40" y="345" fill="#94a3b8" font-size="11">6°N</text>
    <text x="40" y="415" fill="#94a3b8" font-size="11">3°N</text>
    
    <!-- Longitude Labels -->
    <text x="95" y="445" fill="#94a3b8" font-size="11">33°E</text>
    <text x="195" y="445" fill="#94a3b8" font-size="11">36°E</text>
    <text x="295" y="445" fill="#94a3b8" font-size="11">39°E</text>
    <text x="395" y="445" fill="#94a3b8" font-size="11">42°E</text>
    <text x="495" y="445" fill="#94a3b8" font-size="11">45°E</text>
    
    <!-- Equator Reference -->
    <text x="40" y="475" fill="#f59e0b" font-size="12">Equator 0°</text>
    <line x1="60" y1="470" x2="540" y2="470" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Tropic of Cancer -->
    <text x="40" y="90" fill="#f59e0b" font-size="11">Tropic of Cancer 23.5°N</text>
    <line x1="60" y1="85" x2="540" y2="85" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Red Sea Label -->
    <text x="480" y="70" fill="#14b8a6" font-size="14" font-weight="bold">Red Sea</text>
    <path d="M 520 80 Q 540 160 520 240" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Gulf of Aden -->
    <text x="500" y="180" fill="#14b8a6" font-size="12">Gulf of Aden</text>
</svg>
