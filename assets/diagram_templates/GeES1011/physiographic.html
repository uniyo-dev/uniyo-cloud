<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="160" y="35" fill="#facc15" font-size="22" font-weight="bold">PHYSIOGRAPHIC REGIONS - SUMMARY TABLE</text>
    
    <!-- Table -->
    <rect x="40" y="60" width="620" height="380" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Headers -->
    <rect x="40" y="60" width="620" height="40" rx="8" fill="#1e293b"/>
    <text x="80" y="85" fill="#facc15" font-size="14" font-weight="bold">Region</text>
    <text x="200" y="85" fill="#facc15" font-size="14" font-weight="bold">Elevation</text>
    <text x="320" y="85" fill="#facc15" font-size="14" font-weight="bold">Major Features</text>
    <text x="520" y="85" fill="#facc15" font-size="14" font-weight="bold">Climate</text>
    
    <!-- Row 1: Western Highlands -->
    <line x1="40" y1="100" x2="660" y2="100" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="100" width="620" height="50" fill="#b45309" opacity="0.15"/>
    <text x="60" y="130" fill="#facc15" font-size="13" font-weight="bold">Western Highlands</text>
    <text x="200" y="130" fill="#94a3b8" font-size="12">3,000-4,550m</text>
    <text x="320" y="130" fill="#94a3b8" font-size="11">Ras Dashen, Lake Tana</text>
    <text x="520" y="130" fill="#94a3b8" font-size="11">Dega/Weyna Dega</text>
    
    <!-- Row 2: Central Highlands -->
    <line x1="40" y1="150" x2="660" y2="150" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="150" width="620" height="50" fill="#b45309" opacity="0.1"/>
    <text x="60" y="180" fill="#facc15" font-size="13" font-weight="bold">Central Highlands</text>
    <text x="200" y="180" fill="#94a3b8" font-size="12">2,500-4,000m</text>
    <text x="320" y="180" fill="#94a3b8" font-size="11">Addis Ababa, Rift</text>
    <text x="520" y="180" fill="#94a3b8" font-size="11">Weyna Dega</text>
    
    <!-- Row 3: Eastern Highlands -->
    <line x1="40" y1="200" x2="660" y2="200" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="200" width="620" height="50" fill="#b45309" opacity="0.15"/>
    <text x="60" y="230" fill="#facc15" font-size="13" font-weight="bold">Eastern Highlands</text>
    <text x="200" y="230" fill="#94a3b8" font-size="12">2,500-4,377m</text>
    <text x="320" y="230" fill="#94a3b8" font-size="11">Bale Mountains</text>
    <text x="520" y="230" fill="#94a3b8" font-size="11">Dega/Weyna Dega</text>
    
    <!-- Row 4: Rift Valley -->
    <line x1="40" y1="250" x2="660" y2="250" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="250" width="620" height="50" fill="#f43f5e" opacity="0.1"/>
    <text x="60" y="280" fill="#f43f5e" font-size="13" font-weight="bold">Great Rift Valley</text>
    <text x="200" y="280" fill="#94a3b8" font-size="12">1,500-2,000m</text>
    <text x="320" y="280" fill="#94a3b8" font-size="11">Lakes, Volcanic</text>
    <text x="520" y="280" fill="#94a3b8" font-size="11">Kolla/Weyna Dega</text>
    
    <!-- Row 5: Western Lowlands -->
    <line x1="40" y1="300" x2="660" y2="300" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="300" width="620" height="50" fill="#f59e0b" opacity="0.1"/>
    <text x="60" y="330" fill="#f59e0b" font-size="13" font-weight="bold">Western Lowlands</text>
    <text x="200" y="330" fill="#94a3b8" font-size="12">500-1,000m</text>
    <text x="320" y="330" fill="#94a3b8" font-size="11">Baro River</text>
    <text x="520" y="330" fill="#94a3b8" font-size="11">Kolla</text>
    
    <!-- Row 6: Eastern Lowlands -->
    <line x1="40" y1="350" x2="660" y2="350" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="350" width="620" height="50" fill="#f59e0b" opacity="0.1"/>
    <text x="60" y="380" fill="#f59e0b" font-size="13" font-weight="bold">Eastern Lowlands</text>
    <text x="200" y="380" fill="#94a3b8" font-size="12">500-1,500m</text>
    <text x="320" y="380" fill="#94a3b8" font-size="11">Wabe Shebelle</text>
    <text x="520" y="380" fill="#94a3b8" font-size="11">Kolla</text>
    
    <!-- Row 7: Danakil -->
    <line x1="40" y1="400" x2="660" y2="400" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="400" width="620" height="40" fill="#92400e" opacity="0.15"/>
    <text x="60" y="425" fill="#92400e" font-size="13" font-weight="bold">Danakil Depression</text>
    <text x="200" y="425" fill="#94a3b8" font-size="12">-125m</text>
    <text x="320" y="425" fill="#94a3b8" font-size="11">Salt, Volcanoes</text>
    <text x="520" y="425" fill="#94a3b8" font-size="11">Desert</text>
</svg>
