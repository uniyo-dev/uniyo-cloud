<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="22" font-weight="bold">3D PHYSIOGRAPHIC ZONES OF ETHIOPIA</text>
    
    <!-- 3D Blocks -->
    <!-- Western Lowlands Block -->
    <rect x="60" y="320" width="100" height="60" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-width="1"/>
    <polygon points="60,320 80,300 180,300 160,320" fill="#f59e0b" opacity="0.3"/>
    <text x="70" y="345" fill="#f59e0b" font-size="10">Western</text>
    <text x="75" y="358" fill="#94a3b8" font-size="9">Lowlands</text>
    
    <!-- Western Highlands Block -->
    <rect x="160" y="180" width="120" height="140" fill="#b45309" opacity="0.6" stroke="#facc15" stroke-width="1"/>
    <polygon points="160,180 180,160 300,160 280,180" fill="#b45309" opacity="0.4"/>
    <text x="185" y="230" fill="#facc15" font-size="12">Western</text>
    <text x="190" y="245" fill="#facc15" font-size="12">Highlands</text>
    <text x="195" y="260" fill="#94a3b8" font-size="9">3,000-4,550m</text>
    
    <!-- Rift Valley Block -->
    <rect x="280" y="280" width="100" height="40" fill="#f43f5e" opacity="0.5" stroke="#f43f5e" stroke-width="1"/>
    <polygon points="280,280 300,260 400,260 380,280" fill="#f43f5e" opacity="0.3"/>
    <text x="295" y="300" fill="#f43f5e" font-size="10">Rift</text>
    <text x="300" y="313" fill="#94a3b8" font-size="9">Valley</text>
    
    <!-- Eastern Highlands Block -->
    <rect x="380" y="200" width="120" height="120" fill="#b45309" opacity="0.6" stroke="#facc15" stroke-width="1"/>
    <polygon points="380,200 400,180 520,180 500,200" fill="#b45309" opacity="0.4"/>
    <text x="400" y="250" fill="#facc15" font-size="12">Eastern</text>
    <text x="405" y="265" fill="#facc15" font-size="12">Highlands</text>
    <text x="410" y="280" fill="#94a3b8" font-size="9">2,500-4,377m</text>
    
    <!-- Eastern Lowlands Block -->
    <rect x="500" y="320" width="100" height="60" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-width="1"/>
    <polygon points="500,320 520,300 620,300 600,320" fill="#f59e0b" opacity="0.3"/>
    <text x="515" y="345" fill="#f59e0b" font-size="10">Eastern</text>
    <text x="520" y="358" fill="#94a3b8" font-size="9">Lowlands</text>
    
    <!-- Danakil Block -->
    <rect x="600" y="360" width="60" height="20" fill="#92400e" opacity="0.6" stroke="#f43f5e" stroke-width="1"/>
    <polygon points="600,360 620,340 680,340 660,360" fill="#92400e" opacity="0.4"/>
    <text x="610" y="375" fill="#92400e" font-size="9">Danakil</text>
    <text x="615" y="385" fill="#94a3b8" font-size="8">-125m</text>
    
    <!-- Arrows showing elevation -->
    <text x="160" y="170" fill="#facc15" font-size="20">↑</text>
    <text x="380" y="190" fill="#facc15" font-size="20">↑</text>
</svg>
