<svg width="700" height="450" viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="450" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="22" font-weight="bold">GREAT RIFT VALLEY - CROSS SECTION</text>
    
    <!-- Western Escarpment -->
    <path d="M 50 350 L 100 250 L 150 200 L 200 180 L 250 200 L 300 230 L 350 260 L 400 280 L 430 300 L 460 320 L 480 340 L 500 350 Z" 
    fill="#b45309" opacity="0.5"/>
    <path d="M 50 350 L 100 250 L 150 200 L 200 180 L 250 200 L 300 230 L 350 260 L 400 280 L 430 300 L 460 320 L 480 340 L 500 350 Z" 
    fill="none" stroke="#facc15" stroke-width="2"/>
    
    <!-- Rift Floor -->
    <rect x="250" y="350" width="250" height="50" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    
    <!-- Eastern Escarpment -->
    <path d="M 500 350 L 510 330 L 530 300 L 550 270 L 580 230 L 610 190 L 640 150 L 660 120 L 680 100" 
    fill="#b45309" opacity="0.5"/>
    <path d="M 500 350 L 510 330 L 530 300 L 550 270 L 580 230 L 610 190 L 640 150 L 660 120 L 680 100" 
    fill="none" stroke="#facc15" stroke-width="2"/>
    
    <!-- Rift Valley Lakes -->
    <ellipse cx="350" cy="340" rx="40" ry="12" fill="#38bdf8" opacity="0.6"/>
    <text x="340" y="330" fill="#38bdf8" font-size="11">Lake Ziway</text>
    
    <ellipse cx="420" cy="340" rx="30" ry="10" fill="#38bdf8" opacity="0.5"/>
    <text x="415" y="330" fill="#38bdf8" font-size="11">Lake Awasa</text>
    
    <!-- Volcanic Features -->
    <path d="M 300 280 L 310 260 L 320 280 Z" fill="#f43f5e" opacity="0.6"/>
    <circle cx="310" cy="255" r="4" fill="#f59e0b"/>
    <text x="290" y="275" fill="#f43f5e" font-size="10">Volcanic</text>
    
    <path d="M 460 290 L 470 270 L 480 290 Z" fill="#f43f5e" opacity="0.6"/>
    <circle cx="470" cy="265" r="4" fill="#f59e0b"/>
    <text x="450" y="285" fill="#f43f5e" font-size="10">Volcanic</text>
    
    <!-- Labels -->
    <text x="90" y="240" fill="#facc15" font-size="13" font-weight="bold">Western</text>
    <text x="95" y="255" fill="#facc15" font-size="13" font-weight="bold">Highlands</text>
    <text x="95" y="270" fill="#94a3b8" font-size="10">3,000-4,550m</text>
    
    <text x="590" y="180" fill="#facc15" font-size="13" font-weight="bold">Eastern</text>
    <text x="595" y="195" fill="#facc15" font-size="13" font-weight="bold">Highlands</text>
    <text x="595" y="210" fill="#94a3b8" font-size="10">2,500-4,377m</text>
    
    <text x="370" y="375" fill="#f43f5e" font-size="14" font-weight="bold">RIFT VALLEY FLOOR</text>
    <text x="340" y="392" fill="#94a3b8" font-size="11">1,500-2,000m</text>
    
    <!-- Fault Lines -->
    <line x1="250" y1="300" x2="250" y2="400" stroke="#f43f5e" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="500" y1="300" x2="500" y2="400" stroke="#f43f5e" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="235" y="405" fill="#f43f5e" font-size="10">Fault</text>
    <text x="485" y="405" fill="#f43f5e" font-size="10">Fault</text>
    
    <!-- Legend -->
    <rect x="40" y="395" width="620" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="60" y="415" fill="#94a3b8" font-size="12">The Ethiopian Rift Valley is part of the East African Rift System, formed by tectonic plate divergence</text>
    <text x="60" y="432" fill="#94a3b8" font-size="12">Contains numerous lakes, hot springs, and volcanic features</text>
</svg>
