<svg width="650" height="450" viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg">
    <rect width="650" height="450" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="150" y="35" fill="#facc15" font-size="22" font-weight="bold">TECTONIC PLATES & RIFT SYSTEM</text>
    
    <!-- African Plate -->
    <path d="M 60 200 Q 120 180 180 200 Q 240 220 300 200 Q 360 180 420 200 Q 480 220 540 200 L 540 380 L 60 380 Z" 
    fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="240" y="310" fill="#38bdf8" font-size="20" font-weight="bold">African Plate</text>
    
    <!-- Arabian Plate -->
    <path d="M 480 80 Q 520 60 560 80 L 560 200 Q 520 180 480 200 Z" 
    fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <text x="500" y="140" fill="#f43f5e" font-size="16" font-weight="bold">Arabian</text>
    <text x="505" y="160" fill="#f43f5e" font-size="16" font-weight="bold">Plate</text>
    
    <!-- Somali Plate -->
    <path d="M 360 180 Q 420 200 480 180 L 480 380 L 360 380 Z" 
    fill="#1e293b" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="390" y="290" fill="#f59e0b" font-size="16" font-weight="bold">Somali</text>
    <text x="400" y="310" fill="#f59e0b" font-size="16" font-weight="bold">Plate</text>
    
    <!-- East African Rift -->
    <path d="M 180 240 Q 280 220 380 240 Q 420 250 460 260" 
    fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="10,5"/>
    <path d="M 180 260 Q 280 240 380 260 Q 420 270 460 280" 
    fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="10,5"/>
    
    <!-- Rift Label -->
    <text x="260" y="240" fill="#facc15" font-size="16" font-weight="bold">East African Rift</text>
    
    <!-- Divergence Arrows -->
    <text x="300" y="275" fill="#f59e0b" font-size="24">← →</text>
    <text x="290" y="290" fill="#94a3b8" font-size="11">Divergence</text>
    
    <text x="420" y="235" fill="#f59e0b" font-size="20">←</text>
    <text x="435" y="225" fill="#94a3b8" font-size="10">Divergence</text>
    
    <!-- Red Sea -->
    <text x="520" y="100" fill="#14b8a6" font-size="16" font-weight="bold">Red Sea</text>
    <path d="M 540 110 L 530 170 L 540 190" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,5"/>
    
    <!-- Gulf of Aden -->
    <text x="480" y="70" fill="#14b8a6" font-size="14">Gulf of Aden</text>
    <path d="M 480 80 L 500 100 L 520 95" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,5"/>
    
    <!-- Ethiopian Rift Valley Label -->
    <text x="310" y="200" fill="#f43f5e" font-size="13" font-weight="bold">↑ Ethiopian Rift</text>
    <text x="315" y="215" fill="#f43f5e" font-size="13" font-weight="bold">Valley</text>
    
    <!-- Great Lakes Region -->
    <circle cx="180" cy="300" r="15" fill="#14b8a6" opacity="0.5"/>
    <text x="170" y="320" fill="#14b8a6" font-size="10">Lake</text>
    <text x="170" y="332" fill="#14b8a6" font-size="10">Victoria</text>
    
    <!-- Legend -->
    <rect x="60" y="395" width="530" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <line x1="80" y1="418" x2="140" y2="418" stroke="#38bdf8" stroke-width="3"/>
    <text x="148" y="423" fill="#94a3b8" font-size="11">Plate Boundary</text>
    
    <line x1="240" y1="418" x2="300" y2="418" stroke="#facc15" stroke-width="5" stroke-dasharray="8,4"/>
    <text x="308" y="423" fill="#94a3b8" font-size="11">Rift Valley</text>
    
    <text x="400" y="423" fill="#f59e0b" font-size="16">← →</text>
    <text x="430" y="423" fill="#94a3b8" font-size="11">Plate Movement</text>
</svg>
