<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="520" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">MATRIX MULTIPLICATION - STEP BY STEP</text>
    
    <!-- Matrix A -->
    <rect x="60" y="60" width="100" height="140" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="85" fill="#38bdf8" font-size="14" font-weight="bold">A (2×3)</text>
    <text x="90" y="110" fill="#f8fafc" font-size="14">[1 2 3]</text>
    <text x="90" y="132" fill="#f8fafc" font-size="14">[4 5 6]</text>
    
    <!-- Multiplication Sign -->
    <text x="190" y="140" fill="#facc15" font-size="28">×</text>
    
    <!-- Matrix B -->
    <rect x="230" y="60" width="100" height="140" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="250" y="85" fill="#f43f5e" font-size="14" font-weight="bold">B (3×2)</text>
    <text x="260" y="110" fill="#f8fafc" font-size="14">[7 8]</text>
    <text x="260" y="132" fill="#f8fafc" font-size="14">[9 10]</text>
    <text x="260" y="154" fill="#f8fafc" font-size="14">[11 12]</text>
    
    <!-- Equals -->
    <text x="360" y="140" fill="#facc15" font-size="28">=</text>
    
    <!-- Result Matrix -->
    <rect x="400" y="60" width="100" height="140" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="415" y="85" fill="#14b8a6" font-size="14" font-weight="bold">C (2×2)</text>
    <text x="430" y="110" fill="#f8fafc" font-size="14">[58 64]</text>
    <text x="430" y="132" fill="#f8fafc" font-size="14">[139 154]</text>
    
    <!-- Calculation Steps -->
    <rect x="60" y="230" width="600" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="260" fill="#facc15" font-size="16" font-weight="bold">Detailed Calculations:</text>
    
    <!-- Step 1 -->
    <rect x="80" y="280" width="260" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="302" fill="#38bdf8" font-size="13" font-weight="bold">c₁₁ = row₁ · col₁</text>
    <text x="100" y="322" fill="#94a3b8" font-size="12">= (1)(7) + (2)(9) + (3)(11)</text>
    <text x="100" y="338" fill="#f8fafc" font-size="12">= 7 + 18 + 33 = 58</text>
    
    <!-- Step 2 -->
    <rect x="360" y="280" width="280" height="60" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="380" y="302" fill="#f43f5e" font-size="13" font-weight="bold">c₁₂ = row₁ · col₂</text>
    <text x="380" y="322" fill="#94a3b8" font-size="12">= (1)(8) + (2)(10) + (3)(12)</text>
    <text x="380" y="338" fill="#f8fafc" font-size="12">= 8 + 20 + 36 = 64</text>
    
    <!-- Step 3 -->
    <rect x="80" y="355" width="260" height="60" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1"/>
    <text x="100" y="377" fill="#14b8a6" font-size="13" font-weight="bold">c₂₁ = row₂ · col₁</text>
    <text x="100" y="397" fill="#94a3b8" font-size="12">= (4)(7) + (5)(9) + (6)(11)</text>
    <text x="100" y="413" fill="#f8fafc" font-size="12">= 28 + 45 + 66 = 139</text>
    
    <!-- Step 4 -->
    <rect x="360" y="355" width="280" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="380" y="377" fill="#f59e0b" font-size="13" font-weight="bold">c₂₂ = row₂ · col₂</text>
    <text x="380" y="397" fill="#94a3b8" font-size="12">= (4)(8) + (5)(10) + (6)(12)</text>
    <text x="380" y="413" fill="#f8fafc" font-size="12">= 32 + 50 + 72 = 154</text>
</svg>
