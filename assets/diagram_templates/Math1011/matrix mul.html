<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">MATRIX MULTIPLICATION</text>
    
    <!-- Matrix A -->
    <rect x="80" y="80" width="100" height="140" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="105" fill="#38bdf8" font-size="14" font-weight="bold">A</text>
    <text x="115" y="130" fill="#f8fafc" font-size="16">[2 1]</text>
    <text x="115" y="155" fill="#f8fafc" font-size="16">[0 3]</text>
    
    <!-- Multiplication Symbol -->
    <text x="210" y="160" fill="#facc15" font-size="28">×</text>
    
    <!-- Matrix B -->
    <rect x="250" y="80" width="100" height="140" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="270" y="105" fill="#f43f5e" font-size="14" font-weight="bold">B</text>
    <text x="285" y="130" fill="#f8fafc" font-size="16">[1 2]</text>
    <text x="285" y="155" fill="#f8fafc" font-size="16">[3 4]</text>
    
    <!-- Equals Symbol -->
    <text x="380" y="160" fill="#facc15" font-size="28">=</text>
    
    <!-- Matrix C (Result) -->
    <rect x="420" y="80" width="100" height="140" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="440" y="105" fill="#14b8a6" font-size="14" font-weight="bold">C = AB</text>
    <text x="445" y="130" fill="#f8fafc" font-size="16">[5 8]</text>
    <text x="445" y="155" fill="#f8fafc" font-size="16">[9 12]</text>
    
    <!-- Calculation Steps -->
    <rect x="80" y="250" width="520" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="280" fill="#facc15" font-size="16" font-weight="bold">Calculation Steps:</text>
    
    <!-- Step 1 -->
    <text x="100" y="310" fill="#38bdf8" font-size="14">Step 1: c₁₁ = a₁₁·b₁₁ + a₁₂·b₂₁</text>
    <text x="120" y="330" fill="#94a3b8" font-size="13">= (2)(1) + (1)(3) = 2 + 3 = 5</text>
    
    <!-- Step 2 -->
    <text x="100" y="360" fill="#f43f5e" font-size="14">Step 2: c₁₂ = a₁₁·b₁₂ + a₁₂·b₂₂</text>
    <text x="120" y="380" fill="#94a3b8" font-size="13">= (2)(2) + (1)(4) = 4 + 4 = 8</text>
    
    <!-- Step 3 -->
    <text x="100" y="410" fill="#14b8a6" font-size="14">Step 3: c₂₁ = a₂₁·b₁₁ + a₂₂·b₂₁</text>
    <text x="120" y="430" fill="#94a3b8" font-size="13">= (0)(1) + (3)(3) = 0 + 9 = 9</text>
    
    <!-- Step 4 -->
    <text x="380" y="310" fill="#f59e0b" font-size="14">Step 4: c₂₂ = a₂₁·b₁₂ + a₂₂·b₂₂</text>
    <text x="400" y="330" fill="#94a3b8" font-size="13">= (0)(2) + (3)(4) = 0 + 12 = 12</text>
</svg>
