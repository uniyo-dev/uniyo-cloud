<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">HIERARCHY OF NUMBER SYSTEMS</text>
    
    <!-- Main Box - Complex Numbers -->
    <rect x="150" y="60" width="400" height="380" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="280" y="90" fill="#38bdf8" font-size="18" font-weight="bold">COMPLEX NUMBERS (ℂ)</text>
    
    <!-- Real Numbers -->
    <rect x="170" y="110" width="360" height="300" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <text x="310" y="140" fill="#facc15" font-size="16" font-weight="bold">REAL NUMBERS (ℝ)</text>
    
    <!-- Irrational Numbers -->
    <rect x="390" y="160" width="120" height="80" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="410" y="185" fill="#f43f5e" font-size="12" font-weight="bold">Irrational</text>
    <text x="420" y="205" fill="#94a3b8" font-size="11">π, √2, e</text>
    
    <!-- Rational Numbers -->
    <rect x="180" y="160" width="190" height="230" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
    <text x="235" y="185" fill="#14b8a6" font-size="14" font-weight="bold">RATIONAL (ℚ)</text>
    
    <!-- Integers -->
    <rect x="195" y="200" width="160" height="170" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="245" y="225" fill="#f59e0b" font-size="13" font-weight="bold">INTEGERS (ℤ)</text>
    
    <!-- Whole Numbers -->
    <rect x="210" y="240" width="130" height="110" rx="6" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="235" y="265" fill="#f8fafc" font-size="12" font-weight="bold">WHOLE (𝕎)</text>
    
    <!-- Natural Numbers -->
    <rect x="225" y="275" width="100" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="255" y="298" fill="#38bdf8" font-size="12" font-weight="bold">NATURAL (ℕ)</text>
    <text x="260" y="318" fill="#94a3b8" font-size="10">1, 2, 3...</text>
    
    <!-- Examples -->
    <text x="235" y="355" fill="#94a3b8" font-size="10">Includes 0</text>
    
    <!-- Imaginary Numbers -->
    <rect x="170" y="420" width="100" height="30" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="185" y="440" fill="#f43f5e" font-size="12" font-weight="bold">Imaginary</text>
    
    <!-- Arrows -->
    <path d="M 270 420 L 350 390" stroke="#94a3b8" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
    
    <!-- Legend -->
    <rect x="520" y="70" width="150" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="535" y="95" fill="#f8fafc" font-size="13" font-weight="bold">Legend</text>
    <text x="535" y="115" fill="#facc15" font-size="11">ℝ = Real</text>
    <text x="535" y="130" fill="#14b8a6" font-size="11">ℚ = Rational</text>
    <text x="535" y="145" fill="#f59e0b" font-size="11">ℤ = Integers</text>
    <text x="535" y="160" fill="#38bdf8" font-size="11">ℕ = Natural</text>
    <text x="535" y="175" fill="#f43f5e" font-size="11">ℂ = Complex</text>
</svg>
