<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="160" y="35" fill="#facc15" font-size="24" font-weight="bold">SEQUENCES & SERIES - ARITHMETIC PROGRESSION</text>
    
    <!-- Number Line -->
    <line x1="80" y1="180" x2="620" y2="180" stroke="#38bdf8" stroke-width="2"/>
    <text x="620" y="195" fill="#38bdf8" font-size="14">n (term number)</text>
    
    <!-- Terms -->
    <circle cx="120" cy="180" r="20" fill="#f43f5e" opacity="0.3" stroke="#f43f5e" stroke-width="2"/>
    <text x="112" y="185" fill="#f43f5e" font-size="14">a₁</text>
    
    <circle cx="200" cy="180" r="20" fill="#f59e0b" opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
    <text x="192" y="185" fill="#f59e0b" font-size="14">a₂</text>
    
    <circle cx="280" cy="180" r="20" fill="#14b8a6" opacity="0.3" stroke="#14b8a6" stroke-width="2"/>
    <text x="272" y="185" fill="#14b8a6" font-size="14">a₃</text>
    
    <circle cx="360" cy="180" r="20" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <text x="352" y="185" fill="#38bdf8" font-size="14">a₄</text>
    
    <circle cx="440" cy="180" r="20" fill="#facc15" opacity="0.3" stroke="#facc15" stroke-width="2"/>
    <text x="432" y="185" fill="#facc15" font-size="14">a₅</text>
    
    <circle cx="520" cy="180" r="20" fill="#f43f5e" opacity="0.3" stroke="#f43f5e" stroke-width="2"/>
    <text x="512" y="185" fill="#f43f5e" font-size="14">a₆</text>
    
    <!-- Dots -->
    <text x="590" y="185" fill="#94a3b8" font-size="20">...</text>
    
    <!-- Common Difference Arrows -->
    <path d="M 140 200 L 180 200" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="155" y="215" fill="#f8fafc" font-size="11">d = 2</text>
    
    <path d="M 220 200 L 260 200" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 300 200 L 340 200" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 380 200 L 420 200" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 460 200 L 500 200" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Terms Values -->
    <text x="105" y="245" fill="#94a3b8" font-size="11">= 2</text>
    <text x="185" y="245" fill="#94a3b8" font-size="11">= 4</text>
    <text x="265" y="245" fill="#94a3b8" font-size="11">= 6</text>
    <text x="345" y="245" fill="#94a3b8" font-size="11">= 8</text>
    <text x="425" y="245" fill="#94a3b8" font-size="11">= 10</text>
    <text x="505" y="245" fill="#94a3b8" font-size="11">= 12</text>
    
    <!-- Formula Box -->
    <rect x="80" y="280" width="540" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="310" fill="#facc15" font-size="16" font-weight="bold">Arithmetic Progression Formulas:</text>
    
    <rect x="100" y="330" width="240" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="120" y="352" fill="#38bdf8" font-size="14" font-weight="bold">nth Term:</text>
    <text x="220" y="352" fill="#f8fafc" font-size="14">aₙ = a₁ + (n-1)d</text>
    <text x="120" y="370" fill="#94a3b8" font-size="11">a₁ = first term, d = common difference</text>
    
    <rect x="360" y="330" width="240" height="50" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1"/>
    <text x="380" y="352" fill="#14b8a6" font-size="14" font-weight="bold">Sum of n Terms:</text>
    <text x="500" y="352" fill="#f8fafc" font-size="14">Sₙ = n/2(a₁ + aₙ)</text>
    <text x="380" y="370" fill="#94a3b8" font-size="11">or Sₙ = n/2[2a₁ + (n-1)d]</text>
    
    <!-- Example -->
    <rect x="100" y="395" width="500" height="50" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="120" y="418" fill="#f43f5e" font-size="14" font-weight="bold">Example:</text>
    <text x="220" y="418" fill="#f8fafc" font-size="13">2, 4, 6, 8, 10, ... (d = 2)</text>
    <text x="120" y="438" fill="#94a3b8" font-size="12">a₅ = 2 + (5-1)2 = 10</text>
    <text x="320" y="438" fill="#94a3b8" font-size="12">S₅ = 5/2(2+10) = 30</text>
</svg>
