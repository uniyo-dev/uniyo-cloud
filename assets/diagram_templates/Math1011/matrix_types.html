<svg width="700" height="550" viewBox="0 0 700 550" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="550" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="24" font-weight="bold">TYPES OF MATRICES - CLASSIFICATION</text>
    
    <!-- Row Matrix -->
    <rect x="40" y="60" width="200" height="120" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="85" fill="#38bdf8" font-size="14" font-weight="bold">Row Matrix</text>
    <text x="60" y="105" fill="#f8fafc" font-size="14">[2  -3  5  1]</text>
    <text x="60" y="125" fill="#94a3b8" font-size="11">1 × 4</text>
    <text x="60" y="145" fill="#94a3b8" font-size="10">Only one row</text>
    
    <!-- Column Matrix -->
    <rect x="260" y="60" width="200" height="120" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="280" y="85" fill="#f43f5e" font-size="14" font-weight="bold">Column Matrix</text>
    <text x="290" y="108" fill="#f8fafc" font-size="14">[ 4 ]</text>
    <text x="290" y="128" fill="#f8fafc" font-size="14">[ -1 ]</text>
    <text x="290" y="148" fill="#f8fafc" font-size="14">[ 3 ]</text>
    <text x="340" y="125" fill="#94a3b8" font-size="11">3 × 1</text>
    <text x="340" y="145" fill="#94a3b8" font-size="10">Only one column</text>
    
    <!-- Square Matrix -->
    <rect x="480" y="60" width="200" height="120" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="510" y="85" fill="#14b8a6" font-size="14" font-weight="bold">Square Matrix</text>
    <text x="510" y="108" fill="#f8fafc" font-size="14">[ 1  2 ]</text>
    <text x="510" y="128" fill="#f8fafc" font-size="14">[ 3  4 ]</text>
    <text x="580" y="125" fill="#94a3b8" font-size="11">2 × 2</text>
    <text x="580" y="145" fill="#94a3b8" font-size="10">m = n</text>
    
    <!-- Diagonal Matrix -->
    <rect x="40" y="200" width="200" height="120" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="225" fill="#f59e0b" font-size="14" font-weight="bold">Diagonal Matrix</text>
    <text x="60" y="248" fill="#f8fafc" font-size="14">[ 2  0  0 ]</text>
    <text x="60" y="268" fill="#f8fafc" font-size="14">[ 0  5  0 ]</text>
    <text x="60" y="288" fill="#f8fafc" font-size="14">[ 0  0  -1 ]</text>
    <text x="170" y="265" fill="#94a3b8" font-size="10">Non-diagonal = 0</text>
    
    <!-- Identity Matrix -->
    <rect x="260" y="200" width="200" height="120" rx="6" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="280" y="225" fill="#f8fafc" font-size="14" font-weight="bold">Identity Matrix</text>
    <text x="280" y="248" fill="#f8fafc" font-size="14">[ 1  0  0 ]</text>
    <text x="280" y="268" fill="#f8fafc" font-size="14">[ 0  1  0 ]</text>
    <text x="280" y="288" fill="#f8fafc" font-size="14">[ 0  0  1 ]</text>
    <text x="380" y="265" fill="#94a3b8" font-size="10">I₃</text>
    
    <!-- Zero Matrix -->
    <rect x="480" y="200" width="200" height="120" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="510" y="225" fill="#facc15" font-size="14" font-weight="bold">Zero Matrix</text>
    <text x="520" y="248" fill="#f8fafc" font-size="14">[ 0  0 ]</text>
    <text x="520" y="268" fill="#f8fafc" font-size="14">[ 0  0 ]</text>
    <text x="580" y="265" fill="#94a3b8" font-size="10">0₂×₂</text>
    
    <!-- Scalar Matrix -->
    <rect x="40" y="340" width="200" height="120" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="60" y="365" fill="#f43f5e" font-size="14" font-weight="bold">Scalar Matrix</text>
    <text x="60" y="388" fill="#f8fafc" font-size="14">[ 3  0 ]</text>
    <text x="60" y="408" fill="#f8fafc" font-size="14">[ 0  3 ]</text>
    <text x="170" y="400" fill="#94a3b8" font-size="10">k·I</text>
    
    <!-- Upper Triangular -->
    <rect x="260" y="340" width="200" height="120" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="280" y="365" fill="#14b8a6" font-size="14" font-weight="bold">Upper Triangular</text>
    <text x="280" y="388" fill="#f8fafc" font-size="14">[ 1  2  3 ]</text>
    <text x="280" y="408" fill="#f8fafc" font-size="14">[ 0  4  5 ]</text>
    <text x="280" y="428" fill="#f8fafc" font-size="14">[ 0  0  6 ]</text>
    <text x="390" y="400" fill="#94a3b8" font-size="10">Below diagonal = 0</text>
    
    <!-- Lower Triangular -->
    <rect x="480" y="340" width="200" height="120" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="510" y="365" fill="#f59e0b" font-size="14" font-weight="bold">Lower Triangular</text>
    <text x="510" y="388" fill="#f8fafc" font-size="14">[ 1  0  0 ]</text>
    <text x="510" y="408" fill="#f8fafc" font-size="14">[ 2  3  0 ]</text>
    <text x="510" y="428" fill="#f8fafc" font-size="14">[ 4  5  6 ]</text>
    <text x="620" y="400" fill="#94a3b8" font-size="10">Above diagonal = 0</text>
</svg>
