<svg width="700" height="550" viewBox="0 0 700 550" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="550" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">TYPES OF FUNCTIONS</text>
    
    <!-- One-to-One Function -->
    <rect x="40" y="60" width="190" height="220" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="85" fill="#38bdf8" font-size="14" font-weight="bold">One-to-One</text>
    
    <circle cx="80" cy="120" r="5" fill="#f43f5e"/>
    <circle cx="80" cy="145" r="5" fill="#f43f5e"/>
    <circle cx="80" cy="170" r="5" fill="#f43f5e"/>
    
    <line x1="90" y1="120" x2="170" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="90" y1="145" x2="170" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="90" y1="170" x2="170" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    
    <circle cx="180" cy="120" r="5" fill="#14b8a6"/>
    <circle cx="180" cy="145" r="5" fill="#14b8a6"/>
    <circle cx="180" cy="170" r="5" fill="#14b8a6"/>
    
    <text x="60" y="200" fill="#94a3b8" font-size="10">Domain</text>
    <text x="170" y="200" fill="#94a3b8" font-size="10">Codomain</text>
    <text x="60" y="220" fill="#f8fafc" font-size="9">Each input → unique output</text>
    <text x="60" y="235" fill="#94a3b8" font-size="9">f(x₁) = f(x₂) → x₁ = x₂</text>
    
    <!-- Onto Function -->
    <rect x="250" y="60" width="190" height="220" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="290" y="85" fill="#facc15" font-size="14" font-weight="bold">Onto (Surjective)</text>
    
    <circle cx="290" cy="120" r="5" fill="#f43f5e"/>
    <circle cx="290" cy="145" r="5" fill="#f43f5e"/>
    <circle cx="290" cy="170" r="5" fill="#f43f5e"/>
    <circle cx="290" cy="195" r="5" fill="#f43f5e"/>
    
    <line x1="300" y1="120" x2="390" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="300" y1="145" x2="390" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="300" y1="170" x2="390" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="300" y1="195" x2="390" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    
    <circle cx="400" cy="130" r="5" fill="#14b8a6"/>
    <circle cx="400" cy="155" r="5" fill="#14b8a6"/>
    <circle cx="400" cy="180" r="5" fill="#14b8a6"/>
    
    <text x="270" y="220" fill="#94a3b8" font-size="10">Domain</text>
    <text x="390" y="220" fill="#94a3b8" font-size="10">Codomain</text>
    <text x="270" y="240" fill="#f8fafc" font-size="9">Every output has input</text>
    <text x="270" y="255" fill="#94a3b8" font-size="9">Range = Codomain</text>
    
    <!-- Bijective Function -->
    <rect x="460" y="60" width="190" height="220" rx="8" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="495" y="85" fill="#14b8a6" font-size="14" font-weight="bold">Bijective</text>
    
    <circle cx="500" cy="120" r="5" fill="#f43f5e"/>
    <circle cx="500" cy="145" r="5" fill="#f43f5e"/>
    <circle cx="500" cy="170" r="5" fill="#f43f5e"/>
    
    <line x1="510" y1="120" x2="600" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="510" y1="145" x2="600" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="510" y1="170" x2="600" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    
    <circle cx="610" cy="120" r="5" fill="#14b8a6"/>
    <circle cx="610" cy="145" r="5" fill="#14b8a6"/>
    <circle cx="610" cy="170" r="5" fill="#14b8a6"/>
    
    <text x="480" y="220" fill="#94a3b8" font-size="10">Domain</text>
    <text x="600" y="220" fill="#94a3b8" font-size="10">Codomain</text>
    <text x="480" y="240" fill="#f8fafc" font-size="9">One-to-One + Onto</text>
    <text x="480" y="255" fill="#94a3b8" font-size="9">Invertible function</text>
    
    <!-- Legend -->
    <rect x="40" y="300" width="620" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="60" y="330" fill="#facc15" font-size="18" font-weight="bold">Function Types Summary</text>
    
    <rect x="60" y="350" width="280" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="375" fill="#38bdf8" font-size="14" font-weight="bold">Injective (One-to-One)</text>
    <text x="80" y="395" fill="#94a3b8" font-size="12">Every element of codomain is mapped by at most one element of domain</text>
    
    <rect x="360" y="350" width="280" height="70" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
    <text x="380" y="375" fill="#facc15" font-size="14" font-weight="bold">Surjective (Onto)</text>
    <text x="380" y="395" fill="#94a3b8" font-size="12">Every element of codomain is mapped by at least one element of domain</text>
    
    <rect x="60" y="435" width="280" height="70" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1"/>
    <text x="80" y="460" fill="#14b8a6" font-size="14" font-weight="bold">Bijective</text>
    <text x="80" y="480" fill="#94a3b8" font-size="12">Both Injective and Surjective. Has an inverse.</text>
    
    <rect x="360" y="435" width="280" height="70" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="380" y="460" fill="#f43f5e" font-size="14" font-weight="bold">Function Definition</text>
    <text x="380" y="480" fill="#94a3b8" font-size="12">Each input has exactly one output</text>
</svg>
