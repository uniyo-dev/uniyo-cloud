<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="24" font-weight="bold">QUADRATIC FUNCTIONS - PARABOLAS</text>
    
    <!-- Grid -->
    <line x1="80" y1="420" x2="620" y2="420" stroke="#334155" stroke-width="1"/>
    <line x1="350" y1="60" x2="350" y2="420" stroke="#334155" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="120" y1="420" x2="120" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="160" y1="420" x2="160" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="200" y1="420" x2="200" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="240" y1="420" x2="240" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="280" y1="420" x2="280" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="320" y1="420" x2="320" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="380" y1="420" x2="380" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="420" y1="420" x2="420" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="460" y1="420" x2="460" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="500" y1="420" x2="500" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="540" y1="420" x2="540" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="580" y1="420" x2="580" y2="415" stroke="#334155" stroke-width="1"/>
    
    <line x1="75" y1="380" x2="80" y2="380" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="340" x2="80" y2="340" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="300" x2="80" y2="300" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="260" x2="80" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="220" x2="80" y2="220" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="180" x2="80" y2="180" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="140" x2="80" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="100" x2="80" y2="100" stroke="#334155" stroke-width="1"/>
    
    <!-- Axes Labels -->
    <text x="620" y="440" fill="#f8fafc" font-size="14">x</text>
    <text x="350" y="50" fill="#f8fafc" font-size="14">y</text>
    
    <!-- Parabola (a > 0) - Opening Upward -->
    <path d="M 160 380 Q 250 180 350 140 Q 450 180 540 380" 
    stroke="#f43f5e" stroke-width="3" fill="none"/>
    <text x="550" y="390" fill="#f43f5e" font-size="14">y = x² - 3x + 2</text>
    
    <!-- Parabola (a < 0) - Opening Downward -->
    <path d="M 180 140 Q 270 280 350 320 Q 430 280 520 140" 
    stroke="#14b8a6" stroke-width="3" fill="none"/>
    <text x="530" y="135" fill="#14b8a6" font-size="14">y = -x² + 4x - 1</text>
    
    <!-- Vertex Points -->
    <circle cx="350" cy="140" r="5" fill="#f43f5e"/>
    <text x="360" y="135" fill="#f43f5e" font-size="12">Vertex (1.5, -0.25)</text>
    
    <circle cx="350" cy="320" r="5" fill="#14b8a6"/>
    <text x="360" y="325" fill="#14b8a6" font-size="12">Vertex (2, 3)</text>
    
    <!-- Roots -->
    <circle cx="200" cy="420" r="4" fill="#f8fafc"/>
    <text x="195" y="438" fill="#94a3b8" font-size="10">x=1</text>
    <circle cx="480" cy="420" r="4" fill="#f8fafc"/>
    <text x="475" y="438" fill="#94a3b8" font-size="10">x=2</text>
    
    <!-- Legend -->
    <rect x="60" y="440" width="580" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="462" fill="#f8fafc" font-size="13" font-weight="bold">Key Features:</text>
    <text x="220" y="462" fill="#94a3b8" font-size="12">a > 0 → opens upward (minimum)</text>
    <text x="410" y="462" fill="#94a3b8" font-size="12">a < 0 → opens downward (maximum)</text>
</svg>
