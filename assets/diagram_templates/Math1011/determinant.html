<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="520" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">MATRIX DETERMINANTS - 2×2 & 3×3</text>
    
    <!-- 2×2 Determinant -->
    <rect x="60" y="70" width="300" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="95" fill="#38bdf8" font-size="16" font-weight="bold">2×2 Determinant</text>
    
    <text x="140" y="125" fill="#f8fafc" font-size="18">|a  b|</text>
    <text x="140" y="150" fill="#f8fafc" font-size="18">|c  d|</text>
    
    <text x="250" y="125" fill="#facc15" font-size="18">=</text>
    <text x="280" y="125" fill="#f8fafc" font-size="18">ad - bc</text>
    
    <!-- Example 2×2 -->
    <text x="90" y="185" fill="#f43f5e" font-size="14">Example:</text>
    <text x="180" y="185" fill="#f8fafc" font-size="14">|2  3|</text>
    <text x="180" y="205" fill="#f8fafc" font-size="14">|4  5|</text>
    <text x="250" y="195" fill="#facc15" font-size="14">=</text>
    <text x="280" y="195" fill="#14b8a6" font-size="14">(2)(5) - (3)(4) = 10 - 12 = -2</text>
    
    <!-- 3×3 Determinant -->
    <rect x="390" y="70" width="280" height="180" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="460" y="95" fill="#f43f5e" font-size="16" font-weight="bold">3×3 Determinant</text>
    
    <text x="430" y="125" fill="#f8fafc" font-size="14">|a  b  c|</text>
    <text x="430" y="145" fill="#f8fafc" font-size="14">|d  e  f|</text>
    <text x="430" y="165" fill="#f8fafc" font-size="14">|g  h  i|</text>
    
    <text x="540" y="145" fill="#facc15" font-size="14">= a(ei - fh) - b(di - fg) + c(dh - eg)</text>
    
    <!-- Example 3×3 -->
    <text x="410" y="200" fill="#14b8a6" font-size="13">Example: |1 2 3|</text>
    <text x="410" y="218" fill="#14b8a6" font-size="13">         |4 5 6|</text>
    <text x="410" y="236" fill="#14b8a6" font-size="13">         |7 8 9|</text>
    
    <!-- Sarrus Rule -->
    <rect x="60" y="270" width="610" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="300" fill="#facc15" font-size="16" font-weight="bold">Sarrus Rule (for 3×3):</text>
    
    <!-- Sarrus Diagram -->
    <text x="100" y="340" fill="#f8fafc" font-size="16">a  b  c | a  b</text>
    <text x="100" y="365" fill="#f8fafc" font-size="16">d  e  f | d  e</text>
    <text x="100" y="390" fill="#f8fafc" font-size="16">g  h  i | g  h</text>
    
    <!-- Arrows -->
    <text x="300" y="340" fill="#f43f5e" font-size="18">↘</text>
    <text x="300" y="365" fill="#f43f5e" font-size="18">↘</text>
    <text x="300" y="390" fill="#f43f5e" font-size="18">↘</text>
    
    <text x="340" y="340" fill="#14b8a6" font-size="18">↘</text>
    <text x="340" y="365" fill="#14b8a6" font-size="18">↘</text>
    <text x="340" y="390" fill="#14b8a6" font-size="18">↘</text>
    
    <text x="400" y="340" fill="#f43f5e" font-size="18">↙</text>
    <text x="400" y="365" fill="#f43f5e" font-size="18">↙</text>
    <text x="400" y="390" fill="#f43f5e" font-size="18">↙</text>
    
    <text x="440" y="340" fill="#14b8a6" font-size="18">↙</text>
    <text x="440" y="365" fill="#14b8a6" font-size="18">↙</text>
    <text x="440" y="390" fill="#14b8a6" font-size="18">↙</text>
    
    <text x="500" y="355" fill="#f8fafc" font-size="14">= (aei + bfg + cdh) - (ceg + bdi + afh)</text>
</svg>
