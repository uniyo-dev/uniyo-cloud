<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">SET THEORY - VENN DIAGRAMS</text>
    
    <!-- Universal Set -->
    <rect x="60" y="60" width="580" height="380" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="580" y="85" fill="#38bdf8" font-size="14">Universal Set (U)</text>
    
    <!-- Set A -->
    <circle cx="280" cy="220" r="100" fill="#f43f5e" opacity="0.25" stroke="#f43f5e" stroke-width="2"/>
    <text x="250" y="215" fill="#f43f5e" font-size="18" font-weight="bold">A</text>
    
    <!-- Set B -->
    <circle cx="430" cy="220" r="100" fill="#14b8a6" opacity="0.25" stroke="#14b8a6" stroke-width="2"/>
    <text x="400" y="215" fill="#14b8a6" font-size="18" font-weight="bold">B</text>
    
    <!-- Elements -->
    <text x="230" y="180" fill="#f8fafc" font-size="12">1</text>
    <text x="260" y="180" fill="#f8fafc" font-size="12">2</text>
    <text x="330" y="200" fill="#f8fafc" font-size="12">4</text>
    <text x="360" y="180" fill="#f8fafc" font-size="12">5</text>
    <text x="390" y="200" fill="#f8fafc" font-size="12">6</text>
    <text x="420" y="180" fill="#f8fafc" font-size="12">7</text>
    <text x="340" y="240" fill="#f8fafc" font-size="12">3</text>
    <text x="310" y="280" fill="#f8fafc" font-size="12">8</text>
    
    <!-- Labels -->
    <text x="480" y="140" fill="#f43f5e" font-size="14">A ∪ B = {1,2,3,4,5,6,7}</text>
    <text x="480" y="160" fill="#14b8a6" font-size="14">A ∩ B = {3,4}</text>
    <text x="480" y="180" fill="#f8fafc" font-size="14">A \ B = {1,2}</text>
    <text x="480" y="200" fill="#94a3b8" font-size="14">B \ A = {5,6}</text>
    
    <!-- Set Operations Section -->
    <rect x="60" y="420" width="580" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="445" fill="#facc15" font-size="14" font-weight="bold">Set Operations:</text>
    <text x="240" y="445" fill="#f8fafc" font-size="13">Union (∪) : All elements in A or B</text>
    <text x="450" y="445" fill="#f8fafc" font-size="13">Intersection (∩) : Elements in both A and B</text>
    <text x="80" y="465" fill="#94a3b8" font-size="12">Complement (A') : Elements not in A</text>
    <text x="300" y="465" fill="#94a3b8" font-size="12">Difference (A\B) : Elements in A but not in B</text>
</svg>
