<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="24" font-weight="bold">MATRIX INVERSE - 2×2</text>
    
    <!-- Original Matrix -->
    <rect x="60" y="70" width="200" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="95" fill="#38bdf8" font-size="16" font-weight="bold">Matrix A</text>
    <text x="130" y="125" fill="#f8fafc" font-size="18">[a  b]</text>
    <text x="130" y="150" fill="#f8fafc" font-size="18">[c  d]</text>
    
    <text x="100" y="185" fill="#94a3b8" font-size="12">det(A) = ad - bc</text>
    <text x="100" y="205" fill="#94a3b8" font-size="12">A⁻¹ exists if det(A) ≠ 0</text>
    
    <!-- Arrow -->
    <text x="290" y="160" fill="#facc15" font-size="28">→</text>
    
    <!-- Inverse Matrix -->
    <rect x="350" y="70" width="200" height="180" rx="8" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="395" y="95" fill="#14b8a6" font-size="16" font-weight="bold">A⁻¹</text>
    <text x="380" y="125" fill="#f8fafc" font-size="16">1     [ d  -b ]</text>
    <text x="380" y="150" fill="#f8fafc" font-size="16">───  [ -c  a ]</text>
    <text x="390" y="165" fill="#f8fafc" font-size="16">det(A)</text>
    
    <!-- Example -->
    <rect x="60" y="280" width="580" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="310" fill="#facc15" font-size="16" font-weight="bold">Example: Find inverse of A = |2  3|</text>
    <text x="80" y="330" fill="#facc15" font-size="16">                       |4  5|</text>
    
    <text x="80" y="360" fill="#38bdf8" font-size="14">Step 1: Find det(A)</text>
    <text x="100" y="380" fill="#94a3b8" font-size="13">det(A) = (2)(5) - (3)(4) = 10 - 12 = -2</text>
    
    <text x="80" y="410" fill="#38bdf8" font-size="14">Step 2: Apply formula</text>
    <text x="100" y="430" fill="#f8fafc" font-size="13">A⁻¹ = 1/(-2) × [5  -3]</text>
    <text x="100" y="450" fill="#f8fafc" font-size="13">          [-4   2]</text>
</svg>
