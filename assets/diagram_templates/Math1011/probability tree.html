<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="520" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">PROBABILITY - TREE DIAGRAM</text>
    
    <!-- Start Node -->
    <circle cx="100" cy="100" r="25" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
    <text x="90" y="105" fill="#facc15" font-size="12" font-weight="bold">Start</text>
    
    <!-- Branch 1: Coin Toss -->
    <line x1="125" y1="100" x2="220" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <line x1="125" y1="100" x2="220" y2="140" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Heads -->
    <circle cx="230" cy="50" r="20" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="222" y="55" fill="#f43f5e" font-size="12" font-weight="bold">H</text>
    <text x="215" y="40" fill="#94a3b8" font-size="10">P = 1/2</text>
    
    <!-- Tails -->
    <circle cx="230" cy="150" r="20" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
    <text x="222" y="155" fill="#14b8a6" font-size="12" font-weight="bold">T</text>
    <text x="215" y="140" fill="#94a3b8" font-size="10">P = 1/2</text>
    
    <!-- Branch 2: Die Roll (from Heads) -->
    <line x1="250" y1="50" x2="340" y2="30" stroke="#f59e0b" stroke-width="2"/>
    <line x1="250" y1="50" x2="340" y2="60" stroke="#f59e0b" stroke-width="2"/>
    <line x1="250" y1="50" x2="340" y2="90" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Die Outcomes from Heads -->
    <circle cx="350" cy="25" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="30" fill="#f59e0b" font-size="11">1</text>
    <text x="340" y="15" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <circle cx="350" cy="55" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="60" fill="#f59e0b" font-size="11">2</text>
    <text x="340" y="45" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <circle cx="350" cy="85" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="90" fill="#f59e0b" font-size="11">3</text>
    <text x="340" y="75" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <!-- Branch 3: Die Roll (from Tails) -->
    <line x1="250" y1="150" x2="340" y2="120" stroke="#f59e0b" stroke-width="2"/>
    <line x1="250" y1="150" x2="340" y2="150" stroke="#f59e0b" stroke-width="2"/>
    <line x1="250" y1="150" x2="340" y2="180" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Die Outcomes from Tails -->
    <circle cx="350" cy="115" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="120" fill="#f59e0b" font-size="11">4</text>
    <text x="340" y="105" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <circle cx="350" cy="145" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="150" fill="#f59e0b" font-size="11">5</text>
    <text x="340" y="135" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <circle cx="350" cy="175" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="345" y="180" fill="#f59e0b" font-size="11">6</text>
    <text x="340" y="165" fill="#94a3b8" font-size="9">P=1/6</text>
    
    <!-- Probability Calculations -->
    <rect x="60" y="230" width="580" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="260" fill="#facc15" font-size="18" font-weight="bold">Probability Calculations:</text>
    
    <rect x="80" y="280" width="250" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="305" fill="#38bdf8" font-size="14" font-weight="bold">P(H and 1):</text>
    <text x="100" y="325" fill="#f8fafc" font-size="13">= P(H) × P(1|H)</text>
    <text x="100" y="345" fill="#94a3b8" font-size="12">= 1/2 × 1/6 = 1/12</text>
    
    <rect x="350" y="280" width="270" height="90" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="370" y="305" fill="#f43f5e" font-size="14" font-weight="bold">P(T and 6):</text>
    <text x="370" y="325" fill="#f8fafc" font-size="13">= P(T) × P(6|T)</text>
    <text x="370" y="345" fill="#94a3b8" font-size="12">= 1/2 × 1/6 = 1/12</text>
    
    <rect x="80" y="385" width="540" height="80" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1"/>
    <text x="100" y="410" fill="#14b8a6" font-size="14" font-weight="bold">Key Probability Rules:</text>
    <text x="100" y="435" fill="#f8fafc" font-size="13">• Multiplication Rule: P(A∩B) = P(A) × P(B|A)</text>
    <text x="100" y="455" fill="#f8fafc" font-size="13">• Sum of all outcomes = 1</text>
</svg>
