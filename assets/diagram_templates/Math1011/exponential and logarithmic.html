<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="160" y="35" fill="#facc15" font-size="24" font-weight="bold">EXPONENTIAL & LOGARITHMIC FUNCTIONS</text>
    
    <!-- Grid -->
    <line x1="80" y1="420" x2="620" y2="420" stroke="#334155" stroke-width="1"/>
    <line x1="350" y1="60" x2="350" y2="420" stroke="#334155" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="140" y1="420" x2="140" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="210" y1="420" x2="210" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="280" y1="420" x2="280" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="420" y1="420" x2="420" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="490" y1="420" x2="490" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="560" y1="420" x2="560" y2="415" stroke="#334155" stroke-width="1"/>
    
    <line x1="75" y1="350" x2="80" y2="350" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="280" x2="80" y2="280" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="210" x2="80" y2="210" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="140" x2="80" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="70" x2="80" y2="70" stroke="#334155" stroke-width="1"/>
    
    <!-- Axes Labels -->
    <text x="620" y="440" fill="#f8fafc" font-size="14">x</text>
    <text x="350" y="50" fill="#f8fafc" font-size="14">y</text>
    
    <!-- Exponential Function (y = 2^x) -->
    <path d="M 140 385 Q 210 350 280 280 Q 350 210 420 140 Q 490 100 560 85" 
    stroke="#f43f5e" stroke-width="3" fill="none"/>
    <text x="570" y="90" fill="#f43f5e" font-size="14">y = 2ˣ</text>
    
    <!-- Logarithmic Function (y = log₂(x)) -->
    <path d="M 210 85 Q 280 140 350 210 Q 420 280 490 350 Q 560 385 590 395" 
    stroke="#14b8a6" stroke-width="3" fill="none"/>
    <text x="600" y="400" fill="#14b8a6" font-size="14">y = log₂(x)</text>
    
    <!-- Asymptote for Exponential -->
    <line x1="80" y1="420" x2="600" y2="420" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="80" y="438" fill="#94a3b8" font-size="10">y = 0 (Asymptote)</text>
    
    <!-- Asymptote for Logarithmic -->
    <line x1="350" y1="60" x2="350" y2="420" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="355" y="55" fill="#94a3b8" font-size="10">x = 0 (Asymptote)</text>
    
    <!-- Intersection Point -->
    <circle cx="350" cy="210" r="5" fill="#facc15"/>
    <text x="360" y="205" fill="#facc15" font-size="12">Intersection</text>
    
    <!-- Legend -->
    <rect x="60" y="440" width="580" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="462" fill="#f8fafc" font-size="13" font-weight="bold">Key Properties:</text>
    <text x="240" y="462" fill="#94a3b8" font-size="12">Exponential: grows rapidly</text>
    <text x="430" y="462" fill="#94a3b8" font-size="12">Logarithmic: inverse of exponential</text>
</svg>
