<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="24" font-weight="bold">MATRIX OPERATIONS - ADDITION & SUBTRACTION</text>
    
    <!-- Matrix A -->
    <rect x="60" y="70" width="100" height="120" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="95" fill="#38bdf8" font-size="14" font-weight="bold">A</text>
    <text x="95" y="118" fill="#f8fafc" font-size="16">[1 2]</text>
    <text x="95" y="140" fill="#f8fafc" font-size="16">[3 4]</text>
    
    <!-- Plus Sign -->
    <text x="190" y="140" fill="#facc15" font-size="28">+</text>
    
    <!-- Matrix B -->
    <rect x="230" y="70" width="100" height="120" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="250" y="95" fill="#f43f5e" font-size="14" font-weight="bold">B</text>
    <text x="265" y="118" fill="#f8fafc" font-size="16">[5 6]</text>
    <text x="265" y="140" fill="#f8fafc" font-size="16">[7 8]</text>
    
    <!-- Equals -->
    <text x="360" y="140" fill="#facc15" font-size="28">=</text>
    
    <!-- Result A+B -->
    <rect x="400" y="70" width="100" height="120" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="410" y="95" fill="#14b8a6" font-size="14" font-weight="bold">A+B</text>
    <text x="435" y="118" fill="#f8fafc" font-size="16">[6 8]</text>
    <text x="435" y="140" fill="#f8fafc" font-size="16">[10 12]</text>
    
    <!-- Subtraction -->
    <!-- Matrix A -->
    <rect x="60" y="220" width="100" height="120" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="245" fill="#38bdf8" font-size="14" font-weight="bold">A</text>
    <text x="95" y="268" fill="#f8fafc" font-size="16">[1 2]</text>
    <text x="95" y="290" fill="#f8fafc" font-size="16">[3 4]</text>
    
    <!-- Minus Sign -->
    <text x="190" y="290" fill="#facc15" font-size="28">-</text>
    
    <!-- Matrix B -->
    <rect x="230" y="220" width="100" height="120" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="250" y="245" fill="#f43f5e" font-size="14" font-weight="bold">B</text>
    <text x="265" y="268" fill="#f8fafc" font-size="16">[5 6]</text>
    <text x="265" y="290" fill="#f8fafc" font-size="16">[7 8]</text>
    
    <!-- Equals -->
    <text x="360" y="290" fill="#facc15" font-size="28">=</text>
    
    <!-- Result A-B -->
    <rect x="400" y="220" width="100" height="120" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="410" y="245" fill="#14b8a6" font-size="14" font-weight="bold">A-B</text>
    <text x="435" y="268" fill="#f8fafc" font-size="16">[-4 -4]</text>
    <text x="435" y="290" fill="#f8fafc" font-size="16">[-4 -4]</text>
    
    <!-- Rules Box -->
    <rect x="540" y="70" width="140" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="560" y="95" fill="#facc15" font-size="14" font-weight="bold">Rules:</text>
    <text x="560" y="120" fill="#94a3b8" font-size="12">1. Same size</text>
    <text x="560" y="145" fill="#94a3b8" font-size="12">2. Add/Subtract</text>
    <text x="560" y="170" fill="#94a3b8" font-size="12">corresponding</text>
    <text x="560" y="195" fill="#94a3b8" font-size="12">elements</text>
    <text x="560" y="225" fill="#f8fafc" font-size="12">Formula:</text>
    <text x="560" y="250" fill="#facc15" font-size="12">(A+B)ᵢⱼ = Aᵢⱼ + Bᵢⱼ</text>
    <text x="560" y="280" fill="#facc15" font-size="12">(A-B)ᵢⱼ = Aᵢⱼ - Bᵢⱼ</text>
</svg>
