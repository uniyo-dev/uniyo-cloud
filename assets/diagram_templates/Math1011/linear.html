<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="500" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="180" y="35" fill="#facc15" font-size="24" font-weight="bold">LINEAR EQUATIONS - SLOPE-INTERCEPT FORM</text>
    
    <!-- Grid -->
    <line x1="80" y1="420" x2="600" y2="420" stroke="#334155" stroke-width="1"/>
    <line x1="340" y1="60" x2="340" y2="420" stroke="#334155" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="120" y1="420" x2="120" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="160" y1="420" x2="160" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="200" y1="420" x2="200" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="240" y1="420" x2="240" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="280" y1="420" x2="280" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="320" y1="420" x2="320" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="420" x2="360" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="400" y1="420" x2="400" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="440" y1="420" x2="440" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="480" y1="420" x2="480" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="520" y1="420" x2="520" y2="415" stroke="#334155" stroke-width="1"/>
    <line x1="560" y1="420" x2="560" y2="415" stroke="#334155" stroke-width="1"/>
    
    <line x1="75" y1="380" x2="80" y2="380" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="340" x2="80" y2="340" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="300" x2="80" y2="300" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="260" x2="80" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="220" x2="80" y2="220" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="180" x2="80" y2="180" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="140" x2="80" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="75" y1="100" x2="80" y2="100" stroke="#334155" stroke-width="1"/>
    
    <!-- Axes Labels -->
    <text x="600" y="440" fill="#f8fafc" font-size="14">x</text>
    <text x="340" y="50" fill="#f8fafc" font-size="14">y</text>
    
    <!-- Positive Slope Line (m > 0) -->
    <line x1="160" y1="380" x2="520" y2="140" stroke="#f43f5e" stroke-width="3"/>
    <text x="530" y="135" fill="#f43f5e" font-size="14">y = 2x + 3</text>
    
    <!-- Negative Slope Line (m < 0) -->
    <line x1="160" y1="140" x2="520" y2="380" stroke="#14b8a6" stroke-width="3"/>
    <text x="530" y="395" fill="#14b8a6" font-size="14">y = -2x + 5</text>
    
    <!-- Horizontal Line (m = 0) -->
    <line x1="120" y1="260" x2="560" y2="260" stroke="#facc15" stroke-width="3"/>
    <text x="570" y="265" fill="#facc15" font-size="14">y = 3</text>
    
    <!-- Slope Labels -->
    <text x="380" y="270" fill="#f43f5e" font-size="12">↑ Slope = 2</text>
    <text x="380" y="290" fill="#14b8a6" font-size="12">↓ Slope = -2</text>
    
    <!-- Origin -->
    <circle cx="340" cy="420" r="4" fill="#f8fafc"/>
    <text x="345" y="435" fill="#94a3b8" font-size="11">Origin (0,0)</text>
    
    <!-- Legend -->
    <rect x="60" y="440" width="580" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="462" fill="#f8fafc" font-size="13" font-weight="bold">Key Formula:</text>
    <text x="220" y="462" fill="#facc15" font-size="14">y = mx + b</text>
    <text x="340" y="462" fill="#94a3b8" font-size="13">m = slope, b = y-intercept</text>
    <text x="520" y="462" fill="#94a3b8" font-size="13">m = Δy / Δx</text>
</svg>
