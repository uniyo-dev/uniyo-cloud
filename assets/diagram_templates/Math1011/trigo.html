<svg width="700" height="550" viewBox="0 0 700 550" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="550" fill="#111827" rx="10"/>
    
    <!-- Title -->
    <text x="200" y="35" fill="#facc15" font-size="24" font-weight="bold">UNIT CIRCLE - TRIGONOMETRY</text>
    
    <!-- Unit Circle -->
    <circle cx="350" cy="280" r="160" fill="none" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Axes -->
    <line x1="100" y1="280" x2="600" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <line x1="350" y1="80" x2="350" y2="480" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Axis Labels -->
    <text x="600" y="295" fill="#94a3b8" font-size="14">x-axis</text>
    <text x="360" y="85" fill="#94a3b8" font-size="14">y-axis</text>
    
    <!-- Quarter Labels -->
    <text x="350" y="285" fill="#f8fafc" font-size="12">O</text>
    <text x="510" y="285" fill="#f8fafc" font-size="12">1</text>
    <text x="185" y="285" fill="#f8fafc" font-size="12">-1</text>
    <text x="355" y="120" fill="#f8fafc" font-size="12">1</text>
    <text x="355" y="440" fill="#f8fafc" font-size="12">-1</text>
    
    <!-- Angles -->
    <!-- 30° angle -->
    <line x1="350" y1="280" x2="350" y2="160" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 350 280 L 490 160" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="490" cy="160" r="5" fill="#f43f5e"/>
    <text x="495" y="155" fill="#f43f5e" font-size="11">30°</text>
    
    <!-- 45° angle -->
    <line x1="350" y1="280" x2="490" y2="120" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="490" cy="120" r="5" fill="#14b8a6"/>
    <text x="495" y="115" fill="#14b8a6" font-size="11">45°</text>
    
    <!-- 60° angle -->
    <line x1="350" y1="280" x2="550" y2="120" stroke="#facc15" stroke-width="2"/>
    <circle cx="550" cy="120" r="5" fill="#facc15"/>
    <text x="555" y="115" fill="#facc15" font-size="11">60°</text>
    
    <!-- 90° angle -->
    <line x1="350" y1="280" x2="350" y2="120" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="350" cy="120" r="5" fill="#f8fafc"/>
    <text x="355" y="115" fill="#f8fafc" font-size="11">90°</text>
    
    <!-- Special Points -->
    <!-- π/6 -->
    <text x="430" y="195" fill="#94a3b8" font-size="10">(√3/2, 1/2)</text>
    <!-- π/4 -->
    <text x="430" y="155" fill="#94a3b8" font-size="10">(√2/2, √2/2)</text>
    <!-- π/3 -->
    <text x="470" y="130" fill="#94a3b8" font-size="10">(1/2, √3/2)</text>
    
    <!-- Legend -->
    <rect x="60" y="490" width="580" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="512" fill="#f8fafc" font-size="13" font-weight="bold">Key Values:</text>
    <text x="240" y="512" fill="#94a3b8" font-size="12">sin θ = y</text>
    <text x="360" y="512" fill="#94a3b8" font-size="12">cos θ = x</text>
    <text x="480" y="512" fill="#94a3b8" font-size="12">tan θ = y/x</text>
</svg>
