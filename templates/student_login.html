{% extends "base.html" %}

{% block title %}Login - UNIYO
<script>
    // Check if student has registered before
    const hasAccount = localStorage.getItem('uniyo_has_account');
    
    if (hasAccount === 'true') {
        // Student has account → Login glows
        document.getElementById('loginBtn').style.animation = 'glowPulse 2s infinite';
        document.getElementById('createAccountBtn').style.animation = 'none';
        document.getElementById('createAccountBtn').style.boxShadow = '0 4px 20px rgba(109, 40, 217, 0.3)';
    } else {
        // First time → Create Account glows
        document.getElementById('createAccountBtn').style.animation = 'glowPulse 2s infinite';
        document.getElementById('loginBtn').style.animation = 'none';
    }
</script>

<style>
    @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 25px rgba(109, 40, 217, 0.6); }
        50% { box-shadow: 0 0 50px rgba(109, 40, 217, 1); }
    }
</style>

{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}

<script>
(function() {
    const savedDarkMode = localStorage.getItem('uniyo_dark_mode');
    if (savedDarkMode === 'false') {
        document.body.classList.add('light-mode');
    }
})();
</script>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="UNIYO Logo" class="auth-logo-img">
        </div>
            <h1>UNIYO</h1>
            <p>University Made for YOU</p>
            <span class="auth-subtitle">Your Freshman Year, Simplified.</span>
        </div>
        
        <form action="{{ url_for('student.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="identifier" placeholder="09XXXXXXXX or 07XXXXXXXX" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">🔐 Login</button>
        </form>
        
        <div class="auth-footer">
            <p style="margin-bottom: 14px; color: #94A3B8;">Don't have an account?</p>
        <a href="{{ url_for('student.register') }}" 
           style="display: block; text-align: center; padding: 14px 24px; 
                  background: linear-gradient(135deg, #6D28D9, #EC4899); 
                  color: white !important; border-radius: 12px; font-weight: 700; 
                  font-size: 15px; letter-spacing: 1px; text-transform: uppercase;
                  box-shadow: 0 4px 20px rgba(109, 40, 217, 0.4);
                  animation: createAccountPulse 2s infinite;
                  transition: all 0.3s ease;">
            ✨ Create Account ✨
        </a>


            <p><a href="#" class="text-muted">Forgot password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
