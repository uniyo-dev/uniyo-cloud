{% extends "base.html" %}

{% block title %}Login - UNIYO{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}

<script>
(function() {
    const savedDarkMode = localStorage.getItem('uniyo_dark_mode');
    if (savedDarkMode === 'false') {
        document.body.classList.add('light-mode');
    }
})();
</script>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="UNIYO Logo" class="auth-logo-img">
        </div>
            <h1>UNIYO</h1>
            <p>University Made for YOU</p>
            <span class="auth-subtitle">Your Freshman Year, Simplified.</span>
        </div>
        
        <form action="{{ url_for('student.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="identifier" placeholder="09XXXXXXXX or 07XXXXXXXX" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('student.register') }}">Register here</a></p>
            <p><a href="#" class="text-muted">Forgot password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
