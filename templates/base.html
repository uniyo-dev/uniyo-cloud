<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F19">


    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>{% block title %}UNIYO - University Made for YOU{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/popups.css') }}">
    {% block extra_css %}{% endblock %}

<!-- MathJax Configuration for LaTeX Formula Rendering -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'has-math'
    }
  };
</script>
<script id="MathJax-script" async src="{{ url_for('static', filename='mathjax/tex-mml-chtml.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme_manager.js') }}"></script>
</head>
<body>

    <div id="toast-container" class="toast-container"></div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}" onclick="this.remove()">
                    {{ message }}
                    <span class="flash-close">&times;</span>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='js/popups.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/offline-manager.js') }}"></script>
    
    <script>
        // Ensure body background follows theme
        function updateBodyBackground() {
            // Let CSS handle background colors
        }
        
        // No forced defaults - respect user choice only
        
        // Run on load
        updateBodyBackground();
        
        // Watch for changes
        const bodyObserver = new MutationObserver(updateBodyBackground);
        bodyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>
    
<script>
    // Mark page as loaded for smooth transitions
    document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.add('loaded');
    });
    
    // Prefetch on page visibility
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            document.body.classList.add('loaded');
        }
    });
</script>

{% block extra_js %}{% endblock %}
<script>
(function() {
    const isAdmin = window.location.pathname.includes('/admin');
    const key = isAdmin ? 'uniyo_admin_theme' : 'uniyo_student_theme';
    const saved = localStorage.getItem(key) || 'dark';
    
    if (saved === 'light') {
        document.body.classList.add('light-mode');
        document.documentElement.style.colorScheme = 'light';
    }
})();
</script>
</body>
</html>
